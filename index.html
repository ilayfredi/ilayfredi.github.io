/* hens pottering about the yard: walk a bit, stop, peck, repeat */
const HENS=[];
for(let i=0;i<4;i++) HENS.push({
  gx:1.5+hash(i*13)*10, gy:2+hash(i*29)*9, tx:0, tz:0, st:'idle', t:hash(i*7)*2,
  face:1, bob:hash(i*3)*6, col:i%2?'#FFFFFF':'#F3E2C0', comb:i===0?'#E8574A':'#F0705F'
});
function hensUpdate(){
  for(const h of HENS){
    h.t-=DT;
    if(h.t<=0){
      if(h.st==='walk'){ h.st='peck'; h.t=1.1+hash((h.gx*97)|0)*1.6; }
      else {
        h.st='walk'; h.t=1.4+hash((h.gy*53)|0)*1.8;
        const b=yardB();                      /* hens stay inside the fence */
        h.tx=clamp(h.gx+(Math.random()-0.5)*3.5,b.x0+0.5,b.x1-0.5);
        h.tz=clamp(h.gy+(Math.random()-0.5)*3.5,b.y0+0.5,b.y1-0.5);
        h.face=(h.tx<h.gx)?-1:1;
      }
    }
    if(h.st==='walk'){
      const dx=h.tx-h.gx, dz=h.tz-h.gy, d=Math.hypot(dx,dz);
      if(d>0.05){ h.gx+=dx/d*0.62*DT; h.gy+=dz/d*0.62*DT; }
      h.bob+=DT*9;
    }
  }
}
function drawHen(c,z,h){
  const walking=h.st==='walk';
  const bob=walking?Math.abs(Math.sin(h.bob))*2.6*z:0;
  const peck=(!walking)?clamp(Math.sin(T*6+h.gx)*1.6,-1,1):0;
  c.save();
  c.fillStyle='rgba(0,0,0,.18)';
  c.beginPath(); c.ellipse(0,0,13*z,5*z,0,0,TAU); c.fill();
  c.translate(0,-bob);
  c.scale(h.face,1);
  c.strokeStyle='#E7A23C'; c.lineWidth=2*z; c.lineCap='round';
  for(const s of [-1,1]){
    const sw=walking?Math.sin(h.bob+(s>0?0:Math.PI))*3*z:0;
    c.beginPath(); c.moveTo(s*2.5*z,-6*z); c.lineTo(s*2.5*z+sw,0); c.stroke();
  }
  c.fillStyle=h.col;
  c.beginPath(); c.ellipse(0,-12*z,10*z,8.5*z,0,0,TAU); c.fill();
  c.fillStyle='rgba(0,0,0,.08)';
  c.beginPath(); c.ellipse(-3*z,-11*z,6*z,5.5*z,0.3,0,TAU); c.fill();
  const hy=-20*z+peck*4*z, hx=5*z+peck*2*z;
  c.fillStyle=h.col;
  c.beginPath(); c.arc(hx,hy,5.4*z,0,TAU); c.fill();
  c.fillStyle=h.comb;
  c.beginPath(); c.arc(hx-1*z,hy-5*z,2.2*z,0,TAU); c.fill();
  c.beginPath(); c.arc(hx+2*z,hy-4.6*z,1.8*z,0,TAU); c.fill();
  c.fillStyle='#F2A93C';
  c.beginPath(); c.moveTo(hx+5*z,hy); c.lineTo(hx+9.5*z,hy+1.4*z); c.lineTo(hx+5*z,hy+2.8*z); c.closePath(); c.fill();
  c.fillStyle='#3A2A1C';
  c.beginPath(); c.arc(hx+2.2*z,hy-1*z,1.3*z,0,TAU); c.fill();
  c.restore();
}

/* birds crossing the sky band */
const BIRDS=[];
for(let i=0;i<5;i++) BIRDS.push({x:hash(i*31)*1.4-0.2, y:0.12+hash(i*17)*0.5, v:0.028+hash(i*7)*0.03, s:0.7+hash(i*5)*0.7, p:hash(i*11)*TAU});
function drawBirds(){
  const hz=horizonY();
  const dim=0.35+0.55*(1-SUN.night);
  ctx.save();
  ctx.strokeStyle='rgba(52,44,38,'+dim+')';
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const b of BIRDS){
    b.x+=b.v*DT; if(b.x>1.35) b.x=-0.25;
    b.p+=DT*7;
    const x=b.x*VW, y=b.y*hz;
    const flap=Math.sin(b.p)*0.55;
    const w=9*b.s;
    ctx.lineWidth=2.1*b.s;
    ctx.beginPath();
    ctx.moveTo(x-w,y+flap*w*0.7);
    ctx.quadraticCurveTo(x-w*0.35,y-flap*w*0.5,x,y);
    ctx.quadraticCurveTo(x+w*0.35,y-flap*w*0.5,x+w,y+flap*w*0.7);
    ctx.stroke();
  }
  ctx.restore();
}

/* a few butterflies drifting over the field — cheap, and the yard feels alive */
const BFLY=[];
for(let i=0;i<5;i++) BFLY.push({
  p:hash(i*13)*TAU, sp:0.17+hash(i*7)*0.15, rx:2.4+hash(i*3)*3.4, ry:1.6+hash(i*19)*2.2,
  cx:4+hash(i*5)*7, cy:6+hash(i*11)*5, lift:34+hash(i*23)*40,
  col:['#FFD54A','#FF9BC4','#8FD8FF','#C7A0FF','#FFF0A0'][i]
});
function butterflies(){
  const z=cam.z;
  if(z<0.4) return;
  const night=SUN.night;
  for(const b of BFLY){
    b.p+=b.sp*DT*(night>0.5?0.55:1);
    const gx=b.cx+Math.cos(b.p)*b.rx, gy=b.cy+Math.sin(b.p*1.3)*b.ry;
    const w=iso(gx,gy), s=w2s(w.x,w.y);
    const y=s.y-(b.lift+Math.sin(b.p*3.1)*10)*z;
    if(y<horizonY()) continue;
    if(night>0.5){
      /* after dark the butterflies turn in and the fireflies come out */
      const pulse=0.35+0.65*Math.abs(Math.sin(T*2.4+b.p*3));
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(s.x,y,0,s.x,y,13*z);
      g.addColorStop(0,'rgba(214,255,150,'+(0.85*pulse*night)+')');
      g.addColorStop(1,'rgba(180,255,120,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,y,13*z,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(238,255,190,'+(0.95*pulse)+')';
      ctx.beginPath(); ctx.arc(s.x,y,1.9*z,0,TAU); ctx.fill();
      ctx.restore();
      continue;
    }
    const flap=Math.abs(Math.sin(T*11+b.p*4));
    ctx.save(); ctx.globalAlpha=1-night*1.6; ctx.translate(s.x,y); ctx.rotate(Math.cos(b.p)*0.25);
    ctx.fillStyle=b.col;
    for(const sgn of [-1,1]){
      ctx.save(); ctx.scale(sgn*(0.35+0.65*flap),1);
      ctx.beginPath(); ctx.ellipse(4.4*z,-1.4*z,4.4*z,3.2*z,0.4,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3.4*z,2.4*z,3.2*z,2.4*z,-0.3,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle='#5A4227';
    ctx.beginPath(); ctx.ellipse(0,0,1.3*z,4*z,0,0,TAU); ctx.fill();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------- input */
let drag=null, moved=0, pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,id:e.pointerId}; moved=0;
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId||pinch) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  moved=Math.max(moved,Math.hypot(dx,dy));
  if(moved>10){ cam.x=drag.cx-dx/cam.z; cam.y=drag.cy-dy/cam.z; clampCam(); }
});
cv.addEventListener('pointerup',e=>{
  if(drag&&drag.id===e.pointerId&&moved<10) tapAt(e.clientX,e.clientY);
  drag=null;
});
cv.addEventListener('pointercancel',()=>{drag=null;});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.tz=clamp(cam.tz*(e.deltaY>0?0.9:1.11),0.3,1.9);
},{passive:false});
let tdist=0;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinch=true; drag=null;
    tdist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&tdist){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    cam.tz=clamp(cam.tz*(d/tdist),0.3,1.9); tdist=d;
  }
},{passive:true});
cv.addEventListener('touchend',e=>{ if(e.touches.length<2){ pinch=null; tdist=0; } },{passive:true});
function clampCam(){
  const c=iso(CX,CY);
  const sp=yardR()*2+8;
  const halfW=sp*TW/2, halfH=sp*TH/2;
  cam.x=clamp(cam.x,c.x-halfW,c.x+halfW);
  /* keep the far corner of the yard below the horizon, or the ground clip
     leaves the plots floating in the sky */
  const top=iso(yardB().x0-2,yardB().y0-2);
  const minY=top.y-(VH*0.52-horizonY()-40)/Math.max(0.2,cam.z);
  cam.y=clamp(cam.y,Math.max(c.y-halfH,minY),c.y+halfH+120);
}
function tapAt(sx,sy){
  const g=s2g(sx,sy);
  const gx=Math.round(g.gx), gy=Math.round(g.gy);
  const p=S.plots.find(q=>q.gx===gx&&q.gy===gy);
  if(!p) return;
  actx();
  if(p.i>=S.owned){
    if(p.i===S.owned) buyPlot(); else toast('קודם תרחיב את החלקות שלפניה');
    return;
  }
  const t=now();
  if(!p.sid){ pending=p; openSeeds(); return; }
  if(t>=p.at+p.dur){ harvest(p); return; }
  if(!p.wet){ water(p); return; }
  const st=BYID[p.sid];
  toast(st.nm+' — עוד '+clock(p.at+p.dur-t));
}

/* ---------------------------------------------------------------- actions */
let pending=null;
function plotScreen(p){ const s=tileTop(p.gx,p.gy); return s; }

function plant(p,st){
  if(S.coins<st.seed){ SFX.nope(); toast('אין מספיק כסף לזרעים'); return false; }
  S.coins-=st.seed;
  p.sid=st.id; p.at=now(); p.dur=growMs(st); p.wet=false; p.bk=undefined;
  S.planted=(S.planted||0)+1;
  if(S.ups.sprk>0){ p.wet=true; p.dur=Math.floor(p.dur*0.62); }
  const s=plotScreen(p);
  puff(s.x,s.y-20*cam.z,'#8A5A38',7);
  SFX.plant(); refreshHUD(); save();
  return true;
}
function water(p){
  if(p.wet) return;
  p.wet=true;
  const left=p.at+p.dur-now();
  p.dur-=Math.floor(left*0.4);
  const s=plotScreen(p);
  drops(s.x,s.y); SFX.water(); save();
}
function harvest(p){
  const st=BYID[p.sid]; if(!st) return;
  let q=Math.max(1,Math.round(2*yieldMul()));
  let crit=false;
  if(Math.random()<critChance()){ q*=2; crit=true; }
  S.inv[st.id]=(S.inv[st.id]||0)+q;
  S.harvested+=q;
  addXP(st.xp);
  p.sid=null; p.at=0; p.dur=0; p.wet=false;
  const s=plotScreen(p);
  plantPop(s.x,s.y,st);
  puff(s.x,s.y-30*cam.z,st.leaf,12);
  popText(s.x,s.y-96*cam.z,'+'+q+(crit?' ×2!':''),crit?'#FFE066':'#CFF7B8');
  FRED.jump=1;
  SFX.reap(); refreshHUD(); save();
}
function sell(id,qty){
  const st=BYID[id]; const have=invOf(id);
  qty=Math.min(qty,have); if(qty<=0) return 0;
  const gain=qty*unitPrice(st);
  S.inv[id]=have-qty; if(S.inv[id]<=0) delete S.inv[id];
  S.coins+=gain; S.earned+=gain;
  SFX.coin(); coinBurst(VW*0.5,VH*0.55,Math.min(14,4+qty));
  popText(VW*0.5,VH*0.42,'+'+fmt(gain)+' ₪','#FFE9A8');
  refreshHUD(); save();
  return gain;
}
function buyPlot(){
  const c=plotCost();
  if(S.owned>=PLOT_SPOTS.length){ toast('החצר מלאה עד הגדר'); return; }
  if(S.coins<c){ SFX.nope(); toast('חלקה נוספת עולה '+fmt(c)+' ₪'); return; }
  S.coins-=c; S.owned++;
  const p=S.plots[S.owned-1], s=plotScreen(p);
  puff(s.x,s.y,'#6FBF4A',14);
  SFX.buy(); toast('חלקה חדשה נפתחה!'); refreshHUD(); save();
}
function addXP(n){
  S.xp+=n;
  let ups=[];
  while(S.xp>=xpNeed(S.level)){
    S.xp-=xpNeed(S.level); S.level++;
    const got=STRAINS.filter(s=>s.lvl===S.level);
    ups=ups.concat(got);
    S.coins+=S.level*45;
  }
  if(ups.length||S.level>1) refreshHUD();
  if(ups.length){
    SFX.level();
    $('luN').textContent=S.level;
    $('luU').textContent='נפתח זן חדש: '+ups.map(u=>u.nm).join(', ');
    showLevel();
  }
}
let luT=null;
function showLevel(){
  $('levelup').classList.add('on');
  clearTimeout(luT);
  luT=setTimeout(()=>$('levelup').classList.remove('on'),2400);
}

/* ---------------------------------------------------------------- orders */
function makeOrder(){
  const pool=STRAINS.filter(s=>unlocked(s));
  if(!pool.length) return null;
  const n=1+Math.floor(Math.random()*Math.min(3,pool.length));
  const items=[]; const used={};
  for(let i=0;i<n;i++){
    const st=pool[Math.floor(Math.random()*pool.length)];
    if(used[st.id]) continue;
    used[st.id]=1;
    items.push({id:st.id, q:1+Math.floor(Math.random()*4)});
  }
  let val=0; for(const it of items) val+=unitPrice(BYID[it.id])*it.q;
  return {
    id:'o'+now()+Math.floor(Math.random()*999),
    who:CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)],
    items, coins:Math.floor(val*1.55), xp:Math.max(4,Math.floor(val/60))
  };
}
function tickOrders(){
  if(S.orders.length>=3) return;
  if(now()-S.lastOrder < 45000) return;
  const o=makeOrder(); if(!o) return;
  S.orders.push(o); S.lastOrder=now();
  SFX.order(); toast('הזמנה חדשה מ' + o.who);
  refreshHUD(); save();
}
function canFill(o){ return o.items.every(it=>invOf(it.id)>=it.q); }
function fillOrder(o){
  if(!canFill(o)){ SFX.nope(); toast('חסר לך יבול להזמנה הזאת'); return; }
  for(const it of o.items){
    S.inv[it.id]-=it.q;
    if(S.inv[it.id]<=0) delete S.inv[it.id];
  }
  S.coins+=o.coins; S.earned+=o.coins; S.filled=(S.filled||0)+1;
  S.orders=S.orders.filter(x=>x.id!==o.id);
  addXP(o.xp);
  SFX.coin(); coinBurst(VW*0.5,VH*0.55,16);
  popText(VW*0.5,VH*0.42,'+'+fmt(o.coins)+' ₪','#FFE9A8');
  refreshHUD(); save(); openOrders();
}

  const dry=S.plots.filter(p=>p.i<S.owned&&p.sid&&!p.wet&&now()<p.at+p.dur).length;

}
$('qharvest').onclick=()=>{
  const list=S.plots.filter(p=>p.i<S.owned&&p.sid&&now()>=p.at+p.dur);
  list.forEach((p,i)=>setTimeout(()=>harvest(p),i*55));
};
$('qwater').onclick=()=>{
  const list=S.plots.filter(p=>p.i<S.owned&&p.sid&&!p.wet&&now()<p.at+p.dur);
  list.forEach((p,i)=>setTimeout(()=>{ water(p); refreshHUD(); },i*45));
};
$('qplant').onclick=()=>{
  const st=BYID[S.lastSeed]||STRAINS[0];
  const list=S.plots.filter(p=>p.i<S.owned&&!p.sid);

/* The menus sell the flower, not the shrub — every strain gets its own bud. */
function mkCanvas(st){
  const c=document.createElement('canvas');
  c.width=104; c.height=104;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(52,54,4,52,54,50);
  g.addColorStop(0,'rgba(255,255,255,.85)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.beginPath(); x.arc(52,54,50,0,TAU); x.fill();
  x.save(); x.translate(52,88);
  drawBud(x,31,st,true);
  x.restore();
  return c;
}

function openSeeds(){
  sheetMode='seeds';
  openSheet('שתילים', pending?'בחר זן לחלקה':'לחיצה תשתול בחלקה פנויה');
  const b=$('shBody'); b.innerHTML='';
  const grid=document.createElement('div'); grid.className='grid';
  for(const st of STRAINS){
    const card=document.createElement('div');
    const ok=unlocked(st);
    card.className='card'+(ok?'':' locked');
    const top=document.createElement('div'); top.className='top';
    top.appendChild(mkCanvas(st,1));
    const nm=document.createElement('div');
    nm.innerHTML='<div class="nm">'+st.nm+'</div>'+
      '<div class="meta"><span>⏱ '+clock(growMs(st))+'</span></div>';
    top.appendChild(nm);
    card.appendChild(top);
    const tags=document.createElement('div'); tags.className='tagrow';
    tags.innerHTML='<span class="tg green">זרע '+fmt(st.seed)+'</span>'+
                   '<span class="tg gold">מכירה '+fmt(unitPrice(st))+'</span>';
    card.appendChild(tags);
    const btn=document.createElement('button');
    btn.className='buy j j-green';
    btn.textContent = ok ? ('שתול · '+fmt(st.seed)+' ₪') : ('רמה '+st.lvl);
    if(!ok) btn.disabled=true;
    card.appendChild(btn);
    if(!ok){
      const lb=document.createElement('div'); lb.className='lockbadge';
      lb.textContent='נפתח ברמה '+st.lvl;
      card.appendChild(lb);
    } else {
      const act=()=>{
        S.lastSeed=st.id;
        let target=pending;
        if(!target||target.sid||target.i>=S.owned) target=S.plots.find(p=>p.i<S.owned&&!p.sid);
        if(!target){ toast('אין חלקה פנויה'); return; }
        if(plant(target,st)){ closeSheet(); refreshHUD(); }
      };
      card.onclick=act;
    }
    grid.appendChild(card);
  }
  b.appendChild(grid);
  stagger();
}

function openBarn(){
  sheetMode='barn';
  const ids=Object.keys(S.inv).filter(k=>S.inv[k]>0);
  let total=0; ids.forEach(id=>total+=S.inv[id]*unitPrice(BYID[id]));

  }
  const all=document.createElement('button');
  all.className='buy j j-gold'; all.style.marginBottom='12px';

    const qty=document.createElement('div'); qty.className='qty'; qty.textContent=fmt(q);

/* ---------------------------------------------------------------- loop */
let last=performance.now(), acc=0;
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t; T+=dt; DT=dt;
  FRED.jump=Math.max(0,FRED.jump-dt*2.1);
  cam.z=lerp(cam.z,cam.tz,1-Math.pow(0.002,dt));
  resizeIfNeeded();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scene(dt);
  acc+=dt;
  if(acc>0.5){
    acc=0; tickOrders(); refreshHUD();
    if(sheetMode==='orders') { /* keep buttons live */
      const btns=$('shBody').querySelectorAll('.mini');
      S.orders.forEach((o,i)=>{ if(btns[i]) btns[i].disabled=!canFill(o); });
    }
  }
  requestAnimationFrame(frame);
}
let lastW=0,lastH=0;
function resizeIfNeeded(){
  const w=cv.clientWidth||window.innerWidth, h=cv.clientHeight||window.innerHeight;
  if(w===lastW&&h===lastH) return;
  /* a rotation or a big window change can leave the yard off screen entirely */
  const big=Math.abs(w-lastW)>140||Math.abs(h-lastH)>140;
  lastW=w; lastH=h; resize();
  if(big) fitCam();
}

/* ---------------------------------------------------------------- boot */
function offlineReport(){
  const box=$('offbox'); box.innerHTML='';
  const gone=now()-(S.lastSeen||now());
  if(S.seen && gone>=60000){
    const rdy=S.plots.filter(p=>p.i<S.owned&&p.sid&&now()>=p.at+p.dur).length;
    const mins=Math.floor(gone/60000);
    const r=document.createElement('div'); r.className='offrow';
    r.innerHTML='<span>לא היית '+(mins<60?mins+' דקות':Math.floor(mins/60)+' שעות')+'</span>'+
                '<b>'+rdy+' מוכנים לקציר</b>';
    box.appendChild(r);
  }
  if(S.seen && dailyReady()){
    const r=document.createElement('div'); r.className='offrow';
    r.innerHTML='<span>בונוס יומי מחכה לך</span><b>'+fmt(dailyAmount())+' ₪</b>';
    box.appendChild(r);
  }
}

function boot(){
  const p=load();
  S = p || fresh();
  if(!S.ups) S.ups={lamp:0,fert:0,sprk:0,mrkt:0,ghs:0};
  for(const k of ['lamp','fert','sprk','mrkt','ghs']) if(typeof S.ups[k]!=='number') S.ups[k]=0;
  if(!S.inv) S.inv={};
  if(!S.orders) S.orders=[];
  if(!S.goals) S.goals={};
  if(!S.decor) S.decor={};
  /* Saves made before the yard/house upgrades have no levels. Defaulting them
     to zero demoted existing farms to the smallest yard and a shack, wiping
     plots people had paid for — so infer a level that fits their progress. */
  const legacy=(typeof S.yardLvl!=='number');
  for(const k of ['yardLvl','houseLvl']) if(typeof S[k]!=='number') S[k]=0;
  S.yardLvl=clamp(S.yardLvl,0,YARD.length-1);
  S.houseLvl=clamp(S.houseLvl,0,HOUSE_LV.length-1);
  if(legacy){
    const lv=S.level||1;
    S.houseLvl=clamp(lv>=50?5:lv>=35?4:lv>=20?3:2,0,HOUSE_LV.length-1);
  }
  /* whatever the source, never leave someone owning more plots than the yard
     has room for */
  for(let y=S.yardLvl;y<YARD.length;y++){
    S.yardLvl=y; rebuildSpots();
    if(PLOT_SPOTS.length>=(S.owned||0)) break;
  }
  for(const k of ['filled','planted','days']) if(typeof S[k]!=='number') S[k]=0;
  if(typeof S.sfx!=='boolean') S.sfx=true;
  A.on=S.sfx;
  if(typeof S.prestige!=='number') S.prestige=0;
  S.plots=Array.isArray(S.plots)?S.plots:[];
  /* re-seat plots onto the canonical layout, keeping planted state */
  const old=S.plots;
  S.plots=[];
  ensurePlots();
  for(let i=0;i<Math.min(old.length,S.plots.length);i++){
    const o=old[i];
    if(o&&o.sid&&BYID[o.sid]){ S.plots[i].sid=o.sid; S.plots[i].at=o.at; S.plots[i].dur=o.dur; S.plots[i].wet=!!o.wet; }
  }
  S.owned=clamp(S.owned||6,1,PLOT_SPOTS.length);

  document.body.classList.add('pre');
  resize(); fitCam();
  updateSun();                       /* so the clock pill is right on frame one */
  refreshHUD();
  const wa=$('iwa'); if(wa) wa.href=waLink();
  offlineReport();
  if(S.seen) $('introTxt').textContent='החצר ממשיכה לגדול גם כשאתה לא כאן. בוא נראה מה קרה.';
  $('istart').textContent = S.seen?'חזרה לחצר':'לחצר!';
  $('ireset').style.display = S.seen?'block':'none';
  requestAnimationFrame(frame);
}
$('istart').onclick=()=>{
  actx();
  S.seen=true; save();
  document.body.classList.remove('pre');
  const el=$('intro'); el.style.opacity='0';
  setTimeout(()=>el.remove(),520);
  if(!S.plots.some(p=>p.sid) && S.coins>=STRAINS[0].seed) toast('לחץ על חלקה חומה כדי לשתול');
};
$('ireset').onclick=()=>{
  if(!confirm("להתחיל חווה חדשה לגמרי? כל ההתקדמות תימחק.")) return;
  hardReset();
};
addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);
setInterval(save,15000);

boot();
window.__FARM={get S(){return S;}, fmt, STRAINS, plant, harvest, sell, addXP, refreshHUD,
  hour(h){ HOUR_OVERRIDE=h; },
  ensure(){ ensurePlots(); fitCam(); },
  sim(n){ for(const p of S.plots){ if(p.sid) p.at-=n; } }};
})();
</script>
