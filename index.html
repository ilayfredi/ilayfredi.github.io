<title>החצר של פרדי</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --sky1:#4FC3E8; --sky2:#8FDCF3; --sky3:#C8EFDF;
  --grass:#5FB53F; --grass2:#4A9A31;
  --soil:#8A5A38; --soil2:#6B4327;
  --wood:#C58C50; --wood-d:#8B5E33; --wood-x:#5E3A18;
  --cream:#FFF8EA; --cream2:#FFE9C2;
  --ink:#3A2712; --ink2:#7A6248;
  --gold:#FFC93C; --gold-d:#E09B18; --gold-x:#A9740A;
  --green:#5CC24A; --green-d:#3C9430; --green-x:#2A6B22;
  --blue:#49B9E8; --blue-d:#2B8CBE;
  --red:#F0594A; --purple:#9B6BD6;
  --disp:"Fredoka","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --ui:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#4FC3E8;color:var(--ink);
  font-family:var(--ui);font-weight:600;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:none;direction:rtl}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums}

/* ============================================================ juicy button */
.j{position:relative;border:0;cursor:pointer;font-family:var(--disp);font-weight:600;
  color:#fff;overflow:hidden;transition:transform .09s ease, box-shadow .09s ease}
.j::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));
  border-radius:inherit;pointer-events:none}
.j:active{transform:translateY(4px)}
.j-green{background:linear-gradient(#8BE06A,#4FB63C 52%,#3F9A33);
  box-shadow:0 5px 0 var(--green-x),0 10px 20px rgba(0,0,0,.28)}
.j-green:active{box-shadow:0 1px 0 var(--green-x),0 4px 10px rgba(0,0,0,.25)}
.j-gold{background:linear-gradient(#FFE07A,#FFC42F 52%,#EDA612);color:#513404;
  box-shadow:0 5px 0 var(--gold-x),0 10px 20px rgba(0,0,0,.28)}
.j-gold:active{box-shadow:0 1px 0 var(--gold-x),0 4px 10px rgba(0,0,0,.25)}
.j-blue{background:linear-gradient(#7FD6F5,#3FAEE0 52%,#2C90C2);
  box-shadow:0 5px 0 #1E6E97,0 10px 20px rgba(0,0,0,.28)}
.j-blue:active{box-shadow:0 1px 0 #1E6E97,0 4px 10px rgba(0,0,0,.25)}
.j-cream{background:linear-gradient(#FFFDF6,#FFEBC8 55%,#F6DCAE);color:var(--ink);
  box-shadow:0 5px 0 #B8905C,0 10px 20px rgba(0,0,0,.22)}
.j-cream:active{box-shadow:0 1px 0 #B8905C,0 4px 10px rgba(0,0,0,.2)}
.j[disabled]{filter:grayscale(.65) brightness(.92);pointer-events:none;opacity:.8}
.j:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shine{position:absolute;top:-60%;bottom:-60%;width:26%;left:-40%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-18deg);animation:sweep 3.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes sweep{0%,62%{left:-40%}100%{left:130%}}

/* ============================================================ hud */
.hud{position:fixed;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
#topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(9px + env(safe-area-inset-top)) 11px 0 11px;gap:10px}

.plate{background:linear-gradient(#FFFDF6,#FFE7BE);border:3px solid var(--wood-x);
  border-radius:999px;display:flex;align-items:center;gap:9px;
  box-shadow:0 4px 0 rgba(94,58,24,.55),0 8px 18px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.85)}

.coin{padding:4px 15px 4px 5px}
.coin .ico{width:31px;height:31px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#FFF0A8,var(--gold) 52%,var(--gold-d));
  border:2.5px solid var(--gold-x);color:#7A5104;font-family:var(--disp);font-weight:600;font-size:15px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.coin b{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.2px}

.tpill{padding:5px 13px;align-self:center;margin-top:2px;gap:6px}
.tpill span{font-size:15px;line-height:1}
.tpill b{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);
  font-variant-numeric:tabular-nums}
@media (max-width:400px){.tpill{display:none}}

/* goals, stats and settings */
.gsec{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);
  margin:14px 2px 9px;display:flex;align-items:center;gap:8px}
.gsec::after{content:"";flex:1;height:3px;border-radius:9px;background:#E7D5B4}
.goal{display:flex;align-items:center;gap:10px;background:linear-gradient(#FFFFFF,#FFF7E9);
  border:3px solid var(--wood-d);border-radius:16px;padding:9px 11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(139,94,51,.4)}
.goal.done{background:linear-gradient(#F2FBEC,#E2F4D6);border-color:#5E9A46}
.goal .gi{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  background:#FFEFC6;border:2.5px solid #D9B36A;font-size:18px}
.goal .gt{flex:1;min-width:0}
.goal .gt .nm{font-family:var(--disp);font-weight:600;font-size:13.5px}
.goal .gt .meta{font-size:11px;color:var(--ink2);font-weight:700}
.gbar{height:8px;background:#E3D2B4;border-radius:99px;overflow:hidden;margin-top:5px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.22)}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A8F07E,#4CC63F)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.stat{background:linear-gradient(#FFFFFF,#FFF7E9);border:3px solid var(--wood-d);border-radius:15px;
  padding:10px;text-align:center;box-shadow:0 4px 0 rgba(139,94,51,.35)}
.stat b{display:block;font-family:var(--disp);font-weight:600;font-size:19px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink2);font-weight:700}
.setrow{display:flex;align-items:center;gap:10px;background:linear-gradient(#FFFFFF,#FFF7E9);
  border:3px solid var(--wood-d);border-radius:16px;padding:11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(139,94,51,.4)}
.setrow .lab{flex:1;font-family:var(--disp);font-weight:600;font-size:14px}
.tgl{width:58px;height:32px;border-radius:99px;border:3px solid var(--wood-x);cursor:pointer;
  background:#D6C0A0;position:relative;transition:background .18s;flex:0 0 auto}
.tgl i{position:absolute;top:1px;right:1px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(#FFFDF6,#F0DCB8);box-shadow:0 2px 4px rgba(0,0,0,.3);
  transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.tgl.on{background:linear-gradient(#7BD25E,#48A83A)}
.tgl.on i{transform:translateX(-26px)}
.daily{background:linear-gradient(#FFF6D6,#FFE49B);border:3px solid var(--gold-x);border-radius:18px;
  padding:13px;margin-bottom:12px;text-align:center;box-shadow:0 5px 0 rgba(169,116,10,.5)}
.daily .t{font-family:var(--disp);font-weight:600;font-size:16px;color:#6B4406}
.daily .s{font-size:12px;font-weight:700;color:#8A6218;margin:4px 0 10px}

#lvlwrap{padding:4px 6px 4px 15px}
#lvlbadge{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 26%,#8CF0D6,#35C9AE 52%,#149C84);
  border:3px solid #0C6E5C;color:#fff;font-family:var(--disp);font-weight:600;font-size:19px;
  text-shadow:0 2px 0 rgba(0,0,0,.32);line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.xpcol{display:flex;flex-direction:column;gap:4px;min-width:106px}
.xplab{font-size:10.5px;color:var(--ink2);font-weight:700}
.xpbar{height:10px;background:#D6BE97;border-radius:999px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.28)}
.xpbar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#A8F07E,#4CC63F);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  transition:width .4s cubic-bezier(.3,1.4,.5,1)}

/* dock */
#dock{bottom:0;left:0;right:0;display:flex;justify-content:center;gap:7px;
  padding:0 10px calc(9px + env(safe-area-inset-bottom)) 10px}
.dbtn{position:relative;width:67px;height:68px;border-radius:18px;
  background:linear-gradient(#FFFDF6,#FFE2B2);border:3px solid var(--wood-x);
  box-shadow:0 5px 0 rgba(94,58,24,.6),0 9px 18px rgba(0,0,0,.26),inset 0 2px 0 rgba(255,255,255,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--disp);font-weight:600;font-size:11px;color:var(--ink);cursor:pointer;
  transition:transform .09s ease,box-shadow .09s ease}
.dbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(94,58,24,.6),0 4px 9px rgba(0,0,0,.22)}
.dbtn svg{width:28px;height:28px;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
.dbtn .dot{position:absolute;top:-7px;left:-7px;min-width:23px;height:23px;padding:0 5px;
  border-radius:999px;background:linear-gradient(#FF7A6B,#E23F2E);border:2.5px solid #fff;color:#fff;
  font-family:var(--disp);font-weight:600;font-size:12px;display:none;align-items:center;
  justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.35);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:scale(1)}92%{transform:scale(1.22)}}
.dbtn.has .dot{display:flex}
.dbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}

#quick{position:fixed;z-index:10;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:8px;pointer-events:none;flex-wrap:wrap;padding:0 10px}
.qbtn{pointer-events:auto;border-radius:999px;padding:10px 20px;font-size:14px;
  display:none;align-items:center;gap:7px}
.qbtn.on{display:inline-flex}

/* ============================================================ sheets */
#veil{position:fixed;inset:0;z-index:20;background:rgba(28,16,6,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .24s}
#veil.on{opacity:1;pointer-events:auto}

.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translate(-50%,102%);
  width:min(580px,100%);max-height:87vh;display:flex;flex-direction:column;
  background:linear-gradient(#FFFCF2,#FFEFD6);border:4px solid var(--wood-x);border-bottom:0;
  border-radius:28px 28px 0 0;box-shadow:0 -10px 46px rgba(0,0,0,.45);
  transition:transform .32s cubic-bezier(.25,1.2,.4,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px 10px;
  position:relative}
.sheet header::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:52px;height:5px;border-radius:99px;background:#D9BE94}
.sheet header h2{font-family:var(--disp);font-weight:600;font-size:22px;color:var(--ink);
  flex:1;margin-top:8px}
.sheet header .sub{font-size:12px;color:var(--ink2);font-weight:700;margin-top:10px}
.xbtn{width:38px;height:38px;flex:0 0 auto;border-radius:50%;margin-top:6px;
  font-size:17px;line-height:1;display:grid;place-items:center}
.sheet .body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:4px 14px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}
/* sheet contents deal themselves in rather than appearing all at once */
@keyframes dealin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.card,.row,.order,.goal,.setrow,.stat,.daily{animation:dealin .34s cubic-bezier(.2,1.35,.4,1) both}
.card canvas{transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
.card:active canvas{transform:scale(1.14) rotate(-4deg)}

.card{position:relative;background:linear-gradient(#FFFFFF,#FFF6E6);border:3px solid var(--wood-d);
  border-radius:19px;padding:10px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 4px 0 rgba(139,94,51,.45),inset 0 2px 0 rgba(255,255,255,.9);
  cursor:pointer;transition:transform .09s}
.card:active{transform:translateY(3px)}
.card.locked{opacity:.6;cursor:not-allowed;background:#F2EADC}
.card.locked:active{transform:none}
.card .top{display:flex;align-items:center;gap:9px}
.card canvas{width:56px;height:56px;flex:0 0 auto}
.card .nm{font-family:var(--disp);font-weight:600;font-size:14px;line-height:1.2;color:var(--ink)}
.card .meta{font-size:11px;color:var(--ink2);font-weight:700;display:flex;gap:8px;flex-wrap:wrap}
.tagrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tg{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F0E3CB;color:var(--ink2)}
.tg.gold{background:#FFEAAF;color:#7A5104}
.tg.green{background:#D3F3C6;color:#2C6B23}
.tg.blue{background:#CFEBFA;color:#175E80}
.tg.purple{background:#E8D8F8;color:#5B3592}
.buy{margin-top:auto;border-radius:13px;padding:10px;font-size:13.5px;display:flex;
  align-items:center;justify-content:center;gap:5px}
.lockbadge{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;
  background:rgba(58,39,18,.6);color:#fff;font-family:var(--disp);font-weight:600;font-size:13px;
  text-align:center;padding:8px;line-height:1.5}

.row{display:flex;align-items:center;gap:10px;background:linear-gradient(#FFFFFF,#FFF7E9);
  border:3px solid var(--wood-d);border-radius:17px;padding:9px 11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(139,94,51,.4)}
.row canvas{width:48px;height:48px;flex:0 0 auto}
.row .info{flex:1;min-width:0}
.row .info .nm{font-family:var(--disp);font-weight:600;font-size:14.5px}
.row .info .meta{font-size:11px;color:var(--ink2);font-weight:700}
.row .qty{font-family:var(--disp);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;
  color:var(--ink);background:#F5E9D2;border-radius:10px;padding:4px 10px;min-width:46px;text-align:center}
.mini{border-radius:12px;padding:9px 14px;font-size:13px;white-space:nowrap}

.order{background:linear-gradient(#FFFFFF,#FFF7E9);border:3px solid var(--wood-d);border-radius:19px;
  padding:11px;margin-bottom:11px;box-shadow:0 4px 0 rgba(139,94,51,.4)}
.order .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.order .who{font-family:var(--disp);font-weight:600;font-size:14.5px;flex:1}
.order .items{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.oit{display:flex;align-items:center;gap:6px;background:#F7EFDF;border-radius:12px;padding:5px 9px}
.oit canvas{width:36px;height:36px}
.oit .q{font-family:var(--disp);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.oit .q.ok{color:#2F8B2A}
.oit .q.no{color:#C0392B}
.order .ft{display:flex;align-items:center;gap:8px}
.order .rew{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.empty{text-align:center;color:var(--ink2);font-weight:700;font-size:14px;padding:36px 16px;line-height:1.8}

/* ============================================================ toasts / fx */
#toasts{position:fixed;z-index:30;left:0;right:0;top:calc(78px + env(safe-area-inset-top));
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.toast{background:linear-gradient(rgba(48,30,14,.95),rgba(32,19,8,.95));color:#FFF3DD;
  font-weight:700;font-size:14px;padding:10px 19px;border-radius:999px;
  border:2px solid rgba(255,255,255,.18);box-shadow:0 7px 20px rgba(0,0,0,.4);
  animation:tin .32s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.88)}}

#levelup{position:fixed;inset:0;z-index:40;display:none;place-items:center;pointer-events:none}
#levelup.on{display:grid}
.lucard{position:relative;background:linear-gradient(#FFFCF2,#FFE1AE);border:5px solid var(--wood-x);
  border-radius:30px;padding:28px 38px;text-align:center;
  box-shadow:0 14px 46px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.9);
  animation:pop .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{from{transform:scale(.55) rotate(-7deg);opacity:0}}
.lucard .big{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink2)}
.lucard .n{font-family:var(--disp);font-weight:600;font-size:66px;line-height:1;margin:2px 0 8px;
  color:#149C84;text-shadow:0 4px 0 #0C6E5C,0 8px 16px rgba(0,0,0,.25)}
.lucard .un{font-weight:800;font-size:14px;color:var(--ink);margin-top:6px;line-height:1.6}

/* ============================================================ splash */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  transition:opacity .55s ease, transform .55s ease}
#intro::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 8%, rgba(255,246,208,.35), transparent 55%),
             linear-gradient(180deg, rgba(20,66,90,.42), rgba(16,52,26,.62));
  backdrop-filter:blur(2px) saturate(1.1);-webkit-backdrop-filter:blur(2px) saturate(1.1)}
.icontent{position:relative;text-align:center;display:flex;flex-direction:column;
  align-items:center;width:100%;max-width:440px}

/* the sign */
.sign{position:relative;padding:6px 0 0;animation:drop .8s cubic-bezier(.2,1.5,.35,1) both}
@keyframes drop{from{transform:translateY(-42px) scale(.86);opacity:0}}
.signwrap{position:relative;display:inline-block;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-.5deg)}}
.logo{position:relative;display:inline-block;line-height:1.02}
.logo span{display:block;font-family:var(--disp);font-weight:700;
  font-size:clamp(40px,11.5vw,82px);white-space:nowrap;letter-spacing:0}
.logo .l-out{-webkit-text-stroke:15px var(--wood-x);color:var(--wood-x);
  text-shadow:0 7px 0 #3F2409, 0 11px 22px rgba(0,0,0,.5)}
.logo .l-mid{position:absolute;inset:0;-webkit-text-stroke:8px #FFF3D2;color:#FFF3D2}
.logo .l-fil{position:absolute;inset:0;color:transparent;
  background:linear-gradient(180deg,#FFFBE8 4%,#FFDD6B 38%,#FDB13A 66%,#F08A1E 100%);
  -webkit-background-clip:text;background-clip:text}
.logo .l-shine{position:absolute;inset:0;color:transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.35) 26%,transparent 45%);
  -webkit-background-clip:text;background-clip:text;pointer-events:none}
.leaf{position:absolute;width:clamp(34px,9vw,62px);top:52%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.leaf.r{right:-14%;transform:translateY(-50%) rotate(18deg)}
.leaf.l{left:-14%;transform:translateY(-50%) rotate(-18deg) scaleX(-1)}

.ribbon{position:relative;margin-top:14px;display:inline-block;
  background:linear-gradient(#6FCB52,#48A335);border:3px solid #2A6B22;border-radius:12px;
  padding:8px 26px;color:#fff;font-family:var(--disp);font-weight:600;font-size:clamp(13px,3.6vw,16px);
  text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 #24601D,0 9px 20px rgba(0,0,0,.35),
  inset 0 2px 0 rgba(255,255,255,.35);animation:drop .8s .12s cubic-bezier(.2,1.5,.35,1) both}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:50%;width:16px;height:22px;
  transform:translateY(-50%);background:#3F8F2C;border:3px solid #24601D;z-index:-1}
.ribbon::before{right:-15px;border-radius:0 6px 6px 0}
.ribbon::after{left:-15px;border-radius:6px 0 0 6px}

.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px;
  animation:drop .8s .2s cubic-bezier(.2,1.5,.35,1) both}
.chip{background:rgba(255,252,242,.94);border:2.5px solid var(--wood-x);border-radius:999px;

<script>
/* החצר של פרדי — a farming game in Fredi's back yard. Canvas 2D isometric. */
(function(){
"use strict";

/* ---------------------------------------------------------------- helpers */
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const now=()=>Date.now();

function hash(n){ n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15); return (n>>>0)/4294967296; }

const UNITS=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
function fmt(n){
  n=Math.floor(n);
  if(!isFinite(n)) return '∞';
  if(n<1000) return String(n);
  let i=0, v=n;
  while(v>=1000 && i<UNITS.length-1){ v/=1000; i++; }
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+UNITS[i];
}
function clock(ms){
  if(ms<=0) return 'מוכן';
  const s=Math.ceil(ms/1000);
  if(s<60) return s+'ש';
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return m+':'+String(r).padStart(2,'0');
  const h=Math.floor(m/60);
  return h+'ש '+(m%60)+'ד';
}
function clockShort(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  if(s<60) return String(s);
  const m=Math.floor(s/60);
  if(m<60) return m+':'+String(s%60).padStart(2,'0');
  return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
}

/* ---------------------------------------------------------------- strains */
/* Everything here is invented for the game: playful names, cartoon colours and
   pure timer maths. No real growing involved. */
/* Timings are deliberately Hay Day shaped: seconds at the start so the first
   hour hooks you, hours at the top so a mature farm is something you tend twice
   a day for months rather than something you finish in an afternoon. */
const STRAINS=[
  {id:'g0', nm:'ירוק תמים',    lvl:1,  seed:8,       sell:26,        sec:30,    xp:3,   leaf:'#5FBF4A', leafD:'#3E9634', bud:'#8FD154', hair:'#E8A33C'},
  {id:'g1', nm:'לימון קטן',    lvl:2,  seed:22,      sell:72,        sec:90,    xp:6,   leaf:'#8CCB3F', leafD:'#63A02C', bud:'#D8E05A', hair:'#F0B429'},
  {id:'g2', nm:'ענן סגול',     lvl:4,  seed:58,      sell:190,       sec:240,   xp:12,  leaf:'#67A85C', leafD:'#437A45', bud:'#9B6BD6', hair:'#E6842A'},
  {id:'g3', nm:'פרדי קוש',     lvl:6,  seed:150,     sell:500,       sec:600,   xp:22,  leaf:'#4E9B57', leafD:'#33703F', bud:'#7BAE4C', hair:'#C46A2A'},
  {id:'g4', nm:'חלום החצר',    lvl:9,  seed:400,     sell:1320,      sec:1200,  xp:38,  leaf:'#5CB88E', leafD:'#3A8A66', bud:'#7FD8B4', hair:'#EFA13B'},
  {id:'g5', nm:'בננה זהובה',   lvl:12, seed:1050,    sell:3500,      sec:2400,  xp:62,  leaf:'#A5C43C', leafD:'#7C9A26', bud:'#FFD64A', hair:'#E07C1E'},
  {id:'g6', nm:'קרח קוטבי',    lvl:16, seed:2800,    sell:9300,      sec:4200,  xp:100, leaf:'#6FB6C4', leafD:'#43869A', bud:'#BFEAF2', hair:'#8FB8D6'},
  {id:'g7', nm:'שריפת יער',    lvl:21, seed:7400,    sell:24500,     sec:7200,  xp:160, leaf:'#7FA83C', leafD:'#5A7C25', bud:'#F0713A', hair:'#FFD24A'},
  {id:'g8', nm:'דבש חלל',      lvl:26, seed:19500,   sell:64000,     sec:10800, xp:260, leaf:'#87B36A', leafD:'#5F8848', bud:'#F5C15B', hair:'#B57BE0'},
  {id:'g9', nm:'נשיקת דרקון',  lvl:32, seed:51000,   sell:170000,    sec:14400, xp:410, leaf:'#5A9E6E', leafD:'#3B7350', bud:'#E2465F', hair:'#FFB03A'},
  {id:'ga', nm:'ערפל כוכבים',  lvl:39, seed:135000,  sell:445000,    sec:21600, xp:650, leaf:'#6E8FC4', leafD:'#4A6699', bud:'#B49BF0', hair:'#7FE8DC'},
  {id:'gb', nm:'אור הזוהר',    lvl:47, seed:355000,  sell:1170000,   sec:28800, xp:1000,leaf:'#79C8A8', leafD:'#4E9B7D', bud:'#8CF0C4', hair:'#FFEE6B'},
  {id:'gc', nm:'קטיפה שחורה',  lvl:56, seed:930000,  sell:3080000,   sec:36000, xp:1600,leaf:'#4C6B5A', leafD:'#31483D', bud:'#6E4C8F', hair:'#D96FA8'},
  {id:'gd', nm:'שמש כפולה',    lvl:66, seed:2450000, sell:8100000,   sec:43200, xp:2500,leaf:'#C2B84A', leafD:'#948B2C', bud:'#FFE066', hair:'#FF8A3C'},
  {id:'ge', nm:'נצח ירוק',     lvl:77, seed:6400000, sell:21000000,  sec:57600, xp:3900,leaf:'#3FBF7A', leafD:'#268A55', bud:'#5CF0A8', hair:'#FFFFFF'}
];

/* Past the hand-written strains the catalogue keeps going. Forty-five more are
   generated on the same curve so there is always a next one to unlock — far
   more than anyone will reach, which is the point. */
(function growCatalogue(){
  const A=['ערפל','זוהר','להבת','נשיקת','חלום','ברק','קטיפת','שמש','ירח','טל','סופת','נצח','אבק','שיר','לב'];
  const B=['כוכבים','הדרקון','הצפון','זהב','ארגמן','אינסוף','הקרח','דבש','ענבר','אופל','הגלקסיה','אלמוות','ספיר','נחושת','אודם'];
  const hue=(h,s,l)=>{
    const f=n=>{ const k=(n+h/30)%12, a=s*Math.min(l,1-l);
      const v=l-a*Math.max(-1,Math.min(Math.min(k-3,9-k),1));
      return Math.round(v*255).toString(16).padStart(2,'0'); };
    return '#'+f(0)+f(8)+f(4);
  };
  let last=STRAINS[STRAINS.length-1];
  for(let n=15;n<60;n++){
    const i=n-15, gen=1+Math.floor(i/A.length);
    const h=(i*47)%360;
    last={
      id:'x'+n,
      nm:A[i%A.length]+' '+B[(i*7+3)%B.length]+(gen>1?' '+gen:''),
      lvl:last.lvl+11+Math.floor(i/6),
      seed:Math.round(last.seed*2.63),
      sell:Math.round(last.sell*2.63),
      sec:Math.min(72000,Math.round(last.sec*1.11)),
      xp:Math.round(last.xp*1.55),
      leaf:hue(h,0.45,0.45), leafD:hue(h,0.45,0.32),
      bud:hue((h+40)%360,0.62,0.58), hair:hue((h+180)%360,0.75,0.62)
    };
    STRAINS.push(last);
  }
})();
const BYID={}; STRAINS.forEach((s,i)=>{ s.idx=i; BYID[s.id]=s; });

const UPGRADES=[
  {id:'lamp',  nm:'מנורות גידול',  desc:'כל שדרוג מזרז את הגידול',       base:120,   mul:1.55, tag:'green'},
  {id:'fert',  nm:'דשן אורגני',    desc:'יבול גדול יותר מכל חלקה',      base:200,   mul:1.60, tag:'gold'},
  {id:'sprk',  nm:'מזלף אוטומטי',  desc:'משקה לבד ברגע השתילה',         base:450,   mul:1.70, tag:'blue'},
  {id:'mrkt',  nm:'דוכן השוק',     desc:'מחיר מכירה גבוה יותר',         base:320,   mul:1.62, tag:'gold'},
  {id:'ghs',   nm:'חממה',          desc:'סיכוי ליבול כפול',             base:800,   mul:1.75, tag:'purple'}
];

const CUSTOMERS=['שכן מהרחוב','דודה של פרדי','הדוור','בעל המכולת','חבורת הפארק','הווטרינר','נהג המשאית','גברת מהקומה'];

const GOALS=[
  {id:'h1',ic:'🌿',nm:'קוצר מתחיל', d:'קצור 25 יחידות',        g:()=>S.harvested, n:25,    c:250,     x:20},
  {id:'h2',ic:'🌿',nm:'קוצר מנוסה', d:'קצור 500 יחידות',       g:()=>S.harvested, n:500,   c:4000,    x:150},
  {id:'h3',ic:'🏆',nm:'אלוף הקציר', d:'קצור 10,000 יחידות',    g:()=>S.harvested, n:10000, c:120000,  x:1200},
  {id:'e1',ic:'💰',nm:'הרווח ראשון',d:'הרווח 1,000 ₪',         g:()=>S.earned,    n:1000,  c:400,     x:25},
  {id:'e2',ic:'💰',nm:'עסק מצליח',  d:'הרווח 250,000 ₪',       g:()=>S.earned,    n:250000,c:20000,   x:400},
  {id:'e3',ic:'👑',nm:'אימפריה',    d:'הרווח 50 מיליון ₪',     g:()=>S.earned,    n:5e7,   c:1500000, x:5000},
  {id:'p1',ic:'🟫',nm:'חצר גדלה',   d:'12 חלקות',              g:()=>S.owned,     n:12,    c:900,     x:60},
  {id:'p2',ic:'🟫',nm:'חווה רצינית',d:'30 חלקות',              g:()=>S.owned,     n:30,    c:22000,   x:500},
  {id:'p3',ic:'🏡',nm:'כל החצר',    d:'70 חלקות',              g:()=>S.owned,     n:70,    c:400000,  x:3000},
  {id:'o1',ic:'🚚',nm:'שליח',       d:'מלא 10 הזמנות',         g:()=>S.filled,    n:10,    c:1800,    x:120},
  {id:'o2',ic:'🚚',nm:'ספק קבוע',   d:'מלא 100 הזמנות',        g:()=>S.filled,    n:100,   c:60000,   x:900},
  {id:'l1',ic:'⭐',nm:'רמה 10',     d:'הגע לרמה 10',           g:()=>S.level,     n:10,    c:1500,    x:0},
  {id:'l2',ic:'⭐',nm:'רמה 25',     d:'הגע לרמה 25',           g:()=>S.level,     n:25,    c:30000,   x:0},
  {id:'l3',ic:'🌟',nm:'רמה 50',     d:'הגע לרמה 50',           g:()=>S.level,     n:50,    c:900000,  x:0},
  {id:'s1',ic:'🌈',nm:'אספן',       d:'פתח 15 זנים',           g:()=>STRAINS.filter(unlocked).length, n:15, c:2000000, x:8000}
];

/* The fixed list runs out; these keep climbing so the board is never empty.
   Each rung is roughly four times the last, which is why it lasts. */
(function endlessGoals(){
  const rungs=[
    {p:'h', ic:'🌿', nm:'קציר', d:n=>'קצור '+fmt(n)+' יחידות', g:()=>S.harvested, from:40000,  mul:3.6, c:n=>n*40,  x:n=>n*0.35},
    {p:'e', ic:'💰', nm:'רווח', d:n=>'הרווח '+fmt(n)+' ₪',     g:()=>S.earned,    from:2.5e8,  mul:4.2, c:n=>n*0.06,x:n=>n/8000},
    {p:'o', ic:'🚚', nm:'משלוחים', d:n=>'מלא '+fmt(n)+' הזמנות', g:()=>S.filled,  from:400,    mul:3.2, c:n=>n*900, x:n=>n*7},
    {p:'l', ic:'⭐', nm:'רמה',  d:n=>'הגע לרמה '+n,             g:()=>S.level,     from:75,     mul:1.45,c:n=>Math.pow(n,4.1), x:()=>0},
    {p:'y', ic:'🌍', nm:'שטח',  d:n=>'הרחב את השטח '+n+' פעמים',g:()=>S.yardLvl,   from:6,      mul:1.22,c:n=>Math.pow(9,n*0.9), x:n=>n*400}
  ];
  for(const r of rungs){
    let n=r.from;
    for(let k=0;k<14;k++){
      const need=(r.p==='l'||r.p==='y')?Math.round(n):Math.round(n/10)*10;
      GOALS.push({id:r.p+'z'+k, ic:r.ic, nm:r.nm+' '+(k+1), d:r.d(need),
        g:r.g, n:need, c:Math.max(500,Math.round(r.c(need))), x:Math.round(r.x(need))});
      n*=r.mul;
    }
  }
})();

/* ---------------------------------------------------------------- save */
const KEY='fredis_farm_v1';
const BUILD='10';                     /* bump on every publish, shown in settings */
let S=null;
function fresh(){
  return {
    v:1, coins:45, xp:0, level:1, owned:3,
    plots:[], inv:{}, ups:{lamp:0,fert:0,sprk:0,mrkt:0,ghs:0},
    orders:[], lastOrder:0, lastSeen:now(), lastSeed:'g0',
    earned:0, harvested:0, prestige:0, seen:false,
    goals:{}, filled:0, daily:null, sfx:true, planted:0, days:0,
    yardLvl:0, houseLvl:0, decor:{}
  };
}

const dailyReady=()=>S.daily!==todayKey();

function ensurePlots(){
  rebuildSpots();
  for(let i=0;i<PLOT_SPOTS.length;i++){
    if(!S.plots[i]) S.plots[i]={i,gx:0,gy:0,sid:null,at:0,dur:0,wet:false};
    S.plots[i].i=i;
    S.plots[i].gx=PLOT_SPOTS[i][0];
    S.plots[i].gy=PLOT_SPOTS[i][1];
  }
  if(S.plots.length>PLOT_SPOTS.length) S.plots.length=PLOT_SPOTS.length;
  S.owned=clamp(S.owned||6,1,PLOT_SPOTS.length);
}
/* Set while wiping a save. Without it the pagehide handler fires during the
   reload and writes the old state straight back over the deletion. */
let RESETTING=false;
function save(){
  if(RESETTING) return;
  S.lastSeen=now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
}
function hardReset(){
  RESETTING=true;
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const p=JSON.parse(raw); if(p&&p.v===1) return p; }
  }catch(e){}
  return null;
}

/* ---------------------------------------------------------------- audio */
const A={ctx:null,on:true};
function actx(){
  if(A.ctx) return A.ctx;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  A.ctx=new C(); return A.ctx;
}
function blip(f,d,type,g0,f2){
  if(!A.on) return; const c=actx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  const t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(g0||0.09,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);
}

};

const yardLv=()=>Math.min(S.yardLvl||0,YARD.length-1);
const houseLv=()=>Math.min(S.houseLvl||0,HOUSE_LV.length-1);
const yardR=()=>YARD[yardLv()].r;
function yardB(){ const r=yardR(); return {x0:CX-r,x1:CX+r,y0:CY-r,y1:CY+r}; }
/* the house stands just behind the back fence, so it never eats a plot */
function houseAt(){
  const L=HOUSE_LV[houseLv()];
  /* Sit it directly above the yard on screen. Iso x is (gx-gy), so the house
     must keep the same difference as the yard centre or it drifts sideways. */
  const gy=yardB().y0-1.3;
  return {gx:gy+(CX-CY), gy, A:L.A, B:L.B, L};
}
/* props ride the fence, so they stay put as the yard grows */
function propSpots(){
  const b=yardB();
  return {
    tower:[b.x0-1.5, CY-1.2],
    stall:[b.x1+1.5, CY+0.8],
    rack :[b.x1+1.3, b.y0-0.6],
    fredi:[b.x1+2.1, CY+1.5]
  };
}

let PLOT_SPOTS=[];
function rebuildSpots(){
  const b=yardB(), a=[];
  /* leave the border ring free — that is where decorations live */
  for(let gx=Math.ceil(b.x0+0.9);gx<=Math.floor(b.x1-0.9);gx++)
    for(let gy=Math.ceil(b.y0+0.9);gy<=Math.floor(b.y1-0.9);gy++) a.push([gx,gy]);
  a.sort((p,q)=>{
    const dp=(p[0]-CX)*(p[0]-CX)+(p[1]-CY)*(p[1]-CY);
    const dq=(q[0]-CX)*(q[0]-CX)+(q[1]-CY)*(q[1]-CY);
    return dp-dq || p[0]-q[0] || p[1]-q[1];   /* deterministic, so growing only appends */
  });
  PLOT_SPOTS=a.slice(0,180);
}
/* the ring just inside the fence, for benches, lamps and flowerbeds */
function decorSlots(){
  const b=yardB(), a=[];
  const x0=Math.ceil(b.x0+0.2), x1=Math.floor(b.x1-0.2);
  const y0=Math.ceil(b.y0+0.2), y1=Math.floor(b.y1-0.2);
  for(let gx=x0;gx<=x1;gx++){ a.push([gx,y0]); a.push([gx,y1]); }
  for(let gy=y0+1;gy<=y1-1;gy++){ a.push([x0,gy]); a.push([x1,gy]); }
  const h=houseAt();
  return a.filter(p=>Math.abs(p[0]-h.gx)>1.2||Math.abs(p[1]-h.gy)>1.6)
          .sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])||p[0]-q[0]);
}
const FIELD=iso(CX,CY);

/* one travelling gust so the whole field ripples together instead of each
   plant jittering on its own clock */
function windAt(gx,gy){
  const gust=0.55+0.45*Math.sin(T*0.37)*Math.sin(T*0.19+1.1);
  const ph=T*1.25-(gx+gy)*0.30;
  return (Math.sin(ph)*0.7+Math.sin(ph*1.9+0.7)*0.3)*gust;
}

/* ---------------------------------------------------------------- canvas */
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=0, VH=0, DPR=1;
const cam={x:0, y:0, z:1, tz:1};
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  VW=cv.clientWidth||window.innerWidth; VH=cv.clientHeight||window.innerHeight;
  cv.width=Math.max(1,Math.round(VW*DPR)); cv.height=Math.max(1,Math.round(VH*DPR));

/* Frame the whole property — including how tall the house has grown — so the
   roof never runs off the top of the screen at the bigger upgrades. */
function fitCam(){
  const b=yardB(), h=houseAt();
  const houseH=46*h.L.fl+h.L.roofH+46;
  const top=iso(h.gx,h.gy).y-houseH;
  const bottom=iso(b.x1,b.y1).y+70;
  const left=iso(b.x0,b.y1).x-150;
  const right=iso(b.x1,b.y0).x+230;
  const wNeed=Math.max(320,right-left), hNeed=Math.max(240,bottom-top);
  cam.x=(left+right)/2;
  cam.y=(top+bottom)/2;
  cam.tz=cam.z=clamp(Math.min(VW/wNeed, VH/hNeed)*0.94, 0.30, 1.45);
}
const w2s=(wx,wy)=>({x:(wx-cam.x)*cam.z+VW/2, y:(wy-cam.y)*cam.z+VH*0.52});
function s2w(sx,sy){ return {x:(sx-VW/2)/cam.z+cam.x, y:(sy-VH*0.52)/cam.z+cam.y}; }
function s2g(sx,sy){
  const w=s2w(sx,sy);
  return { gx:(w.x/(TW/2)+w.y/(TH/2))/2, gy:(w.y/(TH/2)-w.x/(TW/2))/2 };
}

/* ---------------------------------------------------------------- plant art */
function leaflet(c,L,W){
  const N=13;
  c.beginPath(); c.moveTo(0,0);
  for(let s=1;s<=N;s++){
    const t=s/N, w=W*Math.pow(Math.sin(Math.PI*Math.min(t,0.995)),0.6)*(1+0.24*Math.sin(t*13.5));
    c.lineTo(w,-L*t);
  }
  for(let s=N;s>=1;s--){
    const t=s/N, w=W*Math.pow(Math.sin(Math.PI*Math.min(t,0.995)),0.6)*(1+0.24*Math.sin(t*13.5));
    c.lineTo(-w,-L*t);
  }
  c.closePath();
}
function fan(c,L,st,flip){
  const ang=[-1.18,-0.8,-0.41,0,0.41,0.8,1.18], rel=[0.46,0.7,0.9,1,0.9,0.7,0.46];
  for(let i=0;i<7;i++){
    c.save(); c.rotate(ang[i]*(flip?-1:1));
    leaflet(c,L*rel[i],L*rel[i]*0.155);
    c.fillStyle = (i===3)?st.leaf : (i%2 ? st.leafD : st.leaf);
    c.fill();
    c.lineWidth=Math.max(0.8,L*0.014); c.strokeStyle='rgba(0,0,0,.16)'; c.stroke();
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-L*rel[i]*0.9);
    c.lineWidth=Math.max(0.6,L*0.012); c.strokeStyle='rgba(255,255,255,.22)'; c.stroke();
    c.restore();
  }
}
/* A proper flower: stacked calyx tiers into a teardrop cola, sugar leaves
   tucked behind, pistils threaded through, and trichome frost that thickens on
   the rarer strains. Drawn from the base upward, origin at the stem. */
function drawBud(c,R,st,detail){
  const idx=st.idx||0;
  const tiers=detail?5:3;
  const fat=0.92+(idx%3)*0.11;
  const frost=clamp(idx/13,0,1);

  c.save();
  c.strokeStyle=shade(st.leafD,-12); c.lineWidth=R*0.12; c.lineCap='round';
  c.beginPath(); c.moveTo(0,R*0.18); c.lineTo(0,-R*0.12); c.stroke();

  if(detail){                                     /* sugar leaves behind the cola */
    for(let i=0;i<7;i++){
      const u=i/7, side=i%2?1:-1;
      const L=R*(0.95-u*0.42);
      c.save();
      c.translate(side*R*0.16, -R*(0.10+u*1.05));
      c.rotate(side*(0.75+u*0.35));
      leaflet(c,L,L*0.155);
      c.fillStyle=i%2?st.leafD:st.leaf;
      c.fill();
      c.lineWidth=Math.max(0.5,R*0.018); c.strokeStyle='rgba(0,0,0,.16)'; c.stroke();
      c.restore();
    }
  }
  for(let ti=0;ti<tiers;ti++){
    const u=tiers>1?ti/(tiers-1):0;
    const y=-R*(0.12+u*1.22);
    const rad=R*fat*(0.50-0.32*u)+R*0.07;
    const n=Math.max(3,Math.round(5-u*2));
    for(let k=0;k<n;k++){
      const a=(k/n)*TAU+ti*0.75;
      const px=Math.cos(a)*rad, py=y+Math.sin(a)*rad*0.34;
      const s=R*(0.31-0.13*u);
      c.save(); c.translate(px,py); c.rotate(Math.cos(a)*0.34);
      c.beginPath(); c.ellipse(0,0,s*0.86,s,0,0,TAU);
      c.fillStyle=(k%2)?shade(st.bud,-12):st.bud; c.fill();
      c.globalAlpha=0.7;
      c.beginPath(); c.ellipse(-s*0.22,-s*0.28,s*0.33,s*0.40,0,0,TAU);
      c.fillStyle=shade(st.bud,18); c.fill();
      c.globalAlpha=1;
      c.restore();
    }
  }
  c.beginPath(); c.ellipse(0,-R*1.44,R*0.23,R*0.31,0,0,TAU);
  c.fillStyle=shade(st.bud,12); c.fill();

  c.strokeStyle=st.hair; c.lineWidth=Math.max(0.6,R*0.055); c.lineCap='round';
  c.globalAlpha=0.92;
  const hairs=detail?15:8;
  for(let i=0;i<hairs;i++){
    const u=hash(i*7+idx*13), side=i%2?1:-1;
    const y=-R*(0.16+u*1.24), x0=side*R*0.12;
    c.beginPath(); c.moveTo(x0,y);
    c.quadraticCurveTo(side*R*0.44,y-R*0.17,side*R*(0.28+u*0.36),y-R*(0.28+u*0.22));
    c.stroke();
  }
  c.globalAlpha=1;

  if(detail&&frost>0.04){
    const n=Math.round(9+frost*26);
    for(let i=0;i<n;i++){
      const u=hash(i*11+idx*7), v=hash(i*23+idx*3);
      const y=-R*(0.12+u*1.32), x=(v-0.5)*R*1.02*(1-u*0.45);
      c.globalAlpha=0.30+0.55*frost;
      c.fillStyle='#FFFFFF';
      c.beginPath(); c.arc(x,y,R*0.034*(0.6+v),0,TAU); c.fill();
    }
    c.globalAlpha=1;
  }
  c.restore();
}
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)+d*2.55,0,255)|0, g=clamp(((n>>8)&255)+d*2.55,0,255)|0, b=clamp((n&255)+d*2.55,0,255)|0;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* one plant drawn into an offscreen tile, cached per strain + growth bucket */
const SPR=new Map();
const SPRW=170, SPRH=200, BUCKETS=16;
/* a mature plant should read as roughly one tile wide, not swallow its neighbours */
const PSCALE=0.58;
function sprite(st,bk){
  const key=st.id+'#'+bk;
  let s=SPR.get(key);
  if(s) return s;
  if(SPR.size>90) SPR.clear();
  const c=document.createElement('canvas');
  c.width=SPRW*2; c.height=SPRH*2;
  const x=c.getContext('2d');
  x.scale(2,2); x.translate(SPRW/2,SPRH-14);
  drawPlant(x,bk/(BUCKETS-1),st);
  SPR.set(key,c);
  return c;
}
/* g: 0 seed .. 1 ripe. Origin at soil level, plant grows upward. */
function drawPlant(c,g,st){
  const G=clamp(g,0,1);
  if(G<0.001){ return; }
  if(G<0.12){                                  /* sprout */
    const k=G/0.12, h=10+16*k;
    c.strokeStyle=st.leafD; c.lineWidth=2.6; c.lineCap='round';
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-h); c.stroke();
    for(const s of [-1,1]){
      c.save(); c.translate(0,-h); c.rotate(s*0.85);
      c.beginPath(); c.ellipse(0,-6*k-3,4.5+5*k,7+6*k,0,0,TAU);
      c.fillStyle=st.leaf; c.fill();
      c.lineWidth=1; c.strokeStyle='rgba(0,0,0,.18)'; c.stroke();
      c.restore();
    }
    return;
  }
  const grow=(G-0.12)/0.88;
  const H=34+108*Math.pow(grow,0.72);              /* stalk height */
  const nodes=Math.min(5,2+Math.floor(grow*4));
  const flow=clamp((G-0.58)/0.42,0,1);

  c.lineCap='round';
  c.strokeStyle=shade(st.leafD,-6); c.lineWidth=Math.max(2.4,H*0.045);
  c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(2,-H*0.5,0,-H); c.stroke();

  for(let n=0;n<nodes;n++){
    const t=(n+1)/(nodes+0.35);
    const y=-H*t*0.94;
    const size=(34+46*grow)*(1-t*0.42);
    const lean=0.30+0.16*Math.sin(n*2.1);
    for(const s of [-1,1]){
      c.save(); c.translate(s*H*0.035,y); c.rotate(s*lean+ (s<0?-0.06:0.06));
      c.scale(0.94,1);
      fan(c,size,st,s<0);
      c.restore();
    }
  }
  /* crown */
  c.save(); c.translate(0,-H); c.scale(0.9,0.9);
  fan(c,(30+34*grow),st,false);
  c.restore();

  if(flow>0.02){
    const br=(10+20*flow);
    c.save(); c.translate(0,-H+br*0.5); drawBud(c,br,st,true); c.restore();
    for(let n=0;n<nodes;n++){
      if(n%2) continue;
      const t=(n+1)/(nodes+0.35), y=-H*t*0.94;
      for(const s of [-1,1]){
        c.save(); c.translate(s*(13+16*flow),y-4); drawBud(c,br*0.5,st,flow>0.55); c.restore();
      }
    }
  }
}

/* small plant portrait for UI cards */
function portrait(el,st,g){
  const c=el.getContext('2d');

  c.clearRect(0,0,W,H);

/* ---------------------------------------------------------------- props */
function roundPoly(c,pts,r){
  c.beginPath();
  for(let i=0;i<pts.length;i++){
    const p0=pts[(i-1+pts.length)%pts.length], p1=pts[i], p2=pts[(i+1)%pts.length];
    const v1=[p1[0]-p0[0],p1[1]-p0[1]], v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(...v1)||1, l2=Math.hypot(...v2)||1;
    const rr=Math.min(r,l1/2,l2/2);
    const a=[p1[0]-v1[0]/l1*rr, p1[1]-v1[1]/l1*rr];
    const b=[p1[0]+v2[0]/l2*rr, p1[1]+v2[1]/l2*rr];
    if(i===0) c.moveTo(a[0],a[1]); else c.lineTo(a[0],a[1]);
    c.quadraticCurveTo(p1[0],p1[1],b[0],b[1]);
  }
  c.closePath();
}
function diamond(c,x,y,w,h){
  c.beginPath(); c.moveTo(x,y-h/2); c.lineTo(x+w/2,y); c.lineTo(x,y+h/2); c.lineTo(x-w/2,y); c.closePath();
}
/* a chunky wooden post */
function post(c,x,y,h,w,col,dark){
  c.fillStyle=dark; c.fillRect(x-w/2,y-h,w,h);
  c.fillStyle=col;  c.fillRect(x-w/2,y-h,w*0.55,h);
  c.fillStyle=shade(col,10); c.fillRect(x-w/2,y-h,w,3);
}
/* Three storeys, drawn as a real iso box so it reads as a building and not a
   flat sticker like the other props. Anchor is the near (bottom) corner. */
function quad(c,p,fill,stroke,lw){
  c.beginPath(); c.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) c.lineTo(p[i][0],p[i][1]);
  c.closePath();
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.6; c.lineJoin='round'; c.stroke(); }
}
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];

/* Sun-relative ground shadow: direction swings with the hour, length grows as
   the sun drops. Gives every solid a sense of sitting on the ground. */
function shadowVec(){
  const alt=Math.max(0.16,SUN.alt);
  const day=clamp((SUN.h-6)/12,0,1);
  return {dx:(0.5-day)*2.4/alt*0.30, dy:0.36/alt*0.30, a:0.10+0.16*clamp(alt,0,1)};
}
function castShadow(c,w,h,height,z){
  const s=shadowVec();
  c.save();
  c.globalAlpha=s.a;
  c.fillStyle='#12340C';
  c.beginPath();
  c.ellipse(s.dx*height*z*0.5, s.dy*height*z*0.16, w*z*0.5, h*z*0.5, 0, 0, TAU);
  c.fill();
  c.restore();
}

function houseProp(c,z,t){
  const H0=houseAt(), LV=H0.L;
  const A=H0.A, B=H0.B;
  const u=[TW/2*z, TH/2*z];         /* +gx : down-right */
  const v=[-TW/2*z, TH/2*z];        /* +gy : down-left  */
  const bu=mul(u,-A), bv=mul(v,-B); /* back along each axis */
  const FL=46*z, H=FL*LV.fl;        /* storeys grow with the upgrade */
  const up=[0,-H];

  const O=[0,0];
  const BR=add(O,bv), BL=add(O,bu), FAR=add(BL,bv);
  const tO=add(O,up), tBR=add(BR,up), tBL=add(BL,up), tFAR=add(FAR,up);

  c.save();
  /* centre the shadow on the footprint, not the near corner, or it reads as a
     dark puddle sitting off to one side of the building */
  {
    const fc=mul(add(bu,bv),0.5);
    c.save(); c.translate(fc[0],fc[1]);
    castShadow(c,(A+B)*TW*0.40,(A+B)*TH*0.40,H/z*0.5,z);
    c.restore();
  }

  /* a shack is boards, a palace is rendered stone */
  const poor=houseLv()===0;
  const gradWall=(p0,p1,c0,c1)=>{
    const g=c.createLinearGradient(p0[0],p0[1],p1[0],p1[1]);
    g.addColorStop(0,c0); g.addColorStop(1,c1); return g;
  };
  const RIGHT = poor?gradWall(tO,BR,'#C09561','#9A7040'):gradWall(tO,BR,'#FBEED6','#DFC69C');
  const LEFT  = poor?gradWall(tO,BL,'#A8804C','#7E5B31'):gradWall(tO,BL,'#DCC7A2','#B99C74');
  const RIGHT_D=poor?'#8E6939':'#E4CFA9', LEFT_D=poor?'#75522B':'#C9B08B';
  const EDGE=poor?'#5E3A18':'#8B6A44';

  /* two visible walls */
  quad(c,[O,BR,tBR,tO],RIGHT,EDGE,2.4*z);
  quad(c,[O,BL,tBL,tO],LEFT,poor?'#4E2F13':'#7A5C3A',2.4*z);

  /* ambient occlusion where the walls meet the ground */
  const ao=c.createLinearGradient(0,0,0,-FL*0.5);
  ao.addColorStop(0,'rgba(40,26,12,.28)'); ao.addColorStop(1,'rgba(40,26,12,0)');
  quad(c,[O,BR,add(BR,[0,-FL*0.5]),add(O,[0,-FL*0.5])],ao);
  quad(c,[O,BL,add(BL,[0,-FL*0.5]),add(O,[0,-FL*0.5])],ao);

  /* storey bands */
  for(let f=1;f<LV.fl;f++){
    const y=[0,-FL*f];
    quad(c,[add(O,y),add(BR,y),add(BR,add(y,[0,-5*z])),add(O,add(y,[0,-5*z]))],RIGHT_D);
    quad(c,[add(O,y),add(BL,y),add(BL,add(y,[0,-5*z])),add(O,add(y,[0,-5*z]))],LEFT_D);
  }

  /* windows: s = fraction along the wall, f = storey index */
  function win(base,dir,s,f,wf,lit){
    const p0=add(add(O,mul(dir,s)),[0,-FL*f-FL*0.72]);
    const w=mul(dir,wf), h=[0,FL*0.44];
    const pts=[p0,add(p0,w),add(add(p0,w),h),add(p0,h)];
    quad(c,pts,lit?'#FFDE96':'#8FC9DE','#6B4E30',2.2*z);
    const gl=[p0,add(p0,mul(w,0.42)),add(add(p0,mul(w,0.42)),h),add(p0,h)];
    quad(c,gl,lit?'rgba(255,255,255,.42)':'rgba(255,255,255,.35)');
  }
  const dR=mul(bv,1/B), dL=mul(bu,1/A);
  const nR=Math.max(1,Math.round(B)-0), nL=Math.max(1,Math.round(A)-0);
  for(let f=0;f<LV.fl;f++){
    for(let k=0;k<nR;k++){
      const s=0.42+k*(Math.max(0.6,B-0.9)/Math.max(1,nR-1||1));
      if(s>B-0.5) continue;
      win(O,dR,s,f,0.55,SUN.lit&&hash(f*7+k*3+1)>0.32);
    }
    for(let k=0;k<nL;k++){
      const s=0.42+k*(Math.max(0.6,A-0.9)/Math.max(1,nL-1||1));
      if(s>A-0.5) continue;
      win(O,dL,s,f,0.55,SUN.lit&&hash(f*13+k*5+3)>0.36);
    }
  }

  /* front door on the right wall, ground floor */
  {
    const p0=add(add(O,mul(dR,0.05)),[0,-FL*0.86]);
    const w=mul(dR,0.42), h=[0,FL*0.86];
    quad(c,[p0,add(p0,w),add(add(p0,w),h),add(p0,h)],'#9A5B33','#6B3D20',2.4*z);
    const k=add(add(p0,mul(w,0.78)),[0,FL*0.44]);
    c.fillStyle='#FFD86B'; c.beginPath(); c.arc(k[0],k[1],2.6*z,0,TAU); c.fill();
  }
  /* balcony on the left wall, first floor */
  if(LV.bal&&LV.fl>=2){
    const base=add(add(O,mul(dL,Math.min(1.0,A*0.35))),[0,-FL*1.02]);
    const w=mul(dL,Math.min(1.5,A*0.5)), out=mul(v,0.30);
    const f0=base, f1=add(base,w), f2=add(f1,out), f3=add(base,out);
    quad(c,[f0,f1,f2,f3],'#E9D6B4','#8B6A44',2*z);
    c.strokeStyle='#8B6A44'; c.lineWidth=2.4*z; c.lineCap='round';
    for(let i=0;i<=6;i++){
      const a=add(f3,mul(mul(w,1/6),i)), b=add(a,[0,-13*z]);
      c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
    }
    const r0=add(f3,[0,-13*z]), r1=add(f2,[0,-13*z]);
    c.beginPath(); c.moveTo(r0[0],r0[1]); c.lineTo(r1[0],r1[1]); c.stroke();
  }

  /* hip roof up to a ridge, plus eaves */
  const OV=0.22;
  const eO=add(add(tO,mul(u,OV)),mul(v,OV));
  const eBR=add(add(tBR,mul(u,OV)),mul(v,-OV));
  const eBL=add(add(tBL,mul(u,-OV)),mul(v,OV));
  const eFAR=add(add(tFAR,mul(u,-OV)),mul(v,-OV));
  quad(c,[eO,eBR,eFAR,eBL],poor?'#6E4A2A':'#8E5A3C',poor?'#3E2610':'#5E3A18',2.4*z);
  const RH=LV.roofH*z;
  const ridgeF=add(add(eO,mul(bv,0.5)),[0,-RH]);
  const ridgeB=add(add(eBL,mul(bv,0.5)),[0,-RH]);
  const tileA=poor?'#7C6A52':'#C4553F', tileB=poor?'#5F5140':'#A84433';
  const gR=c.createLinearGradient(eO[0],eO[1],ridgeB[0],ridgeB[1]);
  gR.addColorStop(0,shade(tileA,-6)); gR.addColorStop(1,shade(tileA,12));
  quad(c,[eO,eBR,ridgeB,ridgeF],gR,poor?'#3E3428':'#7E2F20',2.4*z);
  quad(c,[eO,eBL,ridgeB,ridgeF],tileB,poor?'#3E3428':'#7E2F20',2.4*z);
  c.strokeStyle='rgba(0,0,0,.14)'; c.lineWidth=1.6*z;
  for(let i=1;i<5;i++){
    const a=add(eO,mul([ridgeF[0]-eO[0],ridgeF[1]-eO[1]],i/5));
    const b=add(eBR,mul([ridgeB[0]-eBR[0],ridgeB[1]-eBR[1]],i/5));
    c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
  }
  /* chimney with a lazy puff of smoke */
  const ch=add(add(ridgeB,mul(u,0.35)),[0,-6*z]);
  quad(c,[add(ch,[-8*z,0]),add(ch,[8*z,0]),add(ch,[8*z,-26*z]),add(ch,[-8*z,-26*z])],'#9B4B39','#6B2F22',2*z);
  quad(c,[add(ch,[-10*z,-26*z]),add(ch,[10*z,-26*z]),add(ch,[10*z,-32*z]),add(ch,[-10*z,-32*z])],'#7E3B2C');
  for(let i=0;i<3;i++){
    const k=((t*0.34+i*0.33)%1);
    c.globalAlpha=(1-k)*0.45;
    c.fillStyle='#FFFFFF';
    c.beginPath(); c.arc(ch[0]+Math.sin(k*5+i)*11*z, ch[1]-32*z-k*54*z, (5+k*13)*z,0,TAU); c.fill();
  }
  c.globalAlpha=1;
  c.restore();
}

/* Fredi the bear, minding the stall */
function fredi(c,z,t){
  const j=FRED.jump;
  const hop=-Math.sin(j*Math.PI)*32*z;                 /* cheers on every harvest */
  const bob=Math.sin(t*1.9)*2.2*z+hop;
  /* wave now and then rather than forever */
  const waveOn=clamp((Math.sin(t*0.29)-0.72)*4,0,1);
  const wave=Math.sin(t*7.2)*waveOn+j;
  const sq=1+Math.sin(j*Math.PI)*0.10;
  c.save(); c.translate(0,bob); c.scale(1/sq,sq);
  c.fillStyle='rgba(0,0,0,.17)';
  c.save(); c.scale(sq,1/sq);
  diamond(c,0,(-bob)/1,58*z*(1-Math.sin(j*Math.PI)*0.25),24*z); c.fill();
  c.restore();
  const fur='#9A6B41', furD='#7C5230', muz='#D9B183';
  c.fillStyle=furD; c.beginPath(); c.ellipse(-11*z,-14*z,8*z,14*z,0,0,TAU); c.fill();
  c.beginPath(); c.ellipse(11*z,-14*z,8*z,14*z,0,0,TAU); c.fill();
  c.fillStyle='#4E8FCB'; roundPoly(c,[[-19*z,-58*z],[19*z,-58*z],[16*z,-12*z],[-16*z,-12*z]],9*z); c.fill();
  c.fillStyle=fur; roundPoly(c,[[-19*z,-64*z],[19*z,-64*z],[18*z,-46*z],[-18*z,-46*z]],9*z); c.fill();
  c.fillStyle='#3A6E9E'; c.fillRect(-9*z,-58*z,5*z,16*z); c.fillRect(4*z,-58*z,5*z,16*z);
  c.save(); c.translate(-22*z,-56*z); c.rotate(0.35);
  c.fillStyle=fur; roundPoly(c,[[-6*z,0],[6*z,0],[6*z,26*z],[-6*z,26*z]],6*z); c.fill(); c.restore();
  c.save(); c.translate(22*z,-56*z); c.rotate(-0.4-wave*0.5);
  c.fillStyle=fur; roundPoly(c,[[-6*z,0],[6*z,0],[6*z,26*z],[-6*z,26*z]],6*z); c.fill(); c.restore();
  c.fillStyle=furD;
  c.beginPath(); c.arc(-15*z,-92*z,10*z,0,TAU); c.fill();
  c.beginPath(); c.arc(15*z,-92*z,10*z,0,TAU); c.fill();
  c.fillStyle=muz;
  c.beginPath(); c.arc(-15*z,-92*z,5*z,0,TAU); c.fill();
  c.beginPath(); c.arc(15*z,-92*z,5*z,0,TAU); c.fill();
  c.fillStyle=fur; c.beginPath(); c.ellipse(0,-82*z,25*z,23*z,0,0,TAU); c.fill();
  c.fillStyle=muz; c.beginPath(); c.ellipse(0,-74*z,15*z,11*z,0,0,TAU); c.fill();
  c.fillStyle='#3A2A1C';
  c.beginPath(); c.ellipse(0,-80*z,5.5*z,4*z,0,0,TAU); c.fill();
  const blink=(Math.sin(t*0.9)>0.97)?0.15:1;
  c.beginPath(); c.ellipse(-9*z,-88*z,3.2*z,3.6*z*blink,0,0,TAU); c.fill();
  c.beginPath(); c.ellipse(9*z,-88*z,3.2*z,3.6*z*blink,0,0,TAU); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(-10*z,-89.5*z,1.2*z,0,TAU); c.fill();
  c.beginPath(); c.arc(8*z,-89.5*z,1.2*z,0,TAU); c.fill();
  c.strokeStyle='#3A2A1C'; c.lineWidth=1.6*z; c.lineCap='round';
  c.beginPath(); c.moveTo(-6*z,-72*z); c.quadraticCurveTo(0,-68*z,6*z,-72*z); c.stroke();
  c.fillStyle='#C9A227'; roundPoly(c,[[-26*z,-104*z],[26*z,-104*z],[22*z,-99*z],[-22*z,-99*z]],3*z); c.fill();
  c.fillStyle='#E0B92E'; roundPoly(c,[[-17*z,-122*z],[17*z,-122*z],[19*z,-104*z],[-19*z,-104*z]],5*z); c.fill();
  c.restore();
}

}
/* a ghost of the harvested plant, blooming outward as it fades */
function plantPop(sx,sy,st){
  fx({k:'plant',x:sx,y:sy,st,life:0.5});
}
function puff(sx,sy,col,n){
  for(let i=0;i<n;i++) fx({k:'puff',x:sx,y:sy,col,life:0.5+hash(i)*0.3,
    vx:(hash(i*5)-0.5)*110, vy:-40-hash(i*11)*90, r:4+hash(i*17)*7});
}
function drops(sx,sy){
  for(let i=0;i<10;i++) fx({k:'drop',x:sx+(hash(i*3)-0.5)*40,y:sy-70-hash(i*9)*30,
    life:0.5+hash(i)*0.25, vy:150+hash(i*5)*90});
}
function drawFX(dt){
  for(let i=FX.length-1;i>=0;i--){
    const p=FX[i]; p.t+=dt;
    if(p.d&&p.t<p.d) continue;
    const u=(p.t-(p.d||0))/p.life;
    if(u>=1){ FX.splice(i,1); continue; }
    ctx.save();
    if(p.k==='txt'){
      ctx.globalAlpha=u<0.15?u/0.15:1-Math.pow(u,3);
      ctx.font='900 '+Math.round(19*Math.min(1.5,cam.z+0.5))+'px "Segoe UI",Arial,sans-serif';
      ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(30,18,8,.6)';
      const y=p.y+p.vy*u;
      ctx.strokeText(p.txt,p.x,y); ctx.fillStyle=p.col; ctx.fillText(p.txt,p.x,y);
    } else if(p.k==='coin'){
      /* fling out, then home in on the counter with an ease-in curve */
      const e=u*u*(3-2*u);
      const fx0=p.x+p.ax*u, fy0=p.y+p.ay*u+420*u*u;
      const x=lerp(fx0,p.tx,e*e), y=lerp(fy0,p.ty,e*e);
      ctx.globalAlpha=u>0.86?(1-u)/0.14:1;
      const r=10*Math.min(1.4,cam.z+0.5)*(1-e*0.35);
      ctx.beginPath(); ctx.ellipse(x,y,r*Math.abs(Math.cos(u*11+p.sp)),r,0,0,TAU);
      ctx.fillStyle='#FFC93C'; ctx.fill();
      ctx.lineWidth=2.2; ctx.strokeStyle='#A9740A'; ctx.stroke();
      ctx.globalAlpha*=0.7; ctx.fillStyle='#FFF0A8';
      ctx.beginPath(); ctx.ellipse(x-r*0.25,y-r*0.3,r*0.26,r*0.3,0,0,TAU); ctx.fill();
    } else if(p.k==='plant'){
      const e=1-Math.pow(1-u,3);
      ctx.globalAlpha=(1-u)*0.9;
      const spr=sprite(p.st,BUCKETS-1);
      const k=cam.z*PSCALE*(1+e*0.55);
      ctx.translate(p.x,p.y+10*cam.z-e*26*cam.z);
      ctx.drawImage(spr,-SPRW*k/2,-SPRH*k+14*cam.z,SPRW*k,SPRH*k);
    } else if(p.k==='puff'){
      const y=p.y+p.vy*u+240*u*u, x=p.x+p.vx*u;
      ctx.globalAlpha=(1-u)*0.85;
      ctx.beginPath(); ctx.arc(x,y,p.r*(0.6+u*1.5)*cam.z,0,TAU);
      ctx.fillStyle=p.col; ctx.fill();
    } else if(p.k==='drop'){
      ctx.globalAlpha=1-u;
      ctx.fillStyle='#7FD3F0';
      const y=p.y+p.vy*u;
      ctx.beginPath(); ctx.ellipse(p.x,y,2.6*cam.z,6*cam.z,0,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------------------------------------------------------------- scene */
let T=0, DT=0.016;
const FRED={jump:0};
const clouds=[];
for(let i=0;i<7;i++) clouds.push({x:hash(i*31)*2400-400, y:60+hash(i*17)*190, s:0.6+hash(i*7)*0.9, v:6+hash(i*5)*9});

function tileTop(gx,gy){ const p=iso(gx,gy); return w2s(p.x,p.y); }

/* ---------------------------------------------------------------- daylight
   Driven by the device clock, so the yard is dark when it is dark outside. */
const SUN={h:12, alt:1, tint:[255,255,255], mul:0, night:0, gold:0};
let HOUR_OVERRIDE=null;   /* debug: force a time of day */
const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const mix3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const PAL={
  night:[[9,18,42],[17,31,66],[38,54,96]],
  twil :[[32,50,100],[104,76,130],[226,132,104]],
  gold :[[70,146,204],[238,158,108],[255,208,142]],
  day  :[[79,195,232],[143,220,243],[209,240,250]]
};
function updateSun(){
  const d=new Date();
  const h=(HOUR_OVERRIDE!==null)?HOUR_OVERRIDE:(d.getHours()+d.getMinutes()/60+d.getSeconds()/3600);
  SUN.h=h;
  SUN.alt=Math.sin((h-6)/24*TAU);              /* 06:00 sunrise, 12:00 peak, 18:00 set */
  const a=SUN.alt;
  let c0=PAL.night[0],c1=PAL.night[1],c2=PAL.night[2];
  const t1=smooth(-0.34,-0.06,a), t2=smooth(-0.05,0.13,a), t3=smooth(0.11,0.36,a);
  c0=mix3(c0,PAL.twil[0],t1); c1=mix3(c1,PAL.twil[1],t1); c2=mix3(c2,PAL.twil[2],t1);
  c0=mix3(c0,PAL.gold[0],t2); c1=mix3(c1,PAL.gold[1],t2); c2=mix3(c2,PAL.gold[2],t2);
  c0=mix3(c0,PAL.day[0],t3);  c1=mix3(c1,PAL.day[1],t3);  c2=mix3(c2,PAL.day[2],t3);
  SUN.sky=[c0,c1,c2];
  SUN.night=1-smooth(-0.16,0.06,a);
  SUN.gold=smooth(-0.02,0.16,a)*(1-smooth(0.18,0.42,a));
  /* what the daylight does to everything standing in it */
  let tint=[255,255,255];
  tint=mix3(tint,[255,206,152],SUN.gold*0.85);
  tint=mix3(tint,[86,108,168],SUN.night*0.82);
  SUN.tint=tint;
  SUN.mul=(SUN.gold*0.85+SUN.night*0.82)>0.02?1:0;
  SUN.lit=SUN.night>0.35;                       /* windows and lamps come on */
}
/* The horizon is a real place in the world, not a line pinned to the screen.
   Anchoring it to a depth far behind the property means the hills, the town and
   the grass all move and scale together when you zoom or pan — pinning it was
   what made the backdrop shear away from the yard. */
const HZ_DEPTH=()=>{ const h=houseAt(); return (h.gx+h.gy)-5; };
function depthY(K){ return (K*TH/2 - cam.y)*cam.z + VH*0.52; }
function horizonY(){ return depthY(HZ_DEPTH()); }

function drawSky(){
  const hz=horizonY();
  if(hz<4) return;                    /* zoomed right in: no sky in shot */
  const z=cam.z;
  const g=ctx.createLinearGradient(0,0,0,hz*1.5);
  g.addColorStop(0,rgb(SUN.sky[0]));
  g.addColorStop(0.62,rgb(SUN.sky[1]));
  g.addColorStop(1,rgb(SUN.sky[2]));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,hz+2);

  /* stars fade in as the sky goes over */
  if(SUN.night>0.05){
    ctx.save(); ctx.globalAlpha=SUN.night;
    for(let i=0;i<70;i++){
      const x=hash(i*17)*VW, y=hash(i*31)*hz*0.92;
      const tw=0.35+0.65*Math.abs(Math.sin(T*(0.6+hash(i*7))+i));
      ctx.globalAlpha=SUN.night*tw*(0.35+hash(i*11)*0.65);
      ctx.fillStyle='#FFFDF0';
      ctx.beginPath(); ctx.arc(x,y,hash(i*13)*1.3+0.6,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  /* the sun or the moon, tracking the real hour across the sky */
  const day=(SUN.h-6)/12;                        /* 0 at 06:00, 1 at 18:00 */
  const up=SUN.alt>-0.02;
  const p=up?day:((SUN.h<6?SUN.h+6:SUN.h-18)/12);
  const bx=VW*(0.08+0.84*clamp(p,0,1));
  const by=hz*0.92-Math.sin(clamp(p,0,1)*Math.PI)*hz*0.72;
  ctx.save();
  if(up){
    const gr=ctx.createRadialGradient(bx,by,2,bx,by,86);
    gr.addColorStop(0,'rgba(255,246,196,.95)'); gr.addColorStop(0.25,'rgba(255,236,150,.42)');
    gr.addColorStop(1,'rgba(255,230,140,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(bx,by,86,0,TAU); ctx.fill();
    ctx.fillStyle='#FFF7CF'; ctx.beginPath(); ctx.arc(bx,by,27,0,TAU); ctx.fill();
  } else {
    const gr=ctx.createRadialGradient(bx,by,2,bx,by,64);
    gr.addColorStop(0,'rgba(226,238,255,.55)'); gr.addColorStop(1,'rgba(200,220,255,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(bx,by,64,0,TAU); ctx.fill();
    ctx.fillStyle='#E8EEFA'; ctx.beginPath(); ctx.arc(bx,by,20,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(190,202,224,.75)';
    ctx.beginPath(); ctx.arc(bx-6,by-4,4,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+6,by+5,3,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+2,by-8,2.4,0,TAU); ctx.fill();
  }
  ctx.restore();

  /* three ridges of hills, paler the further back they sit */
  const base=mix3(SUN.sky[2],[96,150,104],0.55);
  for(let L=0;L<3;L++){
    const amp=(16+L*13)*z, y0=hz-(6+L*16)*z;
    const col=mix3(SUN.sky[2],mix3(base,[52,104,64],L*0.4),0.35+L*0.22);
    ctx.fillStyle=rgb(col);
    ctx.beginPath(); ctx.moveTo(0,hz+4);
    for(let x=0;x<=VW;x+=18){
      const n=Math.sin(x*0.006+L*2.3)*amp+Math.sin(x*0.017+L*4.1)*amp*0.45;
      ctx.lineTo(x,y0-n);
    }
    ctx.lineTo(VW,hz+4); ctx.closePath(); ctx.fill();
  }
}

/* Rooftops of the street beyond the yard. They parallax with the camera and are
   veiled in haze, so the horizon reads as distance instead of a strip pasted
   across the top of the screen. */
function drawTown(){
  const hz=horizonY();
  if(hz<4) return;
  const z=cam.z;
  /* the street sits on a line of constant depth, so it stays horizontal on
     screen while still living in world space */
  const K=HZ_DEPTH()+0.4;   /* just behind the horizon, so roofs peek over it */
  const rowY=depthY(K);
  ctx.save();
  for(let i=-34;i<=34;i++){
    const gx=K/2+i*1.5;
    const wx=(2*gx-K)*TW/2;
    const sx=(wx-cam.x)*z+VW/2;
    if(sx<-240*z||sx>VW+240*z) continue;
    const w=(52+hash(i*7+3)*46)*z, h=(30+hash(i*13+5)*44)*z;
    const y=rowY+(8+hash(i*19+7)*12)*z;
    const wall=mix3([236,222,196],SUN.tint,0.55);
    ctx.fillStyle=rgb(mix3(wall,[120,132,164],SUN.night*0.6));
    ctx.fillRect(sx,y-h,w,h);
    ctx.fillStyle=rgb(mix3([176,84,64],[70,80,120],SUN.night*0.6));
    ctx.beginPath(); ctx.moveTo(sx-7*z,y-h); ctx.lineTo(sx+w/2,y-h-(20+hash(i*3+1)*12)*z);
    ctx.lineTo(sx+w+7*z,y-h); ctx.closePath(); ctx.fill();
    if(SUN.lit){
      ctx.fillStyle='rgba(255,214,120,'+(0.35+0.5*SUN.night)+')';
      for(let k=0;k<2;k++){
        if(hash(i*11+k+2)<0.35) continue;
        ctx.fillRect(sx+9*z+k*(w*0.45),y-h*0.62,w*0.22,h*0.26);
      }
    }
  }
  /* a treeline hiding the join between the town and the grass */
  const tY=depthY(K+1.1);
  ctx.fillStyle=rgb(mix3([58,116,58],SUN.tint,0.5));
  ctx.beginPath(); ctx.moveTo(-90,tY+120*z);
  for(let x=-90;x<=VW+90;x+=14){
    const wx=(x-VW/2)/z+cam.x;
    const n=(Math.sin(wx*0.017)*7+Math.sin(wx*0.007+1.7)*11+hash((wx*0.4)|0)*7)*z;
    ctx.lineTo(x,tY+14*z-n);
  }
  ctx.lineTo(VW+90,tY+120*z); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* atmospheric haze over the seam — the hard line was the "cut" */
  const hazeCol=SUN.sky[2];
  const hzA=hz-46*cam.z, hzB=hz+82*cam.z;
  const g=ctx.createLinearGradient(0,hzA,0,hzB);
  g.addColorStop(0,'rgba('+(hazeCol[0]|0)+','+(hazeCol[1]|0)+','+(hazeCol[2]|0)+',.55)');
  g.addColorStop(0.42,'rgba('+(hazeCol[0]|0)+','+(hazeCol[1]|0)+','+(hazeCol[2]|0)+',.20)');
  g.addColorStop(1,'rgba('+(hazeCol[0]|0)+','+(hazeCol[1]|0)+','+(hazeCol[2]|0)+',0)');
  ctx.fillStyle=g; ctx.fillRect(0,hzA,VW,hzB-hzA);
}

/* The land runs from the horizon to the bottom of the screen. The yard is a
   fenced piece of it, not an island hanging in the sky. */
function drawGround(){
  const hz=horizonY();
  const far=mix3([132,186,110],SUN.sky[2],0.42);
  const near=[95,168,66];
  const g=ctx.createLinearGradient(0,hz,0,VH);
  g.addColorStop(0,rgb(mix3(far,SUN.tint,0.35)));
  g.addColorStop(0.28,rgb(mix3([104,178,74],SUN.tint,0.2)));
  g.addColorStop(1,rgb(near));
  ctx.fillStyle=g; ctx.fillRect(0,hz,VW,VH-hz);

  ctx.save();
  ctx.beginPath(); ctx.rect(0,hz,VW,VH-hz); ctx.clip();

  /* mown stripes over whichever tiles are actually on screen */
  const a=s2g(0,hz), b=s2g(VW,hz), c=s2g(0,VH), d=s2g(VW,VH);
  const gx0=Math.floor(Math.min(a.gx,b.gx,c.gx,d.gx))-1, gx1=Math.ceil(Math.max(a.gx,b.gx,c.gx,d.gx))+1;
  const gy0=Math.floor(Math.min(a.gy,b.gy,c.gy,d.gy))-1, gy1=Math.ceil(Math.max(a.gy,b.gy,c.gy,d.gy))+1;
  const YB=yardB();
  const span=(gx1-gx0)*(gy1-gy0);
  if(span<4200){
    for(let gx=gx0;gx<gx1;gx++) for(let gy=gy0;gy<gy1;gy++){
      if(((gx+gy)&1)===0) continue;
      const p=iso(gx+0.5,gy+0.5), s=w2s(p.x,p.y);
      if(s.y<hz-40||s.y>VH+40) continue;
      const yb=YB, inYard=(gx>=yb.x0&&gx<yb.x1&&gy>=yb.y0&&gy<yb.y1);
      ctx.fillStyle=inYard?'rgba(64,142,40,.26)':'rgba(70,134,52,.17)';
      diamond(ctx,s.x,s.y,TW*cam.z,TH*cam.z); ctx.fill();
    }
  }
  /* wildflowers and tufts, seeded so they never crawl */
  for(let i=0;i<190;i++){
    const gx=CX-14+hash(i*13)*28, gy=CY-14+hash(i*29+5)*28;
    const p=iso(gx,gy), s=w2s(p.x,p.y);
    if(s.y<hz||s.y>VH+20) continue;
    const r=hash(i*7);
    ctx.fillStyle=r>0.86?'#FFF3B0':r>0.76?'#F4A9C0':'rgba(56,124,38,.5)';
    const w=(r>0.76?3.6:6.5)*cam.z;
    ctx.beginPath(); ctx.ellipse(s.x,s.y,w,w*0.7,0,0,TAU); ctx.fill();
  }
  /* cloud shadows drifting across the grass */
  if(SUN.alt>0.05){
    for(const cl of clouds){
      const s=w2s(cl.x,cl.y+520);
      if(s.y<hz-60) continue;
      ctx.fillStyle='rgba(28,64,20,'+(0.10*clamp(SUN.alt*2,0,1))+')';
      ctx.beginPath(); ctx.ellipse(s.x,s.y,160*cl.s*cam.z,60*cl.s*cam.z,0,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}
/* fence runs the full perimeter now, because there is land on both sides */
function drawFence(){
  const z=cam.z, hz=horizonY();
  const b=yardB();
  const runs=[[[b.x0,b.y0],[b.x1,b.y0]],[[b.x1,b.y0],[b.x1,b.y1]],[[b.x1,b.y1],[b.x0,b.y1]],[[b.x0,b.y1],[b.x0,b.y0]]];
  const segs=[];
  for(const [A,B] of runs){
    const n=Math.max(2,Math.round(Math.hypot(B[0]-A[0],B[1]-A[1])/0.8));
    for(let i=0;i<=n;i++){
      const t=i/n, gx=lerp(A[0],B[0],t), gy=lerp(A[1],B[1],t);
      segs.push({gx,gy,d:gx+gy});
    }
  }
  segs.sort((p,q)=>p.d-q.d);
  const woodL=rgb(mix3([210,160,99],SUN.tint,0.55));
  const woodD=rgb(mix3([168,122,64],SUN.tint,0.55));
  for(const [A,B] of runs){
    const a=iso(A[0],A[1]), b=iso(B[0],B[1]);
    const sa=w2s(a.x,a.y), sb=w2s(b.x,b.y);
    if(sa.y<hz&&sb.y<hz) continue;
    ctx.strokeStyle=woodL; ctx.lineWidth=5*z; ctx.lineCap='round';
    for(const h of [0.40,0.74]){
      ctx.beginPath(); ctx.moveTo(sa.x,sa.y-34*z*h); ctx.lineTo(sb.x,sb.y-34*z*h); ctx.stroke();
    }
  }
  for(const sg of segs){
    const p=iso(sg.gx,sg.gy), s=w2s(p.x,p.y);
    if(s.y<hz-10) continue;
    post(ctx,s.x,s.y,34*z,9*z,woodL,woodD);
  }
}
/* the neighbours' places, so the yard has a street to belong to */
function drawNeighbours(){
  const hz=horizonY(), z=cam.z;
  /* ring the property from outside, so a grown yard never swallows a neighbour */
  const b=yardB(), m=3.4;
  const spots=[
    [b.x0-m,b.y0-m*0.6,0],[CX-1,b.y0-m*1.5,1],[b.x1+m*0.7,b.y0-m,2],
    [b.x1+m,CY-1.5,3],[b.x1+m*1.1,b.y1+m*0.5,4],
    [CX+1,b.y1+m*1.3,5],[b.x0-m*0.9,b.y1+m*0.7,6],[b.x0-m*1.2,CY+1.0,7],
    [b.x0-m*1.8,b.y0-m*1.6,8],[b.x1+m*1.9,b.y1+m*1.4,9]
  ];
  const out=[];
  for(const [gx,gy,sd] of spots) out.push({gx,gy,sd,d:gx+gy});
  out.sort((a,b)=>a.d-b.d);
  for(const o of out){
    const p=iso(o.gx,o.gy), s=w2s(p.x,p.y);
    if(s.y<hz-30||s.y>VH+220||s.x<-260||s.x>VW+260) continue;
    ctx.save(); ctx.translate(s.x,s.y);
    if(o.sd%3===2){ treeProp(ctx,z*1.1,o.sd*7); }
    else {
      const w=118*z, h=(66+hash(o.sd*5)*30)*z;
      ctx.fillStyle='rgba(0,0,0,.18)'; diamond(ctx,0,0,w*1.15,h*0.42); ctx.fill();
      const wall=rgb(mix3(mix3([240,226,198],[176,150,116],hash(o.sd*3)),SUN.tint,0.55));
      ctx.fillStyle=wall; roundPoly(ctx,[[-w/2,-h],[w/2,-h],[w/2,0],[-w/2,0]],5*z); ctx.fill();
      ctx.fillStyle=rgb(mix3([182,88,66],SUN.tint,0.55));
      roundPoly(ctx,[[-w*0.6,-h],[0,-h-40*z],[w*0.6,-h]],5*z); ctx.fill();
      ctx.fillStyle=SUN.lit?'rgba(255,216,124,.95)':rgb(mix3([148,200,222],SUN.tint,0.5));
      ctx.fillRect(-w*0.30,-h*0.66,w*0.22,h*0.30);
      ctx.fillRect(w*0.08,-h*0.66,w*0.22,h*0.30);
      ctx.fillStyle=rgb(mix3([150,92,54],SUN.tint,0.55));
      roundPoly(ctx,[[-w*0.10,-h*0.5],[w*0.10,-h*0.5],[w*0.10,0],[-w*0.10,0]],3*z); ctx.fill();
    }
    ctx.restore();
  }
}
/* warm pools under the windows and lamps once it is dark */
function drawNightLights(){
  if(SUN.night<0.12) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const put=(gx,gy,r,col,a)=>{
    const p=iso(gx,gy), s=w2s(p.x,p.y);
    const rr=r*cam.z;
    const g=ctx.createRadialGradient(s.x,s.y-rr*0.35,2,s.x,s.y-rr*0.35,rr);
    g.addColorStop(0,'rgba('+col+','+(a*SUN.night)+')');
    g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y-rr*0.35,rr,0,TAU); ctx.fill();
  };
  const _h=houseAt();
  put(_h.gx-_h.A*0.5,_h.gy-_h.B*0.5,230,"255,206,124",0.46);
  put(12.4,7.2,150,'255,196,110',0.40);
  put(12.2,9.3,90,'255,214,150',0.26);
  ctx.restore();
}
function drawPlot(p){
  const s=tileTop(p.gx,p.gy);
  const z=cam.z, w=TW*z*0.92, h=TH*z*0.92;
  if(p.i>=S.owned){

    ctx.globalAlpha=0.30+0.22*pl;

  ctx.fillStyle=p.sid?(p.wet?'#6B4527':'#8A5A38'):'#8A5A38';
  diamond(ctx,s.x,s.y,w,h); ctx.fill();
  ctx.strokeStyle='#A8703F'; ctx.lineWidth=1.6*z;
  for(let i=1;i<4;i++){

    ctx.beginPath();

function drawPlant2(p){
  if(!p.sid || p.i>=S.owned) return;
  const st=BYID[p.sid]; if(!st) return;
  const s=tileTop(p.gx,p.gy);
  const g=clamp((now()-p.at)/Math.max(1,p.dur),0,1);
  const bk=Math.min(BUCKETS-1,Math.floor(g*BUCKETS));
  const spr=sprite(st,bk);
  const z=cam.z;
  /* squash-and-stretch whenever the plant crosses into a new growth stage */
  if(p.bk===undefined) p.bk=bk;
  if(bk!==p.bk){ p.bk=bk; p.pop=1; }
  p.pop=(p.pop||0)*Math.pow(0.0015,DT);
  const pop=p.pop||0;
  const sw=SPRW*z*PSCALE*(1-pop*0.12), sh=SPRH*z*PSCALE*(1+pop*0.22);
  const sway=windAt(p.gx,p.gy)*0.055*(0.4+0.6*g);
  const ready=g>=1;
  ctx.save();
  ctx.translate(s.x,s.y+10*z);
  /* contact shadow grows with the plant */
  ctx.fillStyle='rgba(0,0,0,.20)';
  ctx.beginPath(); ctx.ellipse(0,0,(14+22*g)*z,(6+9*g)*z,0,0,TAU); ctx.fill();
  if(ready){
    const pl=0.5+0.5*Math.sin(T*2.6+p.i);
    const gr=ctx.createRadialGradient(0,-46*z,2,0,-46*z,74*z);
    gr.addColorStop(0,'rgba(255,240,150,'+(0.30+0.14*pl)+')');
    gr.addColorStop(1,'rgba(255,240,150,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,-46*z,74*z,0,TAU); ctx.fill();
    ctx.translate(0,Math.sin(T*2.6+p.i)*2.2*z);
  }
  ctx.rotate(sway);
  ctx.drawImage(spr,-sw/2,-sh+14*z,sw,sh);
  ctx.restore();
  if(ready){
    for(let i=0;i<3;i++){
      const a=T*1.5+i*2.1+p.i, rr=(26+10*Math.sin(a*1.3))*z;
      const sx=s.x+Math.cos(a)*rr, sy=s.y-(50+18*Math.sin(a*0.8))*z;
      ctx.globalAlpha=0.55+0.45*Math.sin(a*2);
      ctx.fillStyle='#FFF2A8';
      ctx.beginPath(); ctx.arc(sx,sy,2.6*z,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

function iconCheck(c,x,y,r,col){

function drawBadge(p){

function scene(dt){
  updateSun();
  drawSky();
  /* clouds drift across the sky band, tinted by the hour */
  const hz=horizonY();
  for(const cl of clouds){
    cl.x+=cl.v*dt;
    if(cl.x>2600) cl.x=-700;
    const s=w2s(cl.x,cl.y);
    const cy=clamp(s.y,20,hz-14);
    ctx.save();
    ctx.globalAlpha=0.55+0.4*(1-SUN.night);
    ctx.fillStyle=rgb(mix3([255,255,255],mix3([255,206,168],[70,86,132],SUN.night),
      SUN.gold*0.6+SUN.night*0.75));
    const z=cl.s*Math.max(0.5,cam.z);
    for(const [ox,oy,r] of [[0,0,46],[-42,10,32],[44,8,34],[-16,-18,32],[20,-16,28]]){
      ctx.beginPath(); ctx.arc(s.x+ox*z,cy+oy*z,r*z,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  drawBirds();
  drawTown();
  drawGround();
  drawNeighbours();

  const items=[];
  const push=(gx,gy,fn)=>items.push({d:gx+gy,gx,gy,fn});
  const tree=(gx,gy,seed)=>push(gx,gy,(s,z)=>{
    ctx.save(); ctx.translate(s.x,s.y);
    ctx.rotate(windAt(gx,gy)*0.016);
    treeProp(ctx,z,seed); ctx.restore();
  });
  const HH=houseAt();
  push(HH.gx,HH.gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); houseProp(ctx,z,T); ctx.restore(); });
  const PS=propSpots(), YB2=yardB();
  push(PS.tower[0],PS.tower[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); towerProp(ctx,z); ctx.restore(); });
  push(PS.rack[0],PS.rack[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); rackProp(ctx,z); ctx.restore(); });
  push(PS.stall[0],PS.stall[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); stallProp(ctx,z); ctx.restore(); });
  tree(YB2.x0-2.6,YB2.y0-1.0,3); tree(YB2.x0-2.2,YB2.y1+2.2,11);
  tree(YB2.x1+2.6,YB2.y1+2.0,23); tree(CX+1.5,YB2.y0-3.4,41); tree(YB2.x1+2.4,YB2.y0-2.6,57);
  push(PS.fredi[0],PS.fredi[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); fredi(ctx,z,T); ctx.restore(); });
  for(const d of decorPlacements())
    push(d.gx,d.gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); drawDecor(ctx,z,d.kind,d.seed); ctx.restore(); });
  hensUpdate();
  for(const h of HENS) push(h.gx,h.gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); drawHen(ctx,z,h); ctx.restore(); });

  for(const p of S.plots) push(p.gx,p.gy,null,p), items[items.length-1].plot=p;
  items.sort((a,b)=>a.d-b.d);

  for(const it of items){ if(it.plot) drawPlot(it.plot); }
  drawFence();
  for(const it of items){
    const p=iso(it.gx,it.gy), s=w2s(p.x,p.y);
    if(it.plot) drawPlant2(it.plot); else it.fn(s,cam.z);
  }
  /* grade the whole yard to the hour before the readable UI goes on top,
     so bubbles and coins stay legible after dark */
  if(SUN.mul){
    ctx.save();
    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=rgb(SUN.tint); ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }
  if(SUN.night>0.1){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgba(26,42,84,'+(0.20*SUN.night)+')';
    ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }
  drawNightLights();

  for(const it of items){ if(it.plot) drawBadge(it.plot); }
  butterflies();
  drawFX(dt);
}

function decorPlacements(){

    const n=(S.decor&&S.decor[d.id])||0;
    for(let k=0;k<n;k++){
