function drawWalker(c,z,w){
  const walking=w.state==='walk';
  const arms=w.state==='photo'?'up':(w.state==='look'?'point':null);
  const H=w.g.h;
  c.save();
  c.save();
  c.scale(w.face>0?1:-1,1);
  if(w.kind==='bike'){
    drawBike(c,z,w.g,w.ph);
  } else if(w.kind==='cat'){
    drawCat(c,z,1,w.ph);
  } else if(w.kind==='skater'){
    c.save(); c.translate(0,-6*z*H); drawGuy(c,z,w.g,w.ph*0.4,false,null); c.restore();
    drawBoard(c,z,H,w.ph);
  } else if(w.kind==='couple'){
    const talk=w.state==='chat';
    c.save(); c.translate(-13*z,0); drawGuy(c,z,w.g,w.ph,walking,talk?'point':null); c.restore();
    c.save(); c.translate(4*z,-2*z); drawGuy(c,z,w.g2,w.ph+0.7,walking,null); c.restore();
    c.save(); c.translate(24*z,2*z); drawPram(c,z,1); c.restore();
  } else if(w.kind==='friends'){
    const talk=w.state==='chat';
    c.save(); c.translate(-10*z,0); drawGuy(c,z,w.g,w.ph,walking,talk?'point':null); c.restore();
    c.save(); c.translate(9*z,-1*z); drawGuy(c,z,w.g2,w.ph+1.4,walking,null); c.restore();
  } else if(w.kind==='dog'){
    drawGuy(c,z,w.g,w.ph,walking,null);
    const sniff=w.state==='sniff';
    c.strokeStyle='#8A5A34'; c.lineWidth=1.6*z; c.lineCap='round';
    c.beginPath(); c.moveTo(7*z,-20*z); c.lineTo(sniff?24*z:21*z,sniff?-6*z:-14*z); c.stroke();
    c.save(); c.translate(26*z,2*z);
    if(sniff) c.rotate(0.22);
    drawDog(c,z,0.85,w.ph); c.restore();
  } else {
    drawGuy(c,z,w.g,w.kind==='kid'?w.ph*1.3:w.ph,walking,arms);
    if(w.kind==='elder'){
      c.strokeStyle='#7A5230'; c.lineWidth=2.2*z; c.lineCap='round';
      c.beginPath(); c.moveTo(9*z,-18*z); c.lineTo(12*z,2*z); c.stroke();
    }
    if(w.kind==='shop') drawBags(c,z,H);
    if(w.kind==='courier') drawCourierBox(c,z,H);
    if(w.kind==='stoner') drawJoint(c,z,H,w.puff+T*0.2);
    if(w.kind==='phone'||w.kind==='night'){
      c.fillStyle='#2A2A32';
      c.save(); c.translate(7*z,-30*z); c.rotate(-0.3);
      roundPoly(c,[[-2*z,-3.6*z],[2*z,-3.6*z],[2*z,3.6*z],[-2*z,3.6*z]],0.8*z); c.fill();
      if(SUN.lit){
        c.globalCompositeOperation='lighter';
        const g=c.createRadialGradient(0,0,0.5,0,0,16*z);
        g.addColorStop(0,'rgba(180,220,255,.55)'); g.addColorStop(1,'rgba(180,220,255,0)');
        c.fillStyle=g; c.beginPath(); c.arc(0,0,16*z,0,TAU); c.fill();
        c.globalCompositeOperation='source-over';
      }
      c.restore();
    }
    if(w.state==='photo'){
      c.fillStyle='#2E2E36';
      roundPoly(c,[[-5*z,-56*z],[7*z,-56*z],[7*z,-48*z],[-5*z,-48*z]],2*z); c.fill();
      c.fillStyle='#8FD6F2';
      c.beginPath(); c.arc(1*z,-52*z,2.6*z,0,TAU); c.fill();
      if(w.flash>0.35){
        c.save(); c.globalCompositeOperation='lighter';
        const g=c.createRadialGradient(1*z,-52*z,1,1*z,-52*z,34*z);
        g.addColorStop(0,'rgba(255,255,255,'+(w.flash*0.75)+')');
        g.addColorStop(1,'rgba(255,255,255,0)');
        c.fillStyle=g; c.beginPath(); c.arc(1*z,-52*z,34*z,0,TAU); c.fill();
        c.restore();
      }
    }
  }
  c.restore();
  if(w.say&&z>0.34) saySmall(c,z,w.say,H);
  c.restore();
}

/* ------------------------------------------------------------------- flock
   Sparrows that behave like sparrows: they wheel around the yard as a group,
   drop onto the fence together, potter about, and all leave at once the moment
   something startles them. Positions are in grid space with a height in screen
   units, so they sit correctly however far the camera is zoomed. */
const FLOCK={mode:'fly', t:5+Math.random()*8, anchor:{gx:CX,gy:CY-2,tgx:CX,tgy:CY-2,h:150}, birds:[]};
for(let i=0;i<9;i++) FLOCK.birds.push({
  gx:CX+(Math.random()-0.5)*6, gy:CY+(Math.random()-0.5)*6, h:140+Math.random()*60,
  vx:0, vy:0, vh:0, ph:Math.random()*TAU, s:1.15+Math.random()*0.45,
  ox:(Math.random()-0.5)*3.4, oy:(Math.random()-0.5)*3.4, oh:(Math.random()-0.5)*40,
  perch:null, hop:0, peck:Math.random()*3, face:1
});
/* the top rail of the two front fence runs, which is where a bird would sit */
function perchSpots(){
  const b=yardB(), out=[];
  for(let i=0;i<6;i++){
    const t=(i+0.7)/6.6;
    out.push([lerp(b.x1,b.x0,t), b.y1]);
  }
  for(let i=0;i<5;i++){
    const t=(i+0.8)/5.8;
    out.push([b.x1, lerp(b.y0,b.y1,t)]);
  }
  return out;
}
function flockStartle(){
  if(FLOCK.mode==='fly') return;
  FLOCK.mode='fly'; FLOCK.t=9+Math.random()*14;
  for(const b of FLOCK.birds){ b.perch=null; b.vh=-90-Math.random()*70; }
}
function flockUpdate(dt){
  FLOCK.t-=dt;
  const b=yardB();
  if(FLOCK.mode==='fly'){
    /* the whole group drifts to a new corner of the sky every few seconds */
    const a=FLOCK.anchor;
    if(Math.hypot(a.tgx-a.gx,a.tgy-a.gy)<1.2){
      a.tgx=lerp(b.x0-2,b.x1+2,Math.random());
      a.tgy=lerp(b.y0-2,b.y1+2,Math.random());
      a.h=110+Math.random()*90;
    }
    a.gx+=(a.tgx-a.gx)*Math.min(1,dt*0.5);
    a.gy+=(a.tgy-a.gy)*Math.min(1,dt*0.5);
    if(FLOCK.t<=0 && WX.i<0.25){       /* birds do not sit out in the rain */
      const spots=perchSpots().sort(()=>Math.random()-0.5);
      FLOCK.birds.forEach((k,i)=>{ k.perch=spots[i%spots.length]; });
      FLOCK.mode='land'; FLOCK.t=14+Math.random()*22;
    }
    for(const k of FLOCK.birds){
      const tx=a.gx+k.ox, ty=a.gy+k.oy, th=a.h+k.oh+Math.sin(T*1.6+k.ph)*14;
      k.vx+=(tx-k.gx)*dt*1.9; k.vy+=(ty-k.gy)*dt*1.9; k.vh+=(th-k.h)*dt*2.4;
      /* nobody flies through anybody */
      for(const o of FLOCK.birds){
        if(o===k) continue;
        const dx=k.gx-o.gx, dy=k.gy-o.gy, d2=dx*dx+dy*dy;
        if(d2<0.5&&d2>1e-4){ const f=dt*2.2/d2; k.vx+=dx*f; k.vy+=dy*f; }
      }
      k.vx*=0.94; k.vy*=0.94; k.vh*=0.9;
      k.gx+=k.vx*dt; k.gy+=k.vy*dt; k.h+=k.vh*dt;
      if(Math.abs(k.vx)>0.04) k.face=k.vx>0?1:-1;
      k.ph+=dt*(9+k.s*3);
    }
  } else {
    let allDown=true;
    for(const k of FLOCK.birds){
      if(!k.perch) continue;
      const tx=k.perch[0], ty=k.perch[1];
      const d=Math.hypot(tx-k.gx,ty-k.gy);
      if(FLOCK.mode==='land'){
        k.gx+=(tx-k.gx)*Math.min(1,dt*2.6);
        k.gy+=(ty-k.gy)*Math.min(1,dt*2.6);
        k.h+=(34-k.h)*Math.min(1,dt*2.2);
        k.ph+=dt*11;
        if(k.face!==undefined&&Math.abs(tx-k.gx)>0.02) k.face=tx>k.gx?1:-1;
        if(d>0.05||k.h>36) allDown=false;
      } else {
        /* perched: shuffle along the rail, bob, peck */
        k.peck-=dt;
        if(k.peck<=0){ k.peck=1.2+Math.random()*3; k.hop=1; k.face=Math.random()<0.5?-1:1; }
        if(k.hop>0) k.hop=Math.max(0,k.hop-dt*3.4);
        k.h=34+Math.sin(k.hop*Math.PI)*7;
      }
    }
    if(FLOCK.mode==='land'&&allDown){ FLOCK.mode='perch'; }
    if(FLOCK.t<=0||WX.i>0.4) flockStartle();
  }
}
function drawBird(c,z,k){
  const flying=FLOCK.mode!=='perch';
  const s=k.s*z;
  c.save();
  c.scale(k.face>0?1:-1,1);
  const flap=flying?Math.sin(k.ph):0;
  /* tail */
  c.fillStyle='#5A4A3C';
  c.beginPath(); c.moveTo(-4*s,-3*s); c.lineTo(-11*s,-1*s+flap*1.4*s); c.lineTo(-4*s,0); c.closePath(); c.fill();
  /* body */
  c.fillStyle='#7A6450';
  c.beginPath(); c.ellipse(0,-4*s,6.4*s,4.4*s,-0.12,0,TAU); c.fill();
  c.fillStyle='#C6B49A';
  c.beginPath(); c.ellipse(0.6*s,-2.6*s,4.4*s,2.8*s,-0.1,0,TAU); c.fill();
  /* head */
  c.fillStyle='#6B5642';
  c.beginPath(); c.arc(5.4*s,-7.4*s,3.3*s,0,TAU); c.fill();
  c.fillStyle='#E8A93C';
  c.beginPath(); c.moveTo(8.2*s,-7.6*s); c.lineTo(12*s,-6.6*s); c.lineTo(8.2*s,-5.8*s); c.closePath(); c.fill();
  c.fillStyle='#1E1712';
  c.beginPath(); c.arc(6.3*s,-8.2*s,0.95*s,0,TAU); c.fill();
  /* wings: spread and beating in the air, folded on the rail */
  if(flying){
    c.fillStyle='#544436';
    for(const side of [1,0.72]){
      c.save(); c.rotate(-flap*0.75*side);
      c.beginPath();
      c.moveTo(-1*s,-6*s);
      c.quadraticCurveTo(-6*s,-13*s*side,-13*s,-9*s*side);
      c.quadraticCurveTo(-6*s,-5*s,-1*s,-5*s);
      c.closePath(); c.fill();
      c.restore();
    }
  } else {
    c.fillStyle='#5E4C3C';
    c.beginPath(); c.ellipse(-1.4*s,-4.4*s,4.6*s,2.6*s,0.18,0,TAU); c.fill();
    c.strokeStyle='#4A3B2E'; c.lineWidth=0.9*s;
    c.beginPath(); c.moveTo(1*s,0); c.lineTo(1*s,2.4*s); c.moveTo(3*s,0); c.lineTo(3*s,2.4*s); c.stroke();
  }
  c.restore();
}
function drawFlock(){
  const hz=horizonY();
  for(const k of FLOCK.birds){
    const p=iso(k.gx,k.gy), sp=w2s(p.x,p.y);
    const y=sp.y-k.h*cam.z;
    if(y<-40||y>VH+40||sp.x<-60||sp.x>VW+60) continue;
    /* a shadow on the grass, so they read as being above the yard */
    if(FLOCK.mode!=='perch'&&sp.y>hz){
      ctx.save();
      ctx.globalAlpha=clamp(0.20-k.h*0.0009,0.03,0.2);
      ctx.fillStyle='#12340C';
      ctx.beginPath(); ctx.ellipse(sp.x,sp.y,7*cam.z*k.s,3*cam.z*k.s,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.save(); ctx.translate(sp.x,y); drawBird(ctx,cam.z,k); ctx.restore();
  }
}
/* hens pottering about the yard: walk a bit, stop, peck, repeat */
const HENS=[];
for(let i=0;i<4;i++) HENS.push({
  gx:1.5+hash(i*13)*10, gy:2+hash(i*29)*9, tx:0, tz:0, st:'idle', t:hash(i*7)*2,
  face:1, bob:hash(i*3)*6, col:i%2?'#FFFFFF':'#F3E2C0', comb:i===0?'#E8574A':'#F0705F'
});
function hensUpdate(){
  for(const h of HENS){
    h.t-=DT;
    if(h.t<=0){
      if(h.st==='walk'){ h.st='peck'; h.t=1.1+hash((h.gx*97)|0)*1.6; }
      else {
        h.st='walk'; h.t=1.4+hash((h.gy*53)|0)*1.8;
        const b=yardB();                      /* hens stay inside the fence */
        h.tx=clamp(h.gx+(Math.random()-0.5)*3.5,b.x0+0.5,b.x1-0.5);
        h.tz=clamp(h.gy+(Math.random()-0.5)*3.5,b.y0+0.5,b.y1-0.5);
        h.face=(h.tx<h.gx)?-1:1;
      }
    }
    if(h.st==='walk'){
      const dx=h.tx-h.gx, dz=h.tz-h.gy, d=Math.hypot(dx,dz);
      if(d>0.05){ h.gx+=dx/d*0.62*DT; h.gy+=dz/d*0.62*DT; }
      h.bob+=DT*9;
    }
  }
}
function drawHen(c,z,h){
  const walking=h.st==='walk';
  const bob=walking?Math.abs(Math.sin(h.bob))*2.6*z:0;
  const peck=(!walking)?clamp(Math.sin(T*6+h.gx)*1.6,-1,1):0;
  c.save();
  c.fillStyle='rgba(0,0,0,.18)';
  c.beginPath(); c.ellipse(0,0,13*z,5*z,0,0,TAU); c.fill();
  c.translate(0,-bob);
  c.scale(h.face,1);
  c.strokeStyle='#E7A23C'; c.lineWidth=2*z; c.lineCap='round';
  for(const s of [-1,1]){
    const sw=walking?Math.sin(h.bob+(s>0?0:Math.PI))*3*z:0;
    c.beginPath(); c.moveTo(s*2.5*z,-6*z); c.lineTo(s*2.5*z+sw,0); c.stroke();
  }
  c.fillStyle=h.col;
  c.beginPath(); c.ellipse(0,-12*z,10*z,8.5*z,0,0,TAU); c.fill();
  c.fillStyle='rgba(0,0,0,.08)';
  c.beginPath(); c.ellipse(-3*z,-11*z,6*z,5.5*z,0.3,0,TAU); c.fill();
  const hy=-20*z+peck*4*z, hx=5*z+peck*2*z;
  c.fillStyle=h.col;
  c.beginPath(); c.arc(hx,hy,5.4*z,0,TAU); c.fill();
  c.fillStyle=h.comb;
  c.beginPath(); c.arc(hx-1*z,hy-5*z,2.2*z,0,TAU); c.fill();
  c.beginPath(); c.arc(hx+2*z,hy-4.6*z,1.8*z,0,TAU); c.fill();
  c.fillStyle='#F2A93C';
  c.beginPath(); c.moveTo(hx+5*z,hy); c.lineTo(hx+9.5*z,hy+1.4*z); c.lineTo(hx+5*z,hy+2.8*z); c.closePath(); c.fill();
  c.fillStyle='#3A2A1C';
  c.beginPath(); c.arc(hx+2.2*z,hy-1*z,1.3*z,0,TAU); c.fill();
  c.restore();
}

/* birds crossing the sky band */
const BIRDS=[];
for(let i=0;i<5;i++) BIRDS.push({x:hash(i*31)*1.4-0.2, y:0.12+hash(i*17)*0.5, v:0.028+hash(i*7)*0.03, s:0.7+hash(i*5)*0.7, p:hash(i*11)*TAU});
function drawBirds(){
  const hz=horizonY();
  const dim=0.35+0.55*(1-SUN.night);
  ctx.save();
  ctx.strokeStyle='rgba(52,44,38,'+dim+')';
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const b of BIRDS){
    b.x+=b.v*DT; if(b.x>1.35) b.x=-0.25;
    b.p+=DT*7;
    const x=b.x*VW, y=b.y*hz;
    const flap=Math.sin(b.p)*0.55;
    const w=9*b.s;
    ctx.lineWidth=2.1*b.s;
    ctx.beginPath();
    ctx.moveTo(x-w,y+flap*w*0.7);
    ctx.quadraticCurveTo(x-w*0.35,y-flap*w*0.5,x,y);
    ctx.quadraticCurveTo(x+w*0.35,y-flap*w*0.5,x+w,y+flap*w*0.7);
    ctx.stroke();
  }

}

/* a few butterflies drifting over the field — cheap, and the yard feels alive */
const BFLY=[];
for(let i=0;i<5;i++) BFLY.push({
  p:hash(i*13)*TAU, sp:0.17+hash(i*7)*0.15, rx:2.4+hash(i*3)*3.4, ry:1.6+hash(i*19)*2.2,
  cx:4+hash(i*5)*7, cy:6+hash(i*11)*5, lift:34+hash(i*23)*40,
  col:['#FFD54A','#FF9BC4','#8FD8FF','#C7A0FF','#FFF0A0'][i]
});
function butterflies(){
  const z=cam.z;
  if(z<0.4) return;
  const night=SUN.night;
  for(const b of BFLY){
    b.p+=b.sp*DT*(night>0.5?0.55:1);
    const gx=b.cx+Math.cos(b.p)*b.rx, gy=b.cy+Math.sin(b.p*1.3)*b.ry;
    const w=iso(gx,gy), s=w2s(w.x,w.y);
    const y=s.y-(b.lift+Math.sin(b.p*3.1)*10)*z;
    if(y<horizonY()) continue;
    if(night>0.5){
      /* after dark the butterflies turn in and the fireflies come out */
      const pulse=0.35+0.65*Math.abs(Math.sin(T*2.4+b.p*3));
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(s.x,y,0,s.x,y,13*z);
      g.addColorStop(0,'rgba(214,255,150,'+(0.85*pulse*night)+')');
      g.addColorStop(1,'rgba(180,255,120,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,y,13*z,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(238,255,190,'+(0.95*pulse)+')';
      ctx.beginPath(); ctx.arc(s.x,y,1.9*z,0,TAU); ctx.fill();
      ctx.restore();
      continue;
    }
    const flap=Math.abs(Math.sin(T*11+b.p*4));
    ctx.save(); ctx.globalAlpha=1-night*1.6; ctx.translate(s.x,y); ctx.rotate(Math.cos(b.p)*0.25);
    ctx.fillStyle=b.col;
    for(const sgn of [-1,1]){
      ctx.save(); ctx.scale(sgn*(0.35+0.65*flap),1);
      ctx.beginPath(); ctx.ellipse(4.4*z,-1.4*z,4.4*z,3.2*z,0.4,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3.4*z,2.4*z,3.2*z,2.4*z,-0.3,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle='#5A4227';
    ctx.beginPath(); ctx.ellipse(0,0,1.3*z,4*z,0,0,TAU); ctx.fill();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------- input */
let drag=null, moved=0, pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,id:e.pointerId}; moved=0;
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId||pinch) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  moved=Math.max(moved,Math.hypot(dx,dy));
  if(moved>10){ cam.x=drag.cx-dx/cam.z; cam.y=drag.cy-dy/cam.z; clampCam(); }
});
cv.addEventListener('pointerup',e=>{
  if(drag&&drag.id===e.pointerId&&moved<10) tapAt(e.clientX,e.clientY);
  drag=null;
});
cv.addEventListener('pointercancel',()=>{drag=null;});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.tz=clamp(cam.tz*(e.deltaY>0?0.9:1.11),0.3,1.9);
},{passive:false});
let tdist=0;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinch=true; drag=null;
    tdist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&tdist){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    cam.tz=clamp(cam.tz*(d/tdist),0.3,1.9); tdist=d;
  }
},{passive:true});
cv.addEventListener('touchend',e=>{ if(e.touches.length<2){ pinch=null; tdist=0; } },{passive:true});
function clampCam(){
  const c=iso(CX,CY);
  const sp=yardR()*2+8;
  const halfW=sp*TW/2, halfH=sp*TH/2;
  cam.x=clamp(cam.x,c.x-halfW,c.x+halfW);
  /* keep the far corner of the yard below the horizon, or the ground clip
     leaves the plots floating in the sky */
  const top=iso(yardB().x0-2,yardB().y0-2);
  const minY=top.y-(VH*0.52-horizonY()-40)/Math.max(0.2,cam.z);
  cam.y=clamp(cam.y,Math.max(c.y-halfH,minY),c.y+halfH+120);
}
function tapAt(sx,sy){
  const g=s2g(sx,sy);
  const gx=Math.round(g.gx), gy=Math.round(g.gy);
  /* a hand coming down near the rail sends the whole flock up at once */
  if(FLOCK.mode==='perch'&&FLOCK.birds.some(k=>Math.hypot(k.gx-g.gx,k.gy-g.gy)<3.2)) flockStartle();
  const p=S.plots.find(q=>q.gx===gx&&q.gy===gy);
  if(!p) return;
  actx();
  { const s=tileTop(p.gx,p.gy); fx({k:'ring',x:s.x,y:s.y,life:0.42}); }
  if(p.i>=S.owned){
    if(p.i===S.owned) buyPlot(); else toast('קודם תרחיב את החלקות שלפניה');
    return;
  }
  const t=now();
  if(!p.sid){ pending=p; openSeeds(); return; }
  if(t>=p.at+p.dur){ harvest(p); return; }
  if(!p.wet){ water(p); return; }
  const st=BYID[p.sid];
  toast(st.nm+' — עוד '+clock(p.at+p.dur-t));
}

/* ---------------------------------------------------------------- actions */
let pending=null;
function plotScreen(p){ const s=tileTop(p.gx,p.gy); return s; }

function plant(p,st){
  if(S.coins<st.seed){ SFX.nope(); toast('אין מספיק כסף לזרעים'); return false; }
  S.coins-=st.seed;
  p.sid=st.id; p.at=now(); p.dur=growMs(st); p.wet=false; p.bk=undefined;
  S.planted=(S.planted||0)+1;
  if(S.ups.sprk>0){ p.wet=true; p.dur=Math.floor(p.dur*0.62); }
  const s=plotScreen(p);
  puff(s.x,s.y-20*cam.z,'#8A5A38',7);
  SFX.plant(); refreshHUD(); save();
  tutReach(1);
  return true;
}
function water(p){
  if(p.wet) return;
  p.wet=true;
  const left=p.at+p.dur-now();
  p.dur-=Math.floor(left*0.4);
  const s=plotScreen(p);
  drops(s.x,s.y); SFX.water(); save(); tutReach(2);
}
function harvest(p){
  const st=BYID[p.sid]; if(!st) return;
  let q=Math.max(1,Math.round(2*yieldMul()));
  let crit=false;
  if(Math.random()<critChance()){ q*=2; crit=true; }
  S.inv[st.id]=(S.inv[st.id]||0)+q;
  S.harvested+=q;
  addXP(st.xp);
  p.sid=null; p.at=0; p.dur=0; p.wet=false;
  const s=plotScreen(p);
  plantPop(s.x,s.y,st);
  /* "harvest all" fires this once per plot, so thin the trimmings out when the
     screen is already full rather than dropping older effects on the floor */
  const room=FX.length<170;
  leafBurst(s.x,s.y,st,room?7:3);
  if(room) jarFly(s.x,s.y,st);
  puff(s.x,s.y-30*cam.z,st.leaf,room?12:5);
  popText(s.x,s.y-96*cam.z,'+'+q+(crit?' ×2!':''),crit?'#FFE066':'#CFF7B8');
  FRED.jump=1;
  flockStartle();
  SFX.reap(); refreshHUD(); save();
  tutReach(4);
}
function sell(id,qty){
  const st=BYID[id]; const have=invOf(id);
  qty=Math.min(qty,have); if(qty<=0) return 0;
  const gain=qty*unitPrice(st);
  S.inv[id]=have-qty; if(S.inv[id]<=0) delete S.inv[id];
  S.coins+=gain; S.earned+=gain;
  SFX.coin(); coinBurst(VW*0.5,VH*0.55,Math.min(14,4+qty));
  popText(VW*0.5,VH*0.42,'+'+fmt(gain)+' ₪','#FFE9A8');
  refreshHUD(); save();
  tutReach(6);
  return gain;
}
function buyPlot(){
  const c=plotCost();
  if(S.owned>=PLOT_SPOTS.length){ toast('החצר מלאה עד הגדר'); return; }
  if(S.coins<c){ SFX.nope(); toast('חלקה נוספת עולה '+fmt(c)+' ₪'); return; }
  S.coins-=c; S.owned++;
  const p=S.plots[S.owned-1], s=plotScreen(p);
  puff(s.x,s.y,'#6FBF4A',14);
  SFX.buy(); toast('חלקה חדשה נפתחה!'); refreshHUD(); save();
}
function addXP(n){
  S.xp+=n;
  let ups=[];
  while(S.xp>=xpNeed(S.level)){
    S.xp-=xpNeed(S.level); S.level++;
    const got=STRAINS.filter(s=>s.lvl===S.level);
    ups=ups.concat(got);
    S.coins+=S.level*45;
  }
  if(ups.length||S.level>1) refreshHUD();
  if(ups.length){
    SFX.level();
    $('luN').textContent=S.level;
    $('luU').textContent='נפתח זן חדש: '+ups.map(u=>u.nm).join(', ');
    showLevel();
  }
}
let luT=null;
function showLevel(){
  $('levelup').classList.add('on');
  clearTimeout(luT);
  luT=setTimeout(()=>$('levelup').classList.remove('on'),2400);
}

/* ---------------------------------------------------------------- orders */
function makeOrder(){
  const pool=STRAINS.filter(s=>unlocked(s));
  if(!pool.length) return null;
  const n=1+Math.floor(Math.random()*Math.min(3,pool.length));
  const items=[]; const used={};
  for(let i=0;i<n;i++){
    const st=pool[Math.floor(Math.random()*pool.length)];
    if(used[st.id]) continue;
    used[st.id]=1;
    items.push({id:st.id, q:1+Math.floor(Math.random()*4)});
  }
  let val=0; for(const it of items) val+=unitPrice(BYID[it.id])*it.q;
  return {
    id:'o'+now()+Math.floor(Math.random()*999),
    who:CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)],
    items, coins:Math.floor(val*1.55), xp:Math.max(4,Math.floor(val/60))
  };
}
function tickOrders(){
  if(S.orders.length>=3) return;
  if(now()-S.lastOrder < 45000) return;
  const o=makeOrder(); if(!o) return;
  S.orders.push(o); S.lastOrder=now();
  SFX.order(); toast('הזמנה חדשה מ' + o.who);
  refreshHUD(); save();
}
function canFill(o){ return o.items.every(it=>invOf(it.id)>=it.q); }
function fillOrder(o){
  if(!canFill(o)){ SFX.nope(); toast('חסר לך יבול להזמנה הזאת'); return; }
  for(const it of o.items){
    S.inv[it.id]-=it.q;
    if(S.inv[it.id]<=0) delete S.inv[it.id];
  }
  S.coins+=o.coins; S.earned+=o.coins; S.filled=(S.filled||0)+1;
  S.orders=S.orders.filter(x=>x.id!==o.id);
  addXP(o.xp);
  SFX.coin(); coinBurst(VW*0.5,VH*0.55,16);
  popText(VW*0.5,VH*0.42,'+'+fmt(o.coins)+' ₪','#FFE9A8');
  refreshHUD(); save(); openOrders();
}

/* ---------------------------------------------------------------- tutorial
   The first minute decides whether anyone stays, so it is walked step by step:
   one instruction at a time, the target ringed on the field or lit up in the
   dock, and it only advances when the player actually does the thing. */
const TUT=[
  {t:'לחץ על החלקה החומה כדי לשתול', target:'plot-empty'},
  {t:'בחר את הזן הראשון שלך',        target:'#shBody .card'},
  {t:'עכשיו השקה — לחץ שוב על החלקה', target:'plot-dry'},
  {t:'רגע... זה גדל. חכה שיופיע ✓',   target:'plot-growing', passive:true},
  {t:'מוכן! לחץ על החלקה כדי לקצור',  target:'plot-ready'},
  {t:'פתח את המחסן',                  target:'#bbarn'},
  {t:'מכור את היבול וקבל כסף',        target:'#shBody .buy'}
];
function tutStep(){ return (S && S.tut<TUT.length) ? TUT[S.tut] : null; }
/* "the player just did the thing for step N". Never require the steps in order:
   somebody who harvests without watering, or whose sprinkler waters for them,
   would otherwise be stuck on a step they can no longer perform. */
function tutReach(step){
  if(!S||S.tut>=TUT.length) return;
  if(step<S.tut) return;
  S.tut=step+1;
  if(S.tut>=TUT.length){
    S.tut=TUT_DONE;
    S.coins+=250;
    toast('כל הכבוד! זה כל המשחק. עכשיו תגדיל.');
    SFX.level(); coinBurst(VW*0.5,VH*0.55,10);
  }
  refreshHUD(); tutPaint(); save();
}
let tutEl=null, tutGlow=null, tutShown=-1;
function tutPaint(){
  const st=tutStep();
  if(tutGlow){ tutGlow.classList.remove('tut-glow'); tutGlow=null; }
  if(!tutEl){
    tutEl=document.createElement('div');
    tutEl.id='tutbar';
    document.body.appendChild(tutEl);
  }
  if(!st || document.getElementById('intro')){ tutEl.classList.remove('on'); return; }
  tutEl.textContent=st.t;
  tutEl.classList.add('on');
  if(st.target && st.target[0]==='#'){
    const el=document.querySelector(st.target);
    if(el){ el.classList.add('tut-glow'); tutGlow=el; }
  }
}
/* the ring drawn on the field for whichever plot the step is about */
function tutPlot(){
  const st=tutStep(); if(!st||!st.target||st.target[0]==='#') return null;
  const owned=S.plots.filter(p=>p.i<S.owned);
  if(st.target==='plot-empty')   return owned.find(p=>!p.sid)||null;
  if(st.target==='plot-dry')     return owned.find(p=>p.sid&&!p.wet&&now()<p.at+p.dur)||null;
  if(st.target==='plot-growing') return owned.find(p=>p.sid&&now()<p.at+p.dur)||null;
  if(st.target==='plot-ready')   return owned.find(p=>p.sid&&now()>=p.at+p.dur)||null;
  return null;
}
function drawTutRing(){
  const p=tutPlot(); if(!p) return;
  const s=tileTop(p.gx,p.gy), z=cam.z;
  const pulse=0.5+0.5*Math.sin(T*3.2);
  ctx.save();
  ctx.lineWidth=(3+pulse*2)*z;
  ctx.strokeStyle='rgba(255,244,180,'+(0.55+0.4*pulse)+')';
  diamond(ctx,s.x,s.y,TW*z*(1.02+pulse*0.06),TH*z*(1.02+pulse*0.06));
  ctx.stroke();
  /* a hand tapping the tile */
  ctx.translate(s.x+18*z, s.y-26*z-pulse*7*z);
  ctx.rotate(-0.25);
  ctx.fillStyle='#FFE9C9'; ctx.strokeStyle='#6B4A24'; ctx.lineWidth=2*z;
  ctx.beginPath(); ctx.ellipse(0,0,9*z,13*z,0,0,TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,-13*z,4.5*z,10*z,0,0,TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ---------------------------------------------------------------- toasts */
function toast(txt){
  const d=document.createElement('div');
  d.className='toast'; d.textContent=txt;
  $('toasts').appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0';
    setTimeout(()=>d.remove(),320); }, 1700);
  while($('toasts').children.length>3) $('toasts').firstChild.remove();
}

/* One quiet line saying what is worth aiming at next, so there is always a
   reason to come back rather than a wall of menus to work it out from. */
let hintEl=null;
function nextHint(){
  if(!hintEl){ hintEl=document.createElement('div'); hintEl.id='nexthint'; document.body.appendChild(hintEl); }
  if(S.tut<TUT_DONE || document.getElementById('intro')){ hintEl.classList.remove('on'); return; }
  let txt='';
  const locked=STRAINS.find(s=>!unlocked(s));
  const readyGoal=GOALS.find(goalReady);
  const orderReady=S.orders.find(canFill);
  const cheapPlot=plotCost();
  if(orderReady) txt='יש הזמנה מוכנה למשלוח';
  else if(readyGoal) txt='מטרה הושלמה: '+readyGoal.nm;
  else if(dailyReady()) txt='הבונוס היומי מחכה';
  else if(S.owned<PLOT_SPOTS.length && S.coins>=cheapPlot) txt='אפשר לקנות חלקה נוספת';
  else if(locked && S.level>=locked.lvl-2) txt='רמה '+locked.lvl+' פותחת את '+locked.nm;
  else if(S.owned<PLOT_SPOTS.length) txt='עוד '+fmt(cheapPlot-S.coins)+' ₪ לחלקה הבאה';
  else if(YARD[yardLv()+1]) txt='עוד '+fmt(Math.max(0,YARD[yardLv()+1].cost-S.coins))+' ₪ להרחבת השטח';
  if(!txt){ hintEl.classList.remove('on'); return; }
  if(hintEl.textContent!==txt) hintEl.textContent=txt;
  hintEl.classList.add('on');
}

/* ---------------------------------------------------------------- hud */
function refreshHUD(){
  $('coins').textContent=fmt(S.coins);
  $('lvlbadge').textContent=S.level;
  const need=xpNeed(S.level);
  /* the word does not fit next to the clock on a narrow phone */
  $('xplab').textContent=fmt(S.xp)+' / '+fmt(need)+(innerWidth>440?' ניסיון':'');
  $('xpfill').style.width=clamp(S.xp/need*100,0,100)+'%';
  const rdy=S.plots.filter(p=>p.i<S.owned&&p.sid&&now()>=p.at+p.dur).length;
  const dry=S.plots.filter(p=>p.i<S.owned&&p.sid&&!p.wet&&now()<p.at+p.dur).length;
  const emp=S.plots.filter(p=>p.i<S.owned&&!p.sid).length;
  $('qharvest').classList.toggle('on',rdy>0);
  $('qharvest').textContent='אסוף הכל ('+rdy+')';
  $('qwater').classList.toggle('on',dry>0);
  $('qwater').textContent='השקה מלאה ('+dry+')';
  const ls=BYID[S.lastSeed]||STRAINS[0];
  const can=emp>0 && unlocked(ls);
  $('qplant').classList.toggle('on',can);
  $('qplant').textContent='שתול '+ls.nm+' ('+emp+')';
  const ready=S.orders.filter(canFill).length;
  $('border').classList.toggle('has',ready>0);
  $('odot').textContent=ready;
  /* the "wait for it to grow" step has nothing to tap; move it on by itself */
  if(S.tut===3 && S.plots.some(p=>p.i<S.owned&&p.sid&&now()>=p.at+p.dur)) S.tut=4;
  /* keep the coach mark honest even if the step changed somewhere that did not
     repaint it — a stale instruction is worse than none */
  if(S.tut!==tutShown){ tutShown=S.tut; tutPaint(); }
  nextHint();
  const gr=GOALS.filter(goalReady).length+(dailyReady()?1:0);
  $('bmore').classList.toggle('has',gr>0);
  $('gdot').textContent=gr;
  const th=Math.floor(SUN.h)%24, tm=Math.floor((SUN.h%1)*60);
  $('tclock').textContent=String(th).padStart(2,'0')+':'+String(tm).padStart(2,'0');
  $('tico').textContent=SUN.alt>0.06?'☀':SUN.alt>-0.10?'🌇':'🌙';
}
$('qharvest').onclick=()=>{
  const list=S.plots.filter(p=>p.i<S.owned&&p.sid&&now()>=p.at+p.dur);
  list.forEach((p,i)=>setTimeout(()=>harvest(p),i*55));
};
$('qwater').onclick=()=>{
  const list=S.plots.filter(p=>p.i<S.owned&&p.sid&&!p.wet&&now()<p.at+p.dur);
  list.forEach((p,i)=>setTimeout(()=>{ water(p); refreshHUD(); },i*45));
};
$('qplant').onclick=()=>{
  const st=BYID[S.lastSeed]||STRAINS[0];
  const list=S.plots.filter(p=>p.i<S.owned&&!p.sid);
  let n=0;
  for(const p of list){ if(S.coins<st.seed) break; plant(p,st); n++; }
  if(n) toast('נשתלו '+n+' חלקות');
  else { SFX.nope(); toast('אין מספיק כסף'); }
  refreshHUD();
};

/* The menus sell the flower, not the shrub — every strain gets its own bud. */
/* A quantity chooser: drag the slider, or take a shortcut. Used for how much to
   sell and how many plots to plant, so neither is all-or-nothing any more. */
function amountPicker(max,start,onChange){
  const wrap=document.createElement('div');
  const row=document.createElement('div'); row.className='qsel';
  const num=document.createElement('div'); num.className='qnum';
  const rng=document.createElement('input');
  rng.type='range'; rng.min='1'; rng.max=String(Math.max(1,max));
  rng.value=String(clamp(start||max,1,Math.max(1,max)));
  const chips=document.createElement('div'); chips.className='qchips';
  let val=+rng.value;
  const set=v=>{
    val=clamp(Math.round(v),1,Math.max(1,max));
    rng.value=String(val); num.textContent=fmt(val);
    [...chips.children].forEach(c=>c.classList.toggle('sel',+c.dataset.v===val));
    if(onChange) onChange(val);
  };
  rng.oninput=()=>set(+rng.value);
  row.appendChild(num); row.appendChild(rng);
  wrap.appendChild(row);
  const opts=[['1',1],['5',5],['10',10],['חצי',Math.max(1,Math.floor(max/2))],['הכל',max]];
  const seen=new Set();
  for(const [label,v] of opts){
    if(v>max||seen.has(v)) continue;
    seen.add(v);
    const b=document.createElement('button');
    b.className='qchip'; b.textContent=label; b.dataset.v=v;
    b.onclick=()=>set(v);
    chips.appendChild(b);
  }
  if(chips.children.length>1) wrap.appendChild(chips);
  set(+rng.value);
  return {el:wrap, get:()=>val, set};
}

function mkCanvas(st){
  const c=document.createElement('canvas');
  c.width=104; c.height=104;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(52,54,4,52,54,50);
  g.addColorStop(0,'rgba(255,255,255,.85)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.beginPath(); x.arc(52,54,50,0,TAU); x.fill();
  x.save(); x.translate(52,88);
  drawBud(x,31,st,true);
  x.restore();
  return c;
}

function openSeeds(){
  sheetMode='seeds';
  openSheet('שתילים', pending?'בחר זן לחלקה':'לחיצה תשתול בחלקה פנויה');
  const b=$('shBody'); b.innerHTML='';
  /* how many plots this planting should cover */
  const empties=S.plots.filter(p=>p.i<S.owned&&!p.sid).length;
  let plantN=1;
  if(empties>1 && !pending){
    const bar=document.createElement('div'); bar.className='plantbar';
    const lab=document.createElement('div'); lab.className='lab';
    lab.textContent='כמה חלקות לשתול';
    bar.appendChild(lab);
    const pk=amountPicker(empties,Math.min(empties,1),v=>{ plantN=v; });
    bar.appendChild(pk.el);
    b.appendChild(bar);
    plantN=pk.get();
  }
  const grid=document.createElement('div'); grid.className='grid';
  for(const st of STRAINS){
    const card=document.createElement('div');
    const ok=unlocked(st);
    card.className='card'+(ok?'':' locked');
    const top=document.createElement('div'); top.className='top';
    top.appendChild(mkCanvas(st,1));
    const nm=document.createElement('div');
    nm.innerHTML='<div class="nm">'+st.nm+'</div>'+
      '<div class="meta"><span>⏱ '+clock(growMs(st))+'</span></div>';
    top.appendChild(nm);
    card.appendChild(top);
    const tags=document.createElement('div'); tags.className='tagrow';
    tags.innerHTML='<span class="tg green">זרע '+fmt(st.seed)+'</span>'+
                   '<span class="tg gold">מכירה '+fmt(unitPrice(st))+'</span>';
    card.appendChild(tags);
    const btn=document.createElement('button');
    btn.className='buy j j-green';
    btn.textContent = ok ? ('שתול · '+fmt(st.seed)+' ₪') : ('רמה '+st.lvl);
    if(!ok) btn.disabled=true;
    card.appendChild(btn);
    if(!ok){
      const lb=document.createElement('div'); lb.className='lockbadge';
      lb.textContent='נפתח ברמה '+st.lvl;
      card.appendChild(lb);
    } else {
      const act=()=>{
        S.lastSeed=st.id;
        if(pending && !pending.sid && pending.i<S.owned){
          if(plant(pending,st)){ closeSheet(); refreshHUD(); }
          return;
        }
        const free=S.plots.filter(p=>p.i<S.owned&&!p.sid);
        if(!free.length){ toast('אין חלקה פנויה'); return; }
        let n=0;
        for(const p of free.slice(0,Math.max(1,plantN))){
          if(S.coins<st.seed) break;
          if(plant(p,st)) n++;
        }
        if(!n){ SFX.nope(); toast('אין מספיק כסף'); return; }
        toast(n>1?('נשתלו '+n+' חלקות'):('נשתל '+st.nm));
        closeSheet(); refreshHUD();
      };
      card.onclick=act;
    }
    grid.appendChild(card);
  }
  b.appendChild(grid);
  stagger();
}

/* ---------------------------------------------------------------- loop */
let last=performance.now(), acc=0;
function frame(t){
  /* clamp at both ends: a timestamp that goes backwards (a restored tab, a
     clock adjustment) made dt negative, which sent cam.z through zero and threw
     a negative radius out of the particle draw */
  let dt=clamp((t-last)/1000,0,0.05); last=t;
  if(LAPSE.on){
    LAPSE.t+=dt;
    const u=clamp(LAPSE.t/LAPSE.dur,0,1);
    HOUR_OVERRIDE=LAPSE.h0+(LAPSE.h1-LAPSE.h0)*lapseEase();
    dt*=1+7*Math.sin(Math.PI*u);          /* the street runs fast in the middle */
    if(u>=1){ LAPSE.on=false; HOUR_OVERRIDE=null; lapseCard(); }
  }
  T+=dt; DT=dt;
  FRED.jump=Math.max(0,FRED.jump-dt*2.1);
  cam.z=lerp(cam.z,cam.tz,1-Math.pow(0.002,dt));
  resizeIfNeeded();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* sprites are now baked near 1:1, so keep resampling sharp */
  ctx.imageSmoothingQuality='high';
  scene(dt);
  autoRes(dt);
  acc+=dt;
  if(acc>0.5){
    acc=0; tickOrders(); refreshHUD();
    if(sheetMode==='orders') { /* keep buttons live */
      const btns=$('shBody').querySelectorAll('.mini');
      S.orders.forEach((o,i)=>{ if(btns[i]) btns[i].disabled=!canFill(o); });
    }
  }
  requestAnimationFrame(frame);
}
let lastW=-1,lastH=-1;
function resizeIfNeeded(){
  const w=cv.clientWidth||window.innerWidth, h=cv.clientHeight||window.innerHeight;
  if(w===lastW&&h===lastH) return;
  /* a rotation or a big window change can leave the yard off screen entirely */
  const big=Math.abs(w-lastW)>140||Math.abs(h-lastH)>140;
  lastW=w; lastH=h; resize();
  if(big) fitCam();
}

/* ---------------------------------------------------------------- boot */
function offlineReport(){
  const box=$('offbox'); box.innerHTML='';
  const gone=now()-(S.lastSeen||now());
  if(S.seen && gone>=60000){
    const rdy=S.plots.filter(p=>p.i<S.owned&&p.sid&&now()>=p.at+p.dur).length;
    const mins=Math.floor(gone/60000);
    const r=document.createElement('div'); r.className='offrow';
    r.innerHTML='<span>לא היית '+(mins<60?mins+' דקות':Math.floor(mins/60)+' שעות')+'</span>'+
                '<b>'+rdy+' מוכנים לקציר</b>';
    box.appendChild(r);
  }
  if(S.seen && dailyReady()){
    const r=document.createElement('div'); r.className='offrow';
    r.innerHTML='<span>בונוס יומי מחכה לך</span><b>'+fmt(dailyAmount())+' ₪</b>';
    box.appendChild(r);
  }
}

/* Everything that turns a stored save into a save this build can run. It is
   deliberately additive and defensive: unknown fields are left alone, missing
   ones get defaults, nothing is ever deleted. That is what lets a farm survive
   every future update — including a save written by a NEWER build than the one
   the phone happens to have cached. */
function normalize(){
  if(!S.ups) S.ups={lamp:0,fert:0,sprk:0,mrkt:0,ghs:0};
  for(const k of ['lamp','fert','sprk','mrkt','ghs']) if(typeof S.ups[k]!=='number') S.ups[k]=0;
  if(!S.inv) S.inv={};
  if(!S.orders) S.orders=[];
  if(!S.goals) S.goals={};
  if(!S.decor) S.decor={};
  /* Saves made before the yard/house upgrades have no levels. Defaulting them
     to zero demoted existing farms to the smallest yard and a shack, wiping
     plots people had paid for — so infer a level that fits their progress. */
  const legacy=(typeof S.yardLvl!=='number');
  for(const k of ['yardLvl','houseLvl']) if(typeof S[k]!=='number') S[k]=0;
  S.yardLvl=clamp(S.yardLvl,0,YARD.length-1);
  S.houseLvl=clamp(S.houseLvl,0,HOUSE_LV.length-1);
  if(legacy){
    const lv=S.level||1;
    S.houseLvl=clamp(lv>=50?5:lv>=35?4:lv>=20?3:2,0,HOUSE_LV.length-1);
  }
  /* whatever the source, never leave someone owning more plots than the yard
     has room for */
  for(let y=S.yardLvl;y<YARD.length;y++){
    S.yardLvl=y; rebuildSpots();
    if(PLOT_SPOTS.length>=(S.owned||0)) break;
  }
  for(const k of ['filled','planted','days']) if(typeof S[k]!=='number') S[k]=0;
  if(typeof S.sfx!=='boolean') S.sfx=true;
  A.on=S.sfx;
  if(typeof S.prestige!=='number') S.prestige=0;
  S.plots=Array.isArray(S.plots)?S.plots:[];
  /* re-seat plots onto the canonical layout, keeping planted state */
  const old=S.plots;
  S.plots=[];
  ensurePlots();
  for(let i=0;i<Math.min(old.length,S.plots.length);i++){
    const o=old[i];
    if(o&&o.sid&&BYID[o.sid]){ S.plots[i].sid=o.sid; S.plots[i].at=o.at; S.plots[i].dur=o.dur; S.plots[i].wet=!!o.wet; }
  }
  S.owned=clamp(S.owned||6,1,PLOT_SPOTS.length);
  if(typeof S.tut!=='number') S.tut=(S.seen||S.harvested>0)?TUT_DONE:0;
  S.v=SAVE_V;
}

function boot(){
  let raw=load(), usedBackup=false;
  /* primary unreadable but a backup survives — use it rather than starting over */
  if(!raw){ const bak=loadBackup(); if(bak){ raw=bak; usedBackup=true; } }
  S = raw || fresh();
  try{ normalize(); }
  catch(e){
    /* a save this build genuinely cannot read: fall back to the rolling backup
       rather than dropping someone's farm on the floor */
    const bak=loadBackup();
    if(bak){ S=bak; usedBackup=true; try{ normalize(); }catch(e2){ S=fresh(); normalize(); } }
    else { S=fresh(); normalize(); }
  }
  if(raw && !usedBackup) writeBackup(raw);

  document.body.classList.add('pre');
  resize(); fitCam();
  updateSun();                       /* so the clock pill is right on frame one */
  refreshHUD();
  const wa=$('iwa'); if(wa) wa.href=waLink();
  offlineReport();
  if(S.seen) $('introTxt').textContent='החצר ממשיכה לגדול גם כשאתה לא כאן. בוא נראה מה קרה.';
  $('istart').textContent = S.seen?'חזרה לחצר':'לחצר!';
  $('ireset').style.display = S.seen?'block':'none';
  requestAnimationFrame(frame);
}
$('istart').onclick=()=>{
  actx();
  /* read how long they were gone BEFORE save() stamps lastSeen to now */
  const away=now()-(S.lastSeen||now());
  S.seen=true; save();
  if(away>=20*60000) lapseStart(away);
  document.body.classList.remove('pre');
  setTimeout(tutPaint,600);
  ambient();
  const el=$('intro'); el.style.opacity='0';
  setTimeout(()=>el.remove(),520);
  if(!S.plots.some(p=>p.sid) && S.coins>=STRAINS[0].seed) toast('לחץ על חלקה חומה כדי לשתול');
};
$('ireset').onclick=()=>{
  if(!confirm("להתחיל חווה חדשה לגמרי? כל ההתקדמות תימחק.")) return;
  hardReset();
};
/* cache the game itself so it opens and plays with no signal at all */
/* ?nosw keeps the worker out of the way while developing — otherwise the cached
   copy of game.js wins over the file you just edited */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !/nosw/.test(location.search)){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);
setInterval(save,15000);

boot();
window.__FARM={get S(){return S;}, fmt, STRAINS, plant, harvest, sell, addXP, refreshHUD,
  hour(h){ HOUR_OVERRIDE=h; },
  ensure(){ ensurePlots(); fitCam(); },
  bench(n){ n=n||60; const t0=performance.now();
    for(let i=0;i<n;i++){ T+=1/60; DT=1/60; resizeIfNeeded();
      ctx.setTransform(DPR,0,0,DPR,0,0); scene(1/60); }
    return +((performance.now()-t0)/n).toFixed(2); },
  icon(el){ appIcon(el); },
  char(el,k,tt){ const x=el.getContext("2d"); x.clearRect(0,0,el.width,el.height);
    x.save(); x.translate(el.width/2,el.height-14); fredi(x,k||3,tt===undefined?T:tt); x.restore(); },
  sim(n){ for(const p of S.plots){ if(p.sid) p.at-=n; } },
  /* draw n frames by hand — a hidden tab throttles rAF to nothing, so this is
     the only way to grab a picture of the yard from a headless check */
  pump(n){ for(let i=0;i<(n||1);i++) frame(last+16); },
  /* force the weather: 0 clears it, 1 opens the sky */
  rain(x){ if(x>0){ WX.mode='rain'; WX.t=0; WX.dur=x*60; } else { WX.mode='clear'; WX.next=300; } }};
})();
