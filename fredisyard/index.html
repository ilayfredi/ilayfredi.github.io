<style>
/* Self-hosted fonts. Google Fonts was the last network dependency: inside a
   packaged app, or on a phone with no signal, the first paint fell back to
   Arial. Same variable faces, Hebrew + Latin subsets only, 83KB total. */
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;
  src:url(f-fredoka-he.woff2) format('woff2');
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;
  src:url(f-fredoka-la.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;
  src:url(f-rubik-he.woff2) format('woff2');
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;
  src:url(f-rubik-la.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --sky1:#4FC3E8; --sky2:#8FDCF3; --sky3:#C8EFDF;
  --grass:#5FB53F; --grass2:#4A9A31;
  --soil:#8A5A38; --soil2:#6B4327;
  --wood:#C58C50; --wood-d:#8B5E33; --wood-x:#5E3A18;
  --cream:#FFF8EA; --cream2:#FFE9C2;
  --ink:#3A2712; --ink2:#7A6248;
  --gold:#FFC93C; --gold-d:#E09B18; --gold-x:#A9740A;
  --green:#5CC24A; --green-d:#3C9430; --green-x:#2A6B22;
  --blue:#49B9E8; --blue-d:#2B8CBE;
  --red:#F0594A; --purple:#9B6BD6;
  --disp:"Fredoka","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --ui:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Ground green, not sky blue. Any sliver the canvas cannot cover — the strip a
   mobile browser leaves when its bottom bar slides away, or the gesture area in
   the installed app — used to show up as a blue band under the game. */
html,body{height:100%;overflow:hidden;background:#57A33C;color:var(--ink);
  font-family:var(--ui);font-weight:600;-webkit-text-size-adjust:100%;overscroll-behavior:none}
@supports (height:100dvh){ html,body{height:100dvh} }
body{position:fixed;inset:0;width:100%;
  user-select:none;-webkit-user-select:none;touch-action:none;direction:rtl}
#cv{position:fixed;top:0;left:0;width:100%;height:100%;display:block;
  background:#57A33C;touch-action:none}
@supports (height:100dvh){ #cv{height:100dvh} }
.num{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums}

/* ============================================================ juicy button */
.j{position:relative;border:0;cursor:pointer;font-family:var(--disp);font-weight:600;
  color:#fff;overflow:hidden;transition:transform .09s ease, box-shadow .09s ease}
.j::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));
  border-radius:inherit;pointer-events:none}
.j:active{transform:translateY(4px)}
.j-green{background:linear-gradient(#8BE06A,#4FB63C 52%,#3F9A33);
  box-shadow:0 5px 0 var(--green-x),0 10px 20px rgba(0,0,0,.28)}
.j-green:active{box-shadow:0 1px 0 var(--green-x),0 4px 10px rgba(0,0,0,.25)}
.j-gold{background:linear-gradient(#FFE07A,#FFC42F 52%,#EDA612);color:#513404;
  box-shadow:0 5px 0 var(--gold-x),0 10px 20px rgba(0,0,0,.28)}
.j-gold:active{box-shadow:0 1px 0 var(--gold-x),0 4px 10px rgba(0,0,0,.25)}
.j-blue{background:linear-gradient(#7FD6F5,#3FAEE0 52%,#2C90C2);
  box-shadow:0 5px 0 #1E6E97,0 10px 20px rgba(0,0,0,.28)}
.j-blue:active{box-shadow:0 1px 0 #1E6E97,0 4px 10px rgba(0,0,0,.25)}
.j-cream{background:linear-gradient(#FFFDF6,#FFEBC8 55%,#F6DCAE);color:var(--ink);
  box-shadow:0 5px 0 #B8905C,0 10px 20px rgba(0,0,0,.22)}
.j-cream:active{box-shadow:0 1px 0 #B8905C,0 4px 10px rgba(0,0,0,.2)}
.j[disabled]{filter:grayscale(.65) brightness(.92);pointer-events:none;opacity:.8}
.j:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shine{position:absolute;top:-60%;bottom:-60%;width:26%;left:-40%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-18deg);animation:sweep 3.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes sweep{0%,62%{left:-40%}100%{left:130%}}

/* ============================================================ hud */
.hud{position:fixed;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
#topbar{top:0;left:0;right:0;position:fixed;display:flex;justify-content:space-between;
  align-items:flex-start;padding:calc(8px + env(safe-area-inset-top)) 11px 0 11px;gap:10px}
/* the clock is centred on the screen, not wedged between two plates of
   different widths, so it reads as the game's own clock */
.tpill{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(9px + env(safe-area-inset-top))}

.plate{background:linear-gradient(#FFFDF6,#FFE7BE);border:3px solid var(--wood-x);
  border-radius:999px;display:flex;align-items:center;gap:9px;
  box-shadow:0 4px 0 rgba(94,58,24,.55),0 8px 18px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.85)}

.coin{padding:4px 15px 4px 5px}
.coin .ico{width:31px;height:31px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#FFF0A8,var(--gold) 52%,var(--gold-d));
  border:2.5px solid var(--gold-x);color:#7A5104;font-family:var(--disp);font-weight:600;font-size:15px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.coin b{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.2px}

.tpill{padding:4px 12px;gap:6px;z-index:2}
.tpill span{font-size:15px;line-height:1}
.tpill b{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);
  font-variant-numeric:tabular-nums}
/* goals, stats and settings */
.gsec{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);
  margin:14px 2px 9px;display:flex;align-items:center;gap:8px}
.gsec::after{content:"";flex:1;height:3px;border-radius:9px;background:#E7D5B4}
.goal{display:flex;align-items:center;gap:10px;background:linear-gradient(#FFFFFF,#FFF7E9);
  border:3px solid var(--wood-d);border-radius:16px;padding:9px 11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(139,94,51,.4)}
.goal.done{background:linear-gradient(#F2FBEC,#E2F4D6);border-color:#5E9A46}
.goal .gi{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  background:#FFEFC6;border:2.5px solid #D9B36A;font-size:18px}
.goal .gt{flex:1;min-width:0}
.goal .gt .nm{font-family:var(--disp);font-weight:600;font-size:13.5px}
.goal .gt .meta{font-size:11px;color:var(--ink2);font-weight:700}
.gbar{height:8px;background:#E3D2B4;border-radius:99px;overflow:hidden;margin-top:5px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.22)}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A8F07E,#4CC63F)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.stat{background:linear-gradient(#FFFFFF,#FFF7E9);border:3px solid var(--wood-d);border-radius:15px;
  padding:10px;text-align:center;box-shadow:0 4px 0 rgba(139,94,51,.35)}
.stat b{display:block;font-family:var(--disp);font-weight:600;font-size:19px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink2);font-weight:700}
.setrow{display:flex;align-items:center;gap:10px;background:linear-gradient(#FFFFFF,#FFF7E9);
  border:3px solid var(--wood-d);border-radius:16px;padding:11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(139,94,51,.4)}
.setrow .lab{flex:1;font-family:var(--disp);font-weight:600;font-size:14px}
.tgl{width:58px;height:32px;border-radius:99px;border:3px solid var(--wood-x);cursor:pointer;
  background:#D6C0A0;position:relative;transition:background .18s;flex:0 0 auto}
.tgl i{position:absolute;top:1px;right:1px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(#FFFDF6,#F0DCB8);box-shadow:0 2px 4px rgba(0,0,0,.3);
  transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.tgl.on{background:linear-gradient(#7BD25E,#48A83A)}
.tgl.on i{transform:translateX(-26px)}
.daily{background:linear-gradient(#FFF6D6,#FFE49B);border:3px solid var(--gold-x);border-radius:18px;
  padding:13px;margin-bottom:12px;text-align:center;box-shadow:0 5px 0 rgba(169,116,10,.5)}
.daily .t{font-family:var(--disp);font-weight:600;font-size:16px;color:#6B4406}
.daily .s{font-size:12px;font-weight:700;color:#8A6218;margin:4px 0 10px}

#lvlwrap{padding:4px 6px 4px 15px}
#lvlbadge{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 26%,#8CF0D6,#35C9AE 52%,#149C84);
  border:3px solid #0C6E5C;color:#fff;font-family:var(--disp);font-weight:600;font-size:19px;
  text-shadow:0 2px 0 rgba(0,0,0,.32);line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.xpcol{display:flex;flex-direction:column;gap:4px;min-width:106px}
.xplab{font-size:10.5px;color:var(--ink2);font-weight:700}
.xpbar{height:10px;background:#D6BE97;border-radius:999px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.28)}
.xpbar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#A8F07E,#4CC63F);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  transition:width .4s cubic-bezier(.3,1.4,.5,1)}

/* dock */
#dock{bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;
  padding:0 8px calc(4px + env(safe-area-inset-bottom)) 8px}
.dbtn{position:relative;width:63px;height:56px;border-radius:15px;
  background:linear-gradient(#FFFDF6,#FFE2B2);border:3px solid var(--wood-x);
  box-shadow:0 5px 0 rgba(94,58,24,.6),0 9px 18px rgba(0,0,0,.26),inset 0 2px 0 rgba(255,255,255,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--disp);font-weight:600;font-size:9.5px;color:var(--ink);cursor:pointer;
  transition:transform .09s ease,box-shadow .09s ease}
.dbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(94,58,24,.6),0 4px 9px rgba(0,0,0,.22)}
.dbtn svg{width:24px;height:24px;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
.dbtn .dot{position:absolute;top:-7px;left:-7px;min-width:23px;height:23px;padding:0 5px;
  border-radius:999px;background:linear-gradient(#FF7A6B,#E23F2E);border:2.5px solid #fff;color:#fff;
  font-family:var(--disp);font-weight:600;font-size:12px;display:none;align-items:center;
  justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.35);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:scale(1)}92%{transform:scale(1.22)}}
.dbtn.has .dot{display:flex}
.dbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}

#quick{position:fixed;z-index:10;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:8px;pointer-events:none;flex-wrap:wrap;padding:0 10px}
.qbtn{pointer-events:auto;border-radius:999px;padding:8px 17px;font-size:13px;
  display:none;align-items:center;gap:7px}
.qbtn.on{display:inline-flex}

/* ============================================================ sheets */
#veil{position:fixed;inset:0;z-index:20;background:rgba(28,16,6,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .24s}
#veil.on{opacity:1;pointer-events:auto}

.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translate(-50%,102%);
  width:min(580px,100%);max-height:87vh;display:flex;flex-direction:column;
  background:linear-gradient(#FFFCF2,#FFEFD6);border:4px solid var(--wood-x);border-bottom:0;
  border-radius:28px 28px 0 0;box-shadow:0 -10px 46px rgba(0,0,0,.45);
  transition:transform .32s cubic-bezier(.25,1.2,.4,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px 10px;
  position:relative}
.sheet header::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:52px;height:5px;border-radius:99px;background:#D9BE94}
.sheet header h2{font-family:var(--disp);font-weight:600;font-size:22px;color:var(--ink);
  flex:1;margin-top:8px}
.sheet header .sub{font-size:12px;color:var(--ink2);font-weight:700;margin-top:10px}
.xbtn{width:38px;height:38px;flex:0 0 auto;border-radius:50%;margin-top:6px;
  font-size:17px;line-height:1;display:grid;place-items:center}
.sheet .body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:4px 14px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}
/* sheet contents deal themselves in rather than appearing all at once */
@keyframes dealin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.card,.row,.order,.goal,.setrow,.stat,.daily{animation:dealin .34s cubic-bezier(.2,1.35,.4,1) both}
.card canvas{transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
.card:active canvas{transform:scale(1.14) rotate(-4deg)}

.card{position:relative;background:linear-gradient(#FFFFFF,#FFF6E6);border:3px solid var(--wood-d);
  border-radius:19px;padding:10px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 4px 0 rgba(139,94,51,.45),inset 0 2px 0 rgba(255,255,255,.9);
  cursor:pointer;transition:transform .09s}
.card:active{transform:translateY(3px)}
.card.locked{opacity:.6;cursor:not-allowed;background:#F2EADC}
.card.locked:active{transform:none}
.card .top{display:flex;align-items:center;gap:9px}
.card canvas{width:56px;height:56px;flex:0 0 auto}
.card .nm{font-family:var(--disp);font-weight:600;font-size:14px;line-height:1.2;color:var(--ink)}
.card .meta{font-size:11px;color:var(--ink2);font-weight:700;display:flex;gap:8px;flex-wrap:wrap}
.tagrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tg{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F0E3CB;color:var(--ink2)}
.tg.gold{background:#FFEAAF;color:#7A5104}
.tg.green{background:#D3F3C6;color:#2C6B23}
.tg.blue{background:#CFEBFA;color:#175E80}
.tg.purple{background:#E8D8F8;color:#5B3592}
.buy{margin-top:auto;border-radius:13px;padding:10px;font-size:13.5px;display:flex;
  align-items:center;justify-content:center;gap:5px}
.lockbadge{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;
  background:rgba(58,39,18,.6);color:#fff;font-family:var(--disp);font-weight:600;font-size:13px;
  text-align:center;padding:8px;line-height:1.5}

.row{display:flex;align-items:center;gap:10px;background:linear-gradient(#FFFFFF,#FFF7E9);
  border:3px solid var(--wood-d);border-radius:17px;padding:9px 11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(139,94,51,.4)}
.row canvas{width:48px;height:48px;flex:0 0 auto}
.row .info{flex:1;min-width:0}
.row .info .nm{font-family:var(--disp);font-weight:600;font-size:14.5px}
.row .info .meta{font-size:11px;color:var(--ink2);font-weight:700}
.row .qty{font-family:var(--disp);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;
  color:var(--ink);background:#F5E9D2;border-radius:10px;padding:4px 10px;min-width:46px;text-align:center}
.mini{border-radius:12px;padding:9px 14px;font-size:13px;white-space:nowrap}

.order{background:linear-gradient(#FFFFFF,#FFF7E9);border:3px solid var(--wood-d);border-radius:19px;
  padding:11px;margin-bottom:11px;box-shadow:0 4px 0 rgba(139,94,51,.4)}
.order .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.order .who{font-family:var(--disp);font-weight:600;font-size:14.5px;flex:1}
.order .items{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.oit{display:flex;align-items:center;gap:6px;background:#F7EFDF;border-radius:12px;padding:5px 9px}
.oit canvas{width:36px;height:36px}
.oit .q{font-family:var(--disp);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.oit .q.ok{color:#2F8B2A}
.oit .q.no{color:#C0392B}
.order .ft{display:flex;align-items:center;gap:8px}
.order .rew{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.empty{text-align:center;color:var(--ink2);font-weight:700;font-size:14px;padding:36px 16px;line-height:1.8}

/* ============================================================ toasts / fx */
#toasts{position:fixed;z-index:30;left:0;right:0;top:calc(78px + env(safe-area-inset-top));
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.toast{background:linear-gradient(rgba(48,30,14,.95),rgba(32,19,8,.95));color:#FFF3DD;
  font-weight:700;font-size:14px;padding:10px 19px;border-radius:999px;
  border:2px solid rgba(255,255,255,.18);box-shadow:0 7px 20px rgba(0,0,0,.4);
  animation:tin .32s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.88)}}

/* the upgrade moment: a banner that lands, holds, and lifts away again */
#cele{position:fixed;z-index:42;left:50%;top:26%;transform:translate(-50%,-50%) scale(.7);
  opacity:0;pointer-events:none;text-align:center;padding:18px 30px 20px;border-radius:26px;
  min-width:min(78vw,340px);
  box-shadow:0 18px 46px rgba(0,0,0,.42), inset 0 2px 0 rgba(255,255,255,.5);
  transition:opacity .26s ease, transform .42s cubic-bezier(.16,1.5,.4,1)}
#cele.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cele.gold{background:linear-gradient(#FFEDBC,#F3C458);border:4px solid #C08A18;color:#5B3D02}
#cele.green{background:linear-gradient(#DFF3C6,#9FD06A);border:4px solid #4E7C2A;color:#274710}
#cele .ce-i{font-size:40px;line-height:1;margin-bottom:6px;
  animation:cepop .7s cubic-bezier(.2,1.8,.4,1)}

<script>
/* ============================================================== native.js
   The bridge between the web game and the packaged iOS/Android app.

   Deliberately written to need ZERO changes inside game.js. It loads first,
   patches a few globals, and then gets out of the way. On the web (GitHub
   Pages, the artifact, a plain browser) every branch here is skipped, so the
   published site behaves exactly as before.

   What it does under Capacitor:
     1. Mirrors the save into native Preferences. WKWebView localStorage is
        evictable — iOS can and does clear it under storage pressure, which
        would wipe a farm someone tended for months. Preferences is real
        native storage that only goes away when the app is deleted.
     2. Haptics on every juicy button, so taps feel like a native game.
     3. Routes the WhatsApp share link into the system share sheet.
     4. Hides the native splash and paints the status bar to match the sky.
     5. Exposes window.NATIVE.harvestReminder(ms) for a local notification
        when the slowest plot finishes. game.js does not call it yet — see
        README-ios.md for the one line that turns it on.
   ------------------------------------------------------------------------ */
(function(){
  'use strict';

  var KEY = 'fredis_farm_v1';          /* must match game.js */
  var CAP = window.Capacitor;
  var NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());

  function plugin(n){
    return (CAP && CAP.Plugins && CAP.Plugins[n]) || null;
  }

  /* window.NATIVE exists on the web too, with every method a safe no-op, so
     game.js can call it unconditionally once it is wired up. */
  var api = window.NATIVE = {
    on: NATIVE,
    platform: NATIVE ? CAP.getPlatform() : 'web',
    tap: function(){}, thud: function(){}, cheer: function(){},
    share: function(url){ return webShare(url); },
    harvestReminder: function(){}, clearReminders: function(){}
  };

  /* ------------------------------------------------------------- web share */
  function webShare(url){
    if(navigator.share) return navigator.share({title:'החצר של פרדי', url:url}).catch(function(){});
    window.open('https://wa.me/?text='+encodeURIComponent(url), '_blank');
    return Promise.resolve();
  }

  if(!NATIVE) return;                  /* everything past here is app-only */

  /* --------------------------------------------------- 1. durable savegame */
  var Prefs = plugin('Preferences');
  if(Prefs){
    /* Mirror every write. Throttled: the game autosaves often and a native
       round trip per write would be wasteful. */
    var pending = null, timer = 0;
    var rawSet = Storage.prototype.setItem;
    Storage.prototype.setItem = function(k, v){
      rawSet.call(this, k, v);
      if(this === window.localStorage && k === KEY){
        pending = v;
        if(!timer) timer = setTimeout(flush, 1500);
      }
    };
    function flush(){
      timer = 0;
      if(pending == null) return;
      var v = pending; pending = null;
      Prefs.set({key:KEY, value:v}).catch(function(){});
    }
    /* Never lose the last few seconds when the app is backgrounded. */
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'hidden'){ clearTimeout(timer); flush(); }
    });

    var rawRemove = Storage.prototype.removeItem;
    Storage.prototype.removeItem = function(k){
      rawRemove.call(this, k);
      if(this === window.localStorage && k === KEY){
        pending = null; clearTimeout(timer); timer = 0;
        Prefs.remove({key:KEY}).catch(function(){});
      }
    };

    /* Recovery. If localStorage came up empty but native storage still holds a
       farm, iOS evicted the web storage — put it back and reload once. The
       guard flag keeps this from ever becoming a boot loop. */
    if(!localStorage.getItem(KEY) && !sessionStorage.getItem('nat_restored')){
      Prefs.get({key:KEY}).then(function(r){
        if(r && r.value){
          sessionStorage.setItem('nat_restored','1');
          rawSet.call(localStorage, KEY, r.value);
          location.reload();
        }
      }).catch(function(){});
    }
  }

  /* ---------------------------------------------------------- 2. haptics */
  var Haptics = plugin('Haptics');
  if(Haptics){
    api.tap   = function(){ Haptics.impact({style:'LIGHT'}).catch(function(){}); };
    api.thud  = function(){ Haptics.impact({style:'MEDIUM'}).catch(function(){}); };
    api.cheer = function(){ Haptics.notification({type:'SUCCESS'}).catch(function(){}); };

    /* Every button in the game carries .j — one listener covers the lot, and
       new buttons get it for free. */
    document.addEventListener('pointerdown', function(e){
      var b = e.target && e.target.closest && e.target.closest('.j');
      if(b && !b.disabled) api.tap();
    }, {passive:true, capture:true});
  }

  /* ----------------------------------------------------- 3. system share */
  var Share = plugin('Share');
  if(Share){
    api.share = function(url){
      return Share.share({title:'החצר של פרדי', text:'בוא לגדל איתי חצר', url:url})
                  .catch(function(){});
    };
  }
  /* game.js renders the share as a plain wa.me link. Catch the click before
     the WebView tries to navigate away and hand it to the share sheet. */
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('a[href*="wa.me"]');
    if(!a) return;
    e.preventDefault();
    var m = /text=([^&]+)/.exec(a.getAttribute('href')||'');
    api.share(m ? decodeURIComponent(m[1]) : 'https://ilayfredi.github.io/fredisyard/');
  }, true);

  /* ------------------------------------------- 4. status bar and splash */
  var Bar = plugin('StatusBar');
  if(Bar){
    Bar.setOverlaysWebView({overlay:true}).catch(function(){});
    Bar.setStyle({style:'LIGHT'}).catch(function(){});   /* light text on sky */
  }
  var Splash = plugin('SplashScreen');
  if(Splash){
    /* Wait for the first real frame, not just DOMContentLoaded, or the game
       shows a blank green field for a beat. */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        setTimeout(function(){ Splash.hide().catch(function(){}); }, 120);
      });
    });
  }

  /* -------------------------------------------- 5. harvest notification */
  var Notes = plugin('LocalNotifications');
  if(Notes){
    var ID = 4201;
    api.clearReminders = function(){
      return Notes.cancel({notifications:[{id:ID}]}).catch(function(){});
    };
    /* whenMs = absolute epoch time the last plot finishes. Called again on
       every plant/harvest, so the reminder always tracks the real farm. */
    api.harvestReminder = function(whenMs){
      if(!whenMs || whenMs - Date.now() < 60000) return api.clearReminders();
      return Notes.checkPermissions().then(function(p){
        if(p.display !== 'granted') return Notes.requestPermissions();
        return p;
      }).then(function(p){
        if(p.display !== 'granted') return;
        return Notes.cancel({notifications:[{id:ID}]}).catch(function(){}).then(function(){
          return Notes.schedule({notifications:[{
            id: ID,
            title: 'החצר של פרדי',
            body: 'התפרחות בשלות. זמן לקצור 🌿',
            schedule: {at: new Date(whenMs)},
            smallIcon: 'ic_stat_icon'
          }]});
        });
      }).catch(function(){});
    };
  }
})();
</script>

function hash(n){ n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15); return (n>>>0)/4294967296; }

const UNITS=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
function fmt(n){
  n=Math.floor(n);
  if(!isFinite(n)) return '∞';
  if(n<1000) return String(n);
  let i=0, v=n;
  while(v>=1000 && i<UNITS.length-1){ v/=1000; i++; }
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+UNITS[i];
}
function clock(ms){
  if(ms<=0) return 'מוכן';
  const s=Math.ceil(ms/1000);
  if(s<60) return s+'ש';
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return m+':'+String(r).padStart(2,'0');
  const h=Math.floor(m/60);
  return h+'ש '+(m%60)+'ד';
}
function clockShort(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  if(s<60) return String(s);
  const m=Math.floor(s/60);
  if(m<60) return m+':'+String(s%60).padStart(2,'0');
  return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
}

(function growCatalogue(){

  const hue=(h,s,l)=>{
    const f=n=>{ const k=(n+h/30)%12, a=s*Math.min(l,1-l);
      const v=l-a*Math.max(-1,Math.min(Math.min(k-3,9-k),1));
      return Math.round(v*255).toString(16).padStart(2,'0'); };
    return '#'+f(0)+f(8)+f(4);
  };
  let last=STRAINS[STRAINS.length-1];
  for(let n=15;n<60;n++){
    const i=n-15, gen=1+Math.floor(i/A.length);
    const h=(i*47)%360;
    last={
      id:'x'+n,
      nm:A[i%A.length]+' '+B[(i*7+3)%B.length]+(gen>1?' '+gen:''),
      lvl:last.lvl+11+Math.floor(i/6),
      seed:Math.round(last.seed*2.63),

      bud:hue((h+40)%360,0.62,0.58), hair:hue((h+180)%360,0.75,0.62)
    };
    STRAINS.push(last);
  }
})();

(function endlessGoals(){

  ];
  for(const r of rungs){
    let n=r.from;
    for(let k=0;k<14;k++){
      const need=(r.p==='l'||r.p==='y')?Math.round(n):Math.round(n/10)*10;

        g:r.g, n:need, c:Math.max(500,Math.round(r.c(need))), x:Math.round(r.x(need))});
      n*=r.mul;
    }
  }
})();

/* ---------------------------------------------------------------- save */
const KEY='fredis_farm_v1';
const BUILD='23';                    /* bump on every publish, shown in settings */

/* Sharing. Inside the artifact viewer the page runs in a sandboxed frame, so
   location.href is not the address anyone can open — fall back to the published
   URL when we are not already sitting on a claude.ai page. */
const PUBLISHED='https://ilayfredi.github.io/fredisyard/';
function shareURL(){
  try{
    const h=String(location.href);
    if(/^https?:/.test(h)&&!/localhost/.test(h)) return h;
  }catch(e){}

}
/* just the link — WhatsApp renders its own preview card from the og: tags,
   and any extra text only gets in the way of it */

}

/* Backup codes. localStorage lives in one browser on one device and phones do
   clear it, so the save can also be carried out as text and pasted back in. */
function exportSave(){
  const o=JSON.parse(JSON.stringify(S));
  o.plots=S.plots.filter(p=>p.sid).map(p=>[p.i,p.sid,p.at,p.dur,p.wet?1:0]);
  o._c=1;
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function importSave(str){
  const o=JSON.parse(decodeURIComponent(escape(atob(String(str).replace(/\s+/g,'')))));
  if(!o||typeof o.coins!=='number'||!Array.isArray(o.plots)) throw new Error('bad');
  if(o._c){
    const full=[];
    for(const row of o.plots){
      if(!Array.isArray(row)) continue;
      const [i,sid,at,dur,wet]=row;
      full[i]={i,gx:0,gy:0,sid,at,dur,wet:!!wet};
    }
    o.plots=full; delete o._c;
  }
  RESETTING=true;                      /* stop the autosave clobbering the import */
  localStorage.setItem(KEY,JSON.stringify(o));
  location.reload();
}

const goalDone=g=>(S.goals&&S.goals[g.id])?true:false;
const goalReady=g=>!goalDone(g)&&g.g()>=g.n;
function claimGoal(g){
  if(!goalReady(g)) return;

  S.coins+=g.c; S.earned+=g.c;

    if(!S.plots[i]) S.plots[i]={i,gx:0,gy:0,sid:null,at:0,dur:0,wet:false};
    S.plots[i].i=i;
    S.plots[i].gx=PLOT_SPOTS[i][0];
    S.plots[i].gy=PLOT_SPOTS[i][1];

  if(S.plots.length>PLOT_SPOTS.length) S.plots.length=PLOT_SPOTS.length;

/* Set while wiping a save. Without it the pagehide handler fires during the
   reload and writes the old state straight back over the deletion. */

function save(){
  if(RESETTING) return;

function hardReset(){
  RESETTING=true;

}

  }catch(e){}

}

/* ---------------------------------------------------------------- economy */
const speedMul = ()=> 1 + 0.09*S.ups.lamp + 0.05*Math.max(0,S.ups.sprk-1);
const yieldMul = ()=> 1 + 0.12*S.ups.fert;
const priceMul = ()=> (1 + 0.08*S.ups.mrkt) * (1 + 0.30*S.prestige) * (1 + 0.07*houseLv());
const critChance = ()=> Math.min(0.85, 0.06*S.ups.ghs);
const upCost = u => Math.floor(u.base*Math.pow(u.mul, S.ups[u.id]));
const plotCost = ()=> Math.floor(150*Math.pow(1.42, Math.max(0,S.owned-6)));

/* ---------------------------------------------------------------- audio */
const A={ctx:null,on:true};
function actx(){
  if(A.ctx) return A.ctx;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  A.ctx=new C(); return A.ctx;
}
function blip(f,d,type,g0,f2){
  if(!A.on) return; const c=actx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  const t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(g0||0.09,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);
}
/* A quiet outdoor bed: a little wind, the odd bird. Synthesised, so it costs
   nothing to download and stops dead when sound is switched off. */
let AMB=null;
function ambient(){
  if(!A.on||AMB) return;
  const c=actx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  const g=c.createGain(); g.gain.value=0.0; g.connect(c.destination);
  /* wind: filtered noise, slowly breathing */
  const len=c.sampleRate*3, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=340; lp.Q.value=0.5;
  const wg=c.createGain(); wg.gain.value=0.05;
  src.connect(lp); lp.connect(wg); wg.connect(g); src.start();
  const lfo=c.createOscillator(), lg=c.createGain();
  lfo.frequency.value=0.06; lg.gain.value=0.03;
  lfo.connect(lg); lg.connect(wg.gain); lfo.start();
  g.gain.linearRampToValueAtTime(1,c.currentTime+2.5);
  AMB={g,src,lfo,birds:null};
  const chirp=()=>{
    if(!AMB||!A.on) return;
    if(SUN.night<0.5){
      const t=c.currentTime, n=2+((Math.random()*3)|0);
      for(let i=0;i<n;i++){
        const o=c.createOscillator(), og=c.createGain();
        o.type='sine';
        const f=1700+Math.random()*1400;
        o.frequency.setValueAtTime(f,t+i*0.09);
        o.frequency.exponentialRampToValueAtTime(f*(1.1+Math.random()*0.4),t+i*0.09+0.06);
        og.gain.setValueAtTime(0.0001,t+i*0.09);
        og.gain.exponentialRampToValueAtTime(0.02,t+i*0.09+0.012);
        og.gain.exponentialRampToValueAtTime(0.0001,t+i*0.09+0.09);
        o.connect(og); og.connect(g); o.start(t+i*0.09); o.stop(t+i*0.09+0.14);
      }
    }
    AMB.birds=setTimeout(chirp, 6000+Math.random()*14000);
  };
  AMB.birds=setTimeout(chirp,2500);
}
function ambientStop(){
  if(!AMB) return;
  try{ AMB.src.stop(); AMB.lfo.stop(); clearTimeout(AMB.birds); }catch(e){}
  AMB=null;
}

const yardLv=()=>Math.min(S.yardLvl||0,YARD.length-1);
const houseLv=()=>Math.min(S.houseLvl||0,HOUSE_LV.length-1);
const yardR=()=>YARD[yardLv()].r;
function yardB(){ const r=yardR(); return {x0:CX-r,x1:CX+r,y0:CY-r,y1:CY+r}; }
/* The house stands BESIDE the yard, off the left fence, so you see the home and
   the farm side by side instead of the house hiding behind the crops. Iso x is
   (gx-gy): stepping out along -gx slides it up-left on screen, and sitting it
   near the front edge (gy close to y1) keeps it at about the height of the yard
   rather than away up by the horizon. Clearance grows with the building so a
   palace still clears the fence by the same margin a shack does. */
function houseAt(){
  const L=HOUSE_LV[houseLv()], b=yardB();
  return {gx:b.x0-(L.A*0.5+1.8), gy:CY-yardR()*0.10, A:L.A, B:L.B, L};
}
/* props ride the fence, so they stay put as the yard grows */
function propSpots(){
  const b=yardB();
  return {
    tower:[b.x0-1.5, CY-1.2],
    stall:[b.x1+1.5, CY+0.8],
    rack :[b.x1+1.3, b.y0-0.6],
    fredi:[b.x1+2.1, CY+1.5]
  };
}

let PLOT_SPOTS=[];
function rebuildSpots(){
  const b=yardB(), a=[];
  /* leave the border ring free — that is where decorations live */
  for(let gx=Math.ceil(b.x0+0.9);gx<=Math.floor(b.x1-0.9);gx++)
    for(let gy=Math.ceil(b.y0+0.9);gy<=Math.floor(b.y1-0.9);gy++) a.push([gx,gy]);
  a.sort((p,q)=>{
    const dp=(p[0]-CX)*(p[0]-CX)+(p[1]-CY)*(p[1]-CY);
    const dq=(q[0]-CX)*(q[0]-CX)+(q[1]-CY)*(q[1]-CY);
    return dp-dq || p[0]-q[0] || p[1]-q[1];   /* deterministic, so growing only appends */
  });
  PLOT_SPOTS=a.slice(0,180);
}
/* the ring just inside the fence, for benches, lamps and flowerbeds */
function decorSlots(){
  const b=yardB(), a=[];
  const x0=Math.ceil(b.x0+0.2), x1=Math.floor(b.x1-0.2);
  const y0=Math.ceil(b.y0+0.2), y1=Math.floor(b.y1-0.2);
  for(let gx=x0;gx<=x1;gx++){ a.push([gx,y0]); a.push([gx,y1]); }
  for(let gy=y0+1;gy<=y1-1;gy++){ a.push([x0,gy]); a.push([x1,gy]); }
  const h=houseAt();
  return a.filter(p=>Math.abs(p[0]-h.gx)>1.2||Math.abs(p[1]-h.gy)>1.6)
          .sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])||p[0]-q[0]);
}

/* one travelling gust so the whole field ripples together instead of each
   plant jittering on its own clock */
function windAt(gx,gy){
  const gust=(0.55+0.45*Math.sin(T*0.37)*Math.sin(T*0.19+1.1))*(1+WX.i*1.5);
  const ph=T*(1.25+WX.i*0.9)-(gx+gy)*0.30;
  return (Math.sin(ph)*0.7+Math.sin(ph*1.9+0.7)*0.3)*gust;
}

/* ---------------------------------------------------------------- canvas */
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=0, VH=0, DPR=1;
const cam={x:0, y:0, z:1, tz:1};
/* Render scale adapts to the device. A full farm is a lot of fill, and phones
   report a device pixel ratio of 3, which would mean nine times the pixels of a
   1x buffer. Drop it when frames get long, raise it again when there is room. */
let RES=1, RES_MAX=2;
function resize(){
  RES_MAX=Math.min(2, window.devicePixelRatio||1);
  if(RES>RES_MAX) RES=RES_MAX;
  DPR=RES;
  VW=cv.clientWidth||window.innerWidth; VH=cv.clientHeight||window.innerHeight;
  cv.width=Math.max(1,Math.round(VW*DPR)); cv.height=Math.max(1,Math.round(VH*DPR));
}
let fAcc=0, fN=0;
function autoRes(dt){
  fAcc+=dt; fN++;
  if(fAcc<1.2) return;
  const ms=(fAcc/fN)*1000; fAcc=0; fN=0;
  const floor=Math.min(1, RES_MAX);
  if(ms>26 && RES>floor){ RES=Math.max(floor,RES-0.2); resizeNow(); }
  else if(ms<15 && RES<RES_MAX){ RES=Math.min(RES_MAX,RES+0.2); resizeNow(); }
}
function resizeNow(){ lastW=-1; }
addEventListener('resize',resize);

/* Frame the whole property — including how tall the house has grown — so the
   roof never runs off the top of the screen at the bigger upgrades. */
/* The bar at the top and the dock at the bottom cover real screen. Frame the
   property inside what is actually left, so nothing important sits under them. */
const CHROME_TOP=58, CHROME_BOT=84;
function fitCam(){
  const b=yardB(), h=houseAt();
  const houseH=46*h.L.fl+h.L.roofH+46;
  /* the house now sits off to one side, so it sets the left edge of the frame
     as well as the top one */
  const top=Math.min(iso(b.x0,b.y0).y-60, iso(h.gx,h.gy).y-houseH);
  const bottom=(roadK()+2.4)*TH/2;   /* room for the pavement, the road and the traffic */
  const left=Math.min(iso(b.x0,b.y1).x-105, iso(h.gx-h.A*0.5,h.gy+h.B*0.5).x-45);
  const right=iso(b.x1,b.y0).x+165;
  const availH=Math.max(220, VH-CHROME_TOP-CHROME_BOT);
  const wNeed=Math.max(320,right-left), hNeed=Math.max(240,bottom-top);
  cam.tz=cam.z=clamp(Math.min(VW/wNeed, availH/hNeed)*0.97, 0.30, 1.45);
  cam.x=(left+right)/2;
  const midWorld=(top+bottom)/2;
  /* A wide property on a tall phone leaves vertical slack. Spend most of it on
     sky rather than on an empty apron of grass below the street, so sit the
     property low in the band instead of dead centre. */
  const slack=Math.max(0, availH-(bottom-top)*cam.tz);
  const midBand=CHROME_TOP+availH/2+slack*0.44;
  cam.y=midWorld+(VH*0.52-midBand)/cam.tz;
}
const w2s=(wx,wy)=>({x:(wx-cam.x)*cam.z+VW/2, y:(wy-cam.y)*cam.z+VH*0.52});
function s2w(sx,sy){ return {x:(sx-VW/2)/cam.z+cam.x, y:(sy-VH*0.52)/cam.z+cam.y}; }
function s2g(sx,sy){
  const w=s2w(sx,sy);
  return { gx:(w.x/(TW/2)+w.y/(TH/2))/2, gy:(w.y/(TH/2)-w.x/(TW/2))/2 };
}

/* ---------------------------------------------------------------- plant art */
function leaflet(c,L,W){
  const N=13;
  c.beginPath(); c.moveTo(0,0);
  for(let s=1;s<=N;s++){
    const t=s/N, w=W*Math.pow(Math.sin(Math.PI*Math.min(t,0.995)),0.6)*(1+0.24*Math.sin(t*13.5));
    c.lineTo(w,-L*t);
  }
  for(let s=N;s>=1;s--){
    const t=s/N, w=W*Math.pow(Math.sin(Math.PI*Math.min(t,0.995)),0.6)*(1+0.24*Math.sin(t*13.5));
    c.lineTo(-w,-L*t);
  }
  c.closePath();
}
function fan(c,L,st,flip){
  const ang=[-1.18,-0.8,-0.41,0,0.41,0.8,1.18], rel=[0.46,0.7,0.9,1,0.9,0.7,0.46];
  for(let i=0;i<7;i++){
    c.save(); c.rotate(ang[i]*(flip?-1:1));
    leaflet(c,L*rel[i],L*rel[i]*0.155);
    c.fillStyle = (i===3)?st.leaf : (i%2 ? st.leafD : st.leaf);
    c.fill();
    c.lineWidth=Math.max(0.8,L*0.014); c.strokeStyle='rgba(0,0,0,.16)'; c.stroke();
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-L*rel[i]*0.9);
    c.lineWidth=Math.max(0.6,L*0.012); c.strokeStyle='rgba(255,255,255,.22)'; c.stroke();
    c.restore();
  }
}
/* A proper flower: stacked calyx tiers into a teardrop cola, sugar leaves
   tucked behind, pistils threaded through, and trichome frost that thickens on
   the rarer strains. Drawn from the base upward, origin at the stem. */
function drawBud(c,R,st,detail){
  const idx=st.idx||0;
  const tiers=detail?5:3;
  const fat=0.92+(idx%3)*0.11;
  const frost=clamp(idx/13,0,1);

  c.save();
  c.strokeStyle=shade(st.leafD,-12); c.lineWidth=R*0.12; c.lineCap='round';
  c.beginPath(); c.moveTo(0,R*0.18); c.lineTo(0,-R*0.12); c.stroke();

  if(detail){                                     /* sugar leaves behind the cola */
    for(let i=0;i<7;i++){
      const u=i/7, side=i%2?1:-1;
      const L=R*(0.95-u*0.42);
      c.save();
      c.translate(side*R*0.16, -R*(0.10+u*1.05));
      c.rotate(side*(0.75+u*0.35));
      leaflet(c,L,L*0.155);
      c.fillStyle=i%2?st.leafD:st.leaf;
      c.fill();
      c.lineWidth=Math.max(0.5,R*0.018); c.strokeStyle='rgba(0,0,0,.16)'; c.stroke();
      c.restore();
    }
  }
  for(let ti=0;ti<tiers;ti++){
    const u=tiers>1?ti/(tiers-1):0;
    const y=-R*(0.12+u*1.22);
    const rad=R*fat*(0.50-0.32*u)+R*0.07;
    const n=Math.max(3,Math.round(5-u*2));
    for(let k=0;k<n;k++){
      const a=(k/n)*TAU+ti*0.75;
      const px=Math.cos(a)*rad, py=y+Math.sin(a)*rad*0.34;
      const s=R*(0.31-0.13*u);
      c.save(); c.translate(px,py); c.rotate(Math.cos(a)*0.34);
      c.beginPath(); c.ellipse(0,0,s*0.86,s,0,0,TAU);
      c.fillStyle=(k%2)?shade(st.bud,-12):st.bud; c.fill();
      c.globalAlpha=0.7;
      c.beginPath(); c.ellipse(-s*0.22,-s*0.28,s*0.33,s*0.40,0,0,TAU);
      c.fillStyle=shade(st.bud,18); c.fill();
      c.globalAlpha=1;
      c.restore();
    }
  }
  c.beginPath(); c.ellipse(0,-R*1.44,R*0.23,R*0.31,0,0,TAU);
  c.fillStyle=shade(st.bud,12); c.fill();

  c.strokeStyle=st.hair; c.lineWidth=Math.max(0.6,R*0.055); c.lineCap='round';
  c.globalAlpha=0.92;
  const hairs=detail?15:8;
  for(let i=0;i<hairs;i++){
    const u=hash(i*7+idx*13), side=i%2?1:-1;
    const y=-R*(0.16+u*1.24), x0=side*R*0.12;
    c.beginPath(); c.moveTo(x0,y);
    c.quadraticCurveTo(side*R*0.44,y-R*0.17,side*R*(0.28+u*0.36),y-R*(0.28+u*0.22));
    c.stroke();
  }
  c.globalAlpha=1;

  if(detail&&frost>0.04){
    const n=Math.round(9+frost*26);
    for(let i=0;i<n;i++){
      const u=hash(i*11+idx*7), v=hash(i*23+idx*3);
      const y=-R*(0.12+u*1.32), x=(v-0.5)*R*1.02*(1-u*0.45);
      c.globalAlpha=0.30+0.55*frost;
      c.fillStyle='#FFFFFF';
      c.beginPath(); c.arc(x,y,R*0.034*(0.6+v),0,TAU); c.fill();
    }
    c.globalAlpha=1;
  }
  c.restore();
}
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)+d*2.55,0,255)|0, g=clamp(((n>>8)&255)+d*2.55,0,255)|0, b=clamp((n&255)+d*2.55,0,255)|0;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* one plant drawn into an offscreen tile, cached per strain + growth bucket */
const SPR=new Map();
const SPRW=170, SPRH=240, BUCKETS=16;   /* tall enough for a ripe crown — 200 clipped the top leaves */
/* a mature plant should read as roughly one tile wide, not swallow its neighbours */
const PSCALE=0.58;
/* Sprites are baked at the resolution they will actually be shown at, keyed by a
   zoom step. A single fixed-size sprite was either blurry when zoomed in or
   mushy when zoomed out; this keeps plants crisp at any distance. */
const zStep=()=>clamp(Math.round(cam.z*4),1,7);
function sprite(st,bk,zq){
  zq=zq||zStep();
  const key=st.id+'#'+bk+'#'+zq;
  let s=SPR.get(key);
  if(s) return s;
  if(SPR.size>150) SPR.clear();
  const scale=clamp((zq/4)*PSCALE*DPR*1.15, 0.34, 2.4);
  const c=document.createElement('canvas');
  c.width=Math.max(8,Math.round(SPRW*scale));
  c.height=Math.max(8,Math.round(SPRH*scale));
  const x=c.getContext('2d');
  x.scale(scale,scale); x.translate(SPRW/2,SPRH-14);
  drawPlant(x,bk/(BUCKETS-1),st);
  SPR.set(key,c);
  return c;
}
/* g: 0 seed .. 1 ripe. Origin at soil level, plant grows upward. */
function drawPlant(c,g,st){
  const G=clamp(g,0,1);
  if(G<0.001){ return; }
  if(G<0.12){                                  /* sprout */
    const k=G/0.12, h=10+16*k;
    c.strokeStyle=st.leafD; c.lineWidth=2.6; c.lineCap='round';
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-h); c.stroke();
    for(const s of [-1,1]){
      c.save(); c.translate(0,-h); c.rotate(s*0.85);
      c.beginPath(); c.ellipse(0,-6*k-3,4.5+5*k,7+6*k,0,0,TAU);
      c.fillStyle=st.leaf; c.fill();
      c.lineWidth=1; c.strokeStyle='rgba(0,0,0,.18)'; c.stroke();
      c.restore();
    }
    return;
  }
  const grow=(G-0.12)/0.88;
  const H=34+108*Math.pow(grow,0.72);              /* stalk height */
  const nodes=Math.min(5,2+Math.floor(grow*4));
  const flow=clamp((G-0.58)/0.42,0,1);

  c.lineCap='round';
  c.strokeStyle=shade(st.leafD,-6); c.lineWidth=Math.max(2.4,H*0.045);
  c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(2,-H*0.5,0,-H); c.stroke();

  for(let n=0;n<nodes;n++){
    const t=(n+1)/(nodes+0.35);
    const y=-H*t*0.94;
    const size=(34+46*grow)*(1-t*0.42);
    const lean=0.30+0.16*Math.sin(n*2.1);
    for(const s of [-1,1]){
      c.save(); c.translate(s*H*0.035,y); c.rotate(s*lean+ (s<0?-0.06:0.06));
      c.scale(0.94,1);
      fan(c,size,st,s<0);
      c.restore();
    }
  }
  /* crown */
  c.save(); c.translate(0,-H); c.scale(0.9,0.9);
  fan(c,(30+34*grow),st,false);
  c.restore();

  if(flow>0.02){
    const br=(10+20*flow);
    c.save(); c.translate(0,-H+br*0.5); drawBud(c,br,st,true); c.restore();
    for(let n=0;n<nodes;n++){
      if(n%2) continue;
      const t=(n+1)/(nodes+0.35), y=-H*t*0.94;
      for(const s of [-1,1]){
        c.save(); c.translate(s*(13+16*flow),y-4); drawBud(c,br*0.5,st,flow>0.55); c.restore();
      }
    }
  }
}

/* small plant portrait for UI cards */
function portrait(el,st,g){
  const c=el.getContext('2d');
  const W=el.width=el.clientWidth*2||92, H=el.height=el.clientHeight*2||92;
  c.clearRect(0,0,W,H);
  c.save(); c.translate(W/2,H*0.96);
  const k=(H*0.92)/215;   /* the whole plant, crown included, has to fit the card */
  c.scale(k,k);
  drawPlant(c,g===undefined?1:g,st);
  c.restore();
}

/* The home-screen icon, drawn with the game's own leaf so it matches the art.
   Square, high contrast, readable down to about 40 pixels. */
function appIcon(el){
  const S=el.width, c=el.getContext('2d');
  const u=S/512;
  c.clearRect(0,0,S,S);
  /* deep ground so the bright leaf reads at home-screen size */
  const g=c.createLinearGradient(0,0,0,S);
  g.addColorStop(0,'#2C6E4A'); g.addColorStop(0.5,'#1D5636'); g.addColorStop(1,'#123B26');
  c.fillStyle=g; c.fillRect(0,0,S,S);
  const sg=c.createRadialGradient(S*0.76,S*0.18,4,S*0.76,S*0.18,S*0.55);
  sg.addColorStop(0,'rgba(255,238,150,.40)'); sg.addColorStop(1,'rgba(255,238,150,0)');
  c.fillStyle=sg; c.fillRect(0,0,S,S);
  c.fillStyle='rgba(8,32,18,.45)';
  c.beginPath(); c.moveTo(0,S);
  c.quadraticCurveTo(S*0.3,S*0.72,S*0.62,S*0.82);
  c.quadraticCurveTo(S*0.85,S*0.88,S,S*0.78);
  c.lineTo(S,S); c.closePath(); c.fill();
  /* the leaf, with a dark rim so it never merges with the ground */
  const dark={leaf:'#0E3A22', leafD:'#0E3A22', bud:'#0E3A22', hair:'#0E3A22'};
  const st={leaf:'#9CE84F', leafD:'#6FCB34', bud:'#EFFFC9', hair:'#FFE066'};
  c.save();
  c.translate(S*0.5,S*0.815);
  c.shadowColor='rgba(4,20,10,.55)'; c.shadowBlur=30*u; c.shadowOffsetY=12*u;
  c.strokeStyle='#2C7A3E'; c.lineWidth=15*u; c.lineCap='round';
  c.beginPath(); c.moveTo(0,0); c.lineTo(0,-62*u); c.stroke();
  c.shadowColor='transparent';
  c.save(); c.translate(0,-62*u);
  c.save(); c.scale(1.10,1.10); fan(c,198*u,dark,false); c.restore();
  fan(c,198*u,st,false);
  c.restore();
  c.restore();
  /* glossy top edge */
  const gl=c.createLinearGradient(0,0,0,S*0.42);
  gl.addColorStop(0,'rgba(255,255,255,.22)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=gl; c.fillRect(0,0,S,S*0.42);
}

/* ---------------------------------------------------------------- props */
function roundPoly(c,pts,r){
  c.beginPath();
  for(let i=0;i<pts.length;i++){
    const p0=pts[(i-1+pts.length)%pts.length], p1=pts[i], p2=pts[(i+1)%pts.length];
    const v1=[p1[0]-p0[0],p1[1]-p0[1]], v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(...v1)||1, l2=Math.hypot(...v2)||1;
    const rr=Math.min(r,l1/2,l2/2);
    const a=[p1[0]-v1[0]/l1*rr, p1[1]-v1[1]/l1*rr];
    const b=[p1[0]+v2[0]/l2*rr, p1[1]+v2[1]/l2*rr];
    if(i===0) c.moveTo(a[0],a[1]); else c.lineTo(a[0],a[1]);
    c.quadraticCurveTo(p1[0],p1[1],b[0],b[1]);
  }
  c.closePath();
}
function diamond(c,x,y,w,h){
  c.beginPath(); c.moveTo(x,y-h/2); c.lineTo(x+w/2,y); c.lineTo(x,y+h/2); c.lineTo(x-w/2,y); c.closePath();
}
/* a chunky wooden post */
function post(c,x,y,h,w,col,dark){
  c.fillStyle=dark; c.fillRect(x-w/2,y-h,w,h);
  c.fillStyle=col;  c.fillRect(x-w/2,y-h,w*0.55,h);
  c.fillStyle=shade(col,10); c.fillRect(x-w/2,y-h,w,3);
}
/* Three storeys, drawn as a real iso box so it reads as a building and not a
   flat sticker like the other props. Anchor is the near (bottom) corner. */
function quad(c,p,fill,stroke,lw){
  c.beginPath(); c.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) c.lineTo(p[i][0],p[i][1]);
  c.closePath();
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1.6; c.lineJoin='round'; c.stroke(); }
}
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];

/* Sun-relative ground shadow: direction swings with the hour, length grows as
   the sun drops. Gives every solid a sense of sitting on the ground. */
/* Where the sun throws a shadow at this hour. Short, dark and tight under the
   object at noon; long, pale and stretched east or west at the ends of the day;
   almost gone after dark. Everything that stands up goes through this, so the
   whole yard turns together as the day passes. */
/* ux and uy are how far the shadow travels per unit of object height, so a tall
   house throws a long one and a gnome throws a short one from the same sun. */
function shadowVec(){
  const alt=Math.max(0.14,SUN.alt);
  const day=clamp((SUN.h-6)/12,0,1);
  /* how many object-heights the shadow reaches: the cotangent of the sun */
  const len=clamp(0.30/alt,0.30,2.2);
  /* and which way. +1 at sunrise, 0 at noon, -1 at sunset — keep this as pure
     direction, never as magnitude, or the shadow shrinks to nothing all day. */
  const dir=Math.cos(Math.PI*day);
  return {
    ux:dir*len*1.8,
    uy:0.22*len+0.10,
    len,
    /* no sun, no shadow: an overcast sky flattens the whole yard */
    a:(0.09+0.17*clamp(SUN.alt,0,1))*(1-SUN.night*0.80)*(1-WX.i*0.88)
  };
}
/* One pool that starts at the object's feet and runs away from the sun, rather
   than a disc that teleports sideways and leaves the object floating. */
function castShadow(c,w,h,height,z){
  const s=shadowVec();
  if(s.a<0.012) return;
  const ox=s.ux*height*z, oy=s.uy*height*z;
  const d=Math.hypot(ox,oy);
  c.save();
  c.globalAlpha=s.a;
  c.fillStyle='#12340C';
  c.translate(ox*0.5,oy*0.5);
  c.rotate(Math.atan2(oy,ox));
  c.beginPath();
  c.ellipse(0,0,w*z*0.5+d*0.5,h*z*0.5,0,0,TAU);
  c.fill();
  c.restore();
}
/* The house is too big to fake with an ellipse: project the footprint away from
   the sun and fill the hull of both copies, so the shadow has the shape of the
   building that cast it. Points are local to the house origin. */
function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const q of p){ while(lo.length>1&&cross(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=p.length-1;i>=0;i--){ const q=p[i];
    while(up.length>1&&cross(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}
function castHullShadow(c,foot,height,z){
  const s=shadowVec();
  if(s.a<0.012) return;
  const ox=s.ux*height*z, oy=s.uy*height*z;
  const pts=foot.concat(foot.map(p=>[p[0]+ox,p[1]+oy]));
  const hl=hull(pts);
  if(hl.length<3) return;
  c.save();
  c.globalAlpha=s.a;
  c.fillStyle='#12340C';
  c.beginPath();
  c.moveTo(hl[0][0],hl[0][1]);
  for(let i=1;i<hl.length;i++) c.lineTo(hl[i][0],hl[i][1]);
  c.closePath(); c.fill();
  c.restore();
}

function houseProp(c,z,t){
  const H0=houseAt(), LV=H0.L;
  const A=H0.A, B=H0.B;
  const u=[TW/2*z, TH/2*z];         /* +gx : down-right */
  const v=[-TW/2*z, TH/2*z];        /* +gy : down-left  */
  const bu=mul(u,-A), bv=mul(v,-B); /* back along each axis */
  const FL=46*z, H=FL*LV.fl;        /* storeys grow with the upgrade */
  const up=[0,-H];

  const O=[0,0];
  const BR=add(O,bv), BL=add(O,bu), FAR=add(BL,bv);
  const tO=add(O,up), tBR=add(BR,up), tBL=add(BL,up), tFAR=add(FAR,up);

  c.save();
  /* the real silhouette of the building, thrown away from the sun */
  castHullShadow(c,[O,add(O,bv),add(add(O,bu),bv),add(O,bu)],(H+LV.roofH*z)/z*0.80,z);

  const W1=LV.w1, W2=LV.w2, EDGE=LV.ed;
  const gradWall=(p0,p1,c0,c1)=>{
    const g=c.createLinearGradient(p0[0],p0[1],p1[0],p1[1]);
    g.addColorStop(0,c0); g.addColorStop(1,c1); return g;
  };
  const RIGHT=gradWall(tO,BR,W1,W2);
  const LEFT =gradWall(tO,BL,shade(LV.w2,6),shade(LV.w2,-14));
  const RIGHT_D=shade(LV.w2,4), LEFT_D=shade(LV.w2,-10);

  /* ---- the side wing, set back so it reads as an annex ---- */
  if(LV.wing){
    const wA=A*0.62, wB=B*0.48, wH=FL*clamp(LV.fl-2,1,3);
    const off=add(mul(v,-(B+wB*0.5)),mul(u,-A*0.18));
    const o=off, br=add(o,mul(v,-wB)), bl=add(o,mul(u,-wA));
    const uH=[0,-wH];
    c.save();
    quad(c,[o,br,add(br,uH),add(o,uH)],gradWall(add(o,uH),br,W1,W2),EDGE,2.2*z);
    quad(c,[o,bl,add(bl,uH),add(o,uH)],gradWall(add(o,uH),bl,shade(LV.w2,6),shade(LV.w2,-14)),EDGE,2.2*z);
    /* its own little hip roof */
    const OV=0.18, rH=LV.roofH*0.6*z;
    const eO=add(add(add(o,uH),mul(u,OV)),mul(v,OV));
    const eBR=add(add(add(br,uH),mul(u,OV)),mul(v,-OV));
    const eBL=add(add(add(bl,uH),mul(u,-OV)),mul(v,OV));
    const rf=add(add(eO,mul(v,-wB*0.5)),[0,-rH]);
    const rb=add(add(eBL,mul(v,-wB*0.5)),[0,-rH]);
    quad(c,[eO,eBR,rb,rf],LV.r1,LV.rim,2.2*z);
    quad(c,[eO,eBL,rb,rf],LV.r2,LV.rim,2.2*z);
    /* one lit window so the annex is clearly lived in */
    const wp=add(add(o,mul(v,-wB*0.5)),[0,-wH*0.62]);
    quad(c,[wp,add(wp,mul(v,-0.5)),add(add(wp,mul(v,-0.5)),[0,FL*0.4]),add(wp,[0,FL*0.4])],
      SUN.lit?'#FFDE96':'#8FC9DE',EDGE,2*z);
    c.restore();
  }

  /* ---- the two visible walls of the main block ---- */
  quad(c,[O,BR,tBR,tO],RIGHT,EDGE,2.4*z);
  quad(c,[O,BL,tBL,tO],LEFT,shade(LV.ed,-12),2.4*z);

  /* ambient occlusion where the walls meet the ground */
  const ao=c.createLinearGradient(0,0,0,-FL*0.5);
  ao.addColorStop(0,'rgba(40,26,12,.28)'); ao.addColorStop(1,'rgba(40,26,12,0)');
  quad(c,[O,BR,add(BR,[0,-FL*0.5]),add(O,[0,-FL*0.5])],ao);
  quad(c,[O,BL,add(BL,[0,-FL*0.5]),add(O,[0,-FL*0.5])],ao);

  /* storey bands, gilded once the place has money */
  for(let f=1;f<LV.fl;f++){
    const y=[0,-FL*f];
    const bandR=LV.trim?LV.trim:RIGHT_D, bandL=LV.trim?shade(LV.trim,-12):LEFT_D;
    quad(c,[add(O,y),add(BR,y),add(BR,add(y,[0,-5*z])),add(O,add(y,[0,-5*z]))],bandR);
    quad(c,[add(O,y),add(BL,y),add(BL,add(y,[0,-5*z])),add(O,add(y,[0,-5*z]))],bandL);
  }

  /* windows: s = fraction along the wall, f = storey index */
  function win(base,dir,s,f,wf,lit){
    const p0=add(add(O,mul(dir,s)),[0,-FL*f-FL*0.72]);
    const w=mul(dir,wf), h=[0,FL*0.44];
    const pts=[p0,add(p0,w),add(add(p0,w),h),add(p0,h)];
    quad(c,pts,lit?'#FFDE96':'#8FC9DE',EDGE,2.2*z);
    const gl=[p0,add(p0,mul(w,0.42)),add(add(p0,mul(w,0.42)),h),add(p0,h)];
    quad(c,gl,lit?'rgba(255,255,255,.42)':'rgba(255,255,255,.35)');
  }
  const dR=mul(bv,1/B), dL=mul(bu,1/A);
  const nR=Math.max(1,Math.round(B)), nL=Math.max(1,Math.round(A));
  for(let f=0;f<LV.fl;f++){
    for(let k=0;k<nR;k++){
      const s=0.42+k*(Math.max(0.6,B-0.9)/Math.max(1,nR-1||1));
      if(s>B-0.5) continue;
      win(O,dR,s,f,0.55,SUN.lit&&hash(f*7+k*3+1)>0.32);
    }
    for(let k=0;k<nL;k++){
      const s=0.42+k*(Math.max(0.6,A-0.9)/Math.max(1,nL-1||1));
      if(s>A-0.5) continue;
      win(O,dL,s,f,0.55,SUN.lit&&hash(f*13+k*5+3)>0.36);
    }
  }

  /* front door on the right wall, ground floor */
  {
    const p0=add(add(O,mul(dR,0.05)),[0,-FL*0.86]);
    const w=mul(dR,0.42), h=[0,FL*0.86];
    quad(c,[p0,add(p0,w),add(add(p0,w),h),add(p0,h)],LV.trim?LV.trim:'#9A5B33',shade(LV.ed,-10),2.4*z);
    const k=add(add(p0,mul(w,0.78)),[0,FL*0.44]);
    c.fillStyle='#FFD86B'; c.beginPath(); c.arc(k[0],k[1],2.6*z,0,TAU); c.fill();
  }

  /* ---- the porch: a roofed veranda across the front-right wall ---- */
  if(LV.porch){
    const D=0.72;                       /* how far it juts out */
    const oOut=add(O,mul(u,D)), brOut=add(BR,mul(u,D));
    /* two steps down to the grass */
    quad(c,[add(oOut,mul(u,0.16)),add(brOut,mul(u,0.16)),brOut,oOut],shade(LV.w2,-16));
    /* the deck */
    quad(c,[O,oOut,brOut,BR],shade(LV.w2,-4),shade(LV.ed,-6),1.8*z);
    const PH=FL*0.98;
    /* posts at each outer corner, and a middle one on anything grand */
    const P=[oOut,brOut];
    if(B>2.6) P.push(add(oOut,mul(bv,0.5)));
    c.fillStyle=LV.trim?LV.trim:W1;
    for(const p of P){
      roundPoly(c,[[p[0]-3.4*z,p[1]],[p[0]+3.4*z,p[1]],[p[0]+2.8*z,p[1]-PH],[p[0]-2.8*z,p[1]-PH]],2*z); c.fill();
    }
    /* the porch roof, sloping out from the wall */
    const rIn=[add(O,[0,-PH-6*z]),add(BR,[0,-PH-6*z])];
    const rOut=[add(oOut,[0,-PH]),add(brOut,[0,-PH])];
    quad(c,[rIn[0],rIn[1],rOut[1],rOut[0]],LV.r2,LV.rim,2.2*z);
    /* a rail between the posts */
    c.strokeStyle=shade(LV.ed,4); c.lineWidth=2.2*z; c.lineCap='round';
    c.beginPath(); c.moveTo(oOut[0],oOut[1]-PH*0.42); c.lineTo(brOut[0],brOut[1]-PH*0.42); c.stroke();
  }

  /* balcony on the left wall, first floor */
  if(LV.bal&&LV.fl>=2){
    const base=add(add(O,mul(dL,Math.min(1.0,A*0.35))),[0,-FL*1.02]);
    const w=mul(dL,Math.min(1.5,A*0.5)), out=mul(v,0.30);
    const f0=base, f1=add(base,w), f2=add(f1,out), f3=add(base,out);
    quad(c,[f0,f1,f2,f3],W1,shade(LV.ed,0),2*z);
    c.strokeStyle=LV.trim?LV.trim:shade(LV.ed,0); c.lineWidth=2.4*z; c.lineCap='round';
    for(let i=0;i<=6;i++){
      const a=add(f3,mul(mul(w,1/6),i)), b=add(a,[0,-13*z]);
      c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
    }
    const r0=add(f3,[0,-13*z]), r1=add(f2,[0,-13*z]);
    c.beginPath(); c.moveTo(r0[0],r0[1]); c.lineTo(r1[0],r1[1]); c.stroke();
  }

  /* hip roof up to a ridge, plus eaves */
  const OV=0.22;
  const eO=add(add(tO,mul(u,OV)),mul(v,OV));
  const eBR=add(add(tBR,mul(u,OV)),mul(v,-OV));
  const eBL=add(add(tBL,mul(u,-OV)),mul(v,OV));
  const eFAR=add(add(tFAR,mul(u,-OV)),mul(v,-OV));
  quad(c,[eO,eBR,eFAR,eBL],shade(LV.r2,-10),LV.rim,2.4*z);
  const RH=LV.roofH*z;
  const ridgeF=add(add(eO,mul(bv,0.5)),[0,-RH]);
  const ridgeB=add(add(eBL,mul(bv,0.5)),[0,-RH]);
  const gR=c.createLinearGradient(eO[0],eO[1],ridgeB[0],ridgeB[1]);
  gR.addColorStop(0,shade(LV.r1,-6)); gR.addColorStop(1,shade(LV.r1,12));
  quad(c,[eO,eBR,ridgeB,ridgeF],gR,LV.rim,2.4*z);
  quad(c,[eO,eBL,ridgeB,ridgeF],LV.r2,LV.rim,2.4*z);
  c.strokeStyle='rgba(0,0,0,.14)'; c.lineWidth=1.6*z;
  for(let i=1;i<5;i++){
    const a=add(eO,mul([ridgeF[0]-eO[0],ridgeF[1]-eO[1]],i/5));
    const b=add(eBR,mul([ridgeB[0]-eBR[0],ridgeB[1]-eBR[1]],i/5));
    c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
  }
  /* a gilded eaves band on the tiers that have earned one */
  if(LV.trim){
    c.strokeStyle=LV.trim; c.lineWidth=3.2*z; c.lineJoin='round';

    c.beginPath(); c.moveTo(fp[0],fp[1]); c.lineTo(fp[0],fp[1]-46*z); c.stroke();

    c.quadraticCurveTo(fp[0]+16*z,fp[1]-38*z-wv,fp[0],fp[1]-32*z);

  if(!LV.flag){
    quad(c,[add(ch,[-8*z,0]),add(ch,[8*z,0]),add(ch,[8*z,-26*z]),add(ch,[-8*z,-26*z])],LV.r1,LV.rim,2*z);
    quad(c,[add(ch,[-10*z,-26*z]),add(ch,[10*z,-26*z]),add(ch,[10*z,-32*z]),add(ch,[-10*z,-32*z])],shade(LV.r2,-8));

/* The nameplate out front. Whoever walks past should be in no doubt whose yard

    g.addColorStop(0,'rgba(255,214,140,'+(0.42*SUN.night)+')');

/* Fredi himself, minding the stall: tanned and built, white ribbed vest, long
   black trousers, van dyke beard, toothpick, arms folded. Idles with a weight
   shift and a slow chew; throws a fist up when a harvest lands.
   Built on a four-head cartoon proportion: head 26 tall, torso 32, legs 38. */
function fredi(c,z,t,W){
  const j=FRED.jump;
  const walking=!!(W&&W.on);
  const sw=walking?Math.sin(W.ph):0;
  const hop=-Math.sin(j*Math.PI)*30*z;
  const bob=Math.sin(t*1.5)*1.4*z+hop-(walking?Math.abs(Math.sin(W.ph))*2.6*z:0);
  const shift=walking?0:Math.sin(t*0.52)*2.2*z;
  const lean=walking?0.05:Math.sin(t*0.52)*0.03;
  const chew=Math.sin(t*5.2);
  const look=Math.sin(t*0.31)*0.085;
  const cheer=clamp(j*1.7,0,1);

  const SKIN='#A9713F', SKIN_D='#8C5B31', SKIN_L='#C18B56';
  const VEST='#F7F3E9', VEST_D='#DFD8C6';
  const PANT='#25272E', PANT_D='#15171C';
  const HAIR='#1B1511';

  const HIP=-38*z, CHEST=-70*z, SHO=-65*z, HEAD=-91*z;

  c.save();
  castShadow(c,50,20,92,z);
  if(W&&W.face<0) c.scale(-1,1);
  /* stooping over a plot with the watering can */
  const stoop=(W&&W.act>0)?W.act:0;
  c.translate(shift,bob+stoop*5*z);
  c.rotate(lean*0.3+stoop*0.20);

  /* legs, short and planted — they swing when he is actually going somewhere */
  for(const s of [-1,1]){
    const lx=s*7*z;
    c.save();
    if(walking){ c.translate(lx,HIP); c.rotate((s>0?sw:-sw)*0.44); c.translate(-lx,-HIP); }
    c.fillStyle=s<0?PANT_D:PANT;
    roundPoly(c,[[lx-7.5*z,HIP],[lx+7.5*z,HIP],[lx+6*z,-5*z],[lx-6*z,-5*z]],5*z); c.fill();
    c.fillStyle='#3B2F26';
    roundPoly(c,[[lx-7*z,-6.5*z],[lx+8.5*z,-6.5*z],[lx+8.5*z,0],[lx-7*z,0]],3*z); c.fill();
    c.restore();
  }

  /* torso: vest tapering from broad shoulders to the waist */
  c.fillStyle=VEST;
  roundPoly(c,[[-15*z,CHEST],[15*z,CHEST],[12*z,HIP+2*z],[-12*z,HIP+2*z]],6*z); c.fill();
  c.fillStyle=VEST_D;
  roundPoly(c,[[-15*z,CHEST],[-5*z,CHEST],[-4*z,HIP+2*z],[-12*z,HIP+2*z]],6*z); c.fill();
  c.strokeStyle='rgba(0,0,0,.07)'; c.lineWidth=0.9*z;
  for(let i=1;i<6;i++){
    const x=-11*z+i*3.8*z;
    c.beginPath(); c.moveTo(x,CHEST+7*z); c.lineTo(x,HIP); c.stroke();
  }
  /* chest showing between the straps */
  c.fillStyle=SKIN;
  roundPoly(c,[[-10*z,CHEST-2*z],[-3.5*z,CHEST-2*z],[-3.5*z,CHEST+10*z],[-10*z,CHEST+10*z]],3*z); c.fill();
  roundPoly(c,[[3.5*z,CHEST-2*z],[10*z,CHEST-2*z],[10*z,CHEST+10*z],[3.5*z,CHEST+10*z]],3*z); c.fill();
  c.fillStyle=SKIN_D;
  c.beginPath(); c.ellipse(0,CHEST+8*z,6*z,4*z,0,0,TAU); c.fill();
  /* silver chain */
  c.strokeStyle='#D5DCE6'; c.lineWidth=1.4*z; c.lineCap='round';
  c.beginPath(); c.moveTo(-6.5*z,CHEST-1*z);
  c.quadraticCurveTo(0,CHEST+8*z,6.5*z,CHEST-1*z); c.stroke();
  c.fillStyle='#EAF0F7';
  c.beginPath(); c.arc(0,CHEST+5.6*z,1.3*z,0,TAU); c.fill();

  /* upper arms hanging off the shoulders */
  const arm=(s,dark)=>{
    c.fillStyle=dark?SKIN_D:SKIN;
    c.save(); c.translate(s*15*z,SHO+2*z); c.rotate(s*0.20);
    roundPoly(c,[[-6*z,-5*z],[6*z,-5*z],[5.5*z,16*z],[-5.5*z,16*z]],6*z); c.fill();
    c.fillStyle='rgba(255,255,255,.13)';
    c.beginPath(); c.ellipse(-1.5*z,1*z,3.4*z,5.5*z,0,0,TAU); c.fill();
    c.restore();
  };
  arm(-1,true); arm(1,false);

  if(cheer<0.5){

    c.fillStyle=SKIN_D;
    roundPoly(c,[[-14*z,FY-4*z],[12*z,FY-6.5*z],[13*z,FY-0.5*z],[-13*z,FY+2*z]],3.6*z); c.fill();
    c.fillStyle=SKIN;
    roundPoly(c,[[-13*z,FY+1*z],[13*z,FY-1.5*z],[14*z,FY+4.5*z],[-12*z,FY+7*z]],3.6*z); c.fill();
    c.fillStyle='rgba(255,255,255,.13)';
    roundPoly(c,[[-10*z,FY+2*z],[8*z,FY-0.5*z],[8.5*z,FY+2*z],[-9.5*z,FY+4.5*z]],2.5*z); c.fill();
    c.fillStyle=SKIN_L;
    c.beginPath(); c.ellipse(-14*z,FY+4.5*z,4.6*z,4*z,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(14*z,FY-4*z,4.2*z,3.8*z,0,0,TAU); c.fill();
  } else {
    const FY=CHEST+19*z;
    c.fillStyle=SKIN_D;
    roundPoly(c,[[-15*z,FY-3*z],[6*z,FY-6*z],[7*z,FY+1.5*z],[-14*z,FY+4.5*z]],4.5*z); c.fill();

    c.fillStyle=SKIN;
    roundPoly(c,[[-5.5*z,0],[5.5*z,0],[5*z,-26*z],[-5*z,-26*z]],5*z); c.fill();
    c.fillStyle=SKIN_L;
    c.beginPath(); c.arc(0,-29*z,6.2*z,0,TAU); c.fill();
    c.restore();
  }

  /* neck and head */
  c.save();
  c.translate(0,0); c.rotate(look*0.45-cheer*0.1);
  c.fillStyle=SKIN_D;
  roundPoly(c,[[-5*z,CHEST-13*z],[5*z,CHEST-13*z],[5*z,CHEST+1*z],[-5*z,CHEST+1*z]],3*z); c.fill();
  c.fillStyle=SKIN;
  c.beginPath(); c.ellipse(0,HEAD,12*z,13.5*z,0,0,TAU); c.fill();
  c.fillStyle=SKIN_D;
  c.beginPath(); c.ellipse(-6.5*z,HEAD,5*z,11.5*z,0,0,TAU); c.fill();
  for(const s of [-1,1]){
    c.fillStyle=SKIN_D;
    c.beginPath(); c.ellipse(s*12*z,HEAD+1*z,2.8*z,3.8*z,0,0,TAU); c.fill();
  }
  c.fillStyle='#DCE3EC';
  c.beginPath(); c.arc(-11.8*z,HEAD+3.5*z,1.4*z,0,TAU); c.fill();

  /* van dyke: moustache, soul patch, chin beard, jaw shaved */
  c.fillStyle=HAIR;
  roundPoly(c,[[-4.1*z,HEAD+5.4*z],[4.1*z,HEAD+5.4*z],[3.1*z,HEAD+11*z],[-3.1*z,HEAD+11*z]],3*z); c.fill();
  c.beginPath(); c.ellipse(-3.2*z,HEAD+1.4*z,3.3*z,1.9*z,0.16,0,TAU); c.fill();
  c.beginPath(); c.ellipse(3.2*z,HEAD+1.4*z,3.3*z,1.9*z,-0.16,0,TAU); c.fill();
  c.beginPath(); c.ellipse(0,HEAD+4.4*z,1.5*z,1.6*z,0,0,TAU); c.fill();

  /* nose, eyes, heavy brows */
  c.fillStyle=SKIN_D;
  c.beginPath(); c.ellipse(0,HEAD-0.5*z,2.2*z,2.9*z,0,0,TAU); c.fill();
  const blink=(Math.sin(t*0.77)>0.975)?0.12:1;
  for(const s of [-1,1]){
    c.fillStyle='#FFFFFF';
    c.beginPath(); c.ellipse(s*5*z,HEAD-4.5*z,2.9*z,2.9*z*blink,0,0,TAU); c.fill();
    c.fillStyle='#2A1F16';
    c.beginPath(); c.ellipse(s*5*z+look*6*z,HEAD-4.5*z,1.6*z,1.8*z*blink,0,0,TAU); c.fill();
    c.fillStyle=HAIR;
    roundPoly(c,[[s*1.6*z,HEAD-9.4*z],[s*8.8*z,HEAD-10.4*z],[s*8.8*z,HEAD-7.8*z],[s*1.6*z,HEAD-7*z]],1.3*z); c.fill();
  }

  /* hair: skin fade at the sides, tight curls on top */
  c.fillStyle='#4A3A2C';
  c.beginPath(); c.ellipse(0,HEAD-7.5*z,11.4*z,8*z,0,Math.PI,TAU); c.fill();
  c.fillStyle='#2A211A';
  c.beginPath(); c.ellipse(0,HEAD-8*z,11.6*z,8.6*z,0,Math.PI,TAU); c.fill();
  c.fillStyle=HAIR;
  c.beginPath(); c.ellipse(0,HEAD-10.5*z,10.6*z,7.6*z,0,Math.PI,TAU); c.fill();
  c.fillRect(-10.6*z,HEAD-10.5*z,21.2*z,2.2*z);
  for(let i=0;i<9;i++){
    const a=Math.PI+(i/8)*Math.PI;
    c.beginPath();
    c.arc(Math.cos(a)*9.4*z, HEAD-10.5*z+Math.sin(a)*6.6*z, (2.8+hash(i*7)*1.5)*z, 0, TAU);
    c.fill();
  }
  for(let i=0;i<4;i++){
    c.beginPath();
    c.arc((-1+i*3.1)*z, HEAD+(-15.5-hash(i*5)*2.6)*z, (2.7+hash(i*3)*1.2)*z, 0, TAU);
    c.fill();
  }
  c.fillStyle='rgba(255,255,255,.10)';
  c.beginPath(); c.ellipse(-2.5*z,HEAD-13*z,4.6*z,2.4*z,-0.25,0,TAU); c.fill();

  /* toothpick */
  c.save();
  c.translate(4.2*z,HEAD+3*z); c.rotate(-0.3+chew*0.09);
  c.fillStyle='#E8D9AE';
  roundPoly(c,[[0,-0.8*z],[11*z,-1.3*z],[11*z,0.3*z],[0,0.8*z]],0.6*z); c.fill();
  c.restore();

  /* the watering can, only out when he is actually watering something */
  if(stoop>0.02){
    c.save();
    c.translate(17*z,-24*z); c.rotate(0.5+stoop*0.5);
    c.globalAlpha=Math.min(1,stoop*2);
    c.fillStyle='#5FA8C8';
    roundPoly(c,[[-8*z,-9*z],[8*z,-9*z],[6.5*z,5*z],[-6.5*z,5*z]],2.6*z); c.fill();
    c.fillStyle='#4C8CA8';
    roundPoly(c,[[6*z,-7*z],[19*z,-2*z],[20*z,1*z],[6*z,-3*z]],1.6*z); c.fill();
    c.strokeStyle='#4C8CA8'; c.lineWidth=2.2*z;
    c.beginPath(); c.arc(0,-10*z,6*z,Math.PI,TAU); c.stroke();
    c.globalAlpha=1;
    c.restore();
    /* and the water landing on the plot in front of him */
    if(stoop>0.6){
      c.strokeStyle='rgba(126,206,236,.8)'; c.lineWidth=1.6*z; c.lineCap='round';
      for(let i=0;i<5;i++){
        const k=((T*1.5+i*0.2)%1);
        c.globalAlpha=(1-k)*0.85;
        const x=(38+k*16)*z, y=(-22+k*34)*z;
        c.beginPath(); c.moveTo(x,y); c.lineTo(x+2*z,y+5*z); c.stroke();
      }
      c.globalAlpha=1;
    }
  }

  c.restore();
  c.restore();
}
/* --------------------------------------------------------------- coming back
   Opening the game after a few hours should show you those hours, not just the
   result of them: the sun crosses the sky, the shadows swing round, the crop
   fills out and the street runs at speed. Then it settles on now. */
const LAPSE={on:false, t:0, dur:3.6, h0:12, h1:12, ms:0, awayMs:0};
function lapseStart(awayMs){
  const d=new Date();
  LAPSE.h1=d.getHours()+d.getMinutes()/60;
  LAPSE.ms=Math.min(awayMs,10*3600000);          /* never sweep more than ten hours */
  LAPSE.h0=LAPSE.h1-LAPSE.ms/3600000;
  LAPSE.awayMs=awayMs;
  LAPSE.on=true; LAPSE.t=0;
}
function lapseOffset(){
  if(!LAPSE.on) return 0;
  const e=lapseEase();
  return -LAPSE.ms*(1-e);
}
function lapseEase(){
  const u=clamp(LAPSE.t/LAPSE.dur,0,1);
  return u*u*(3-2*u);
}
function lapseCard(){
  const ms=LAPSE.awayMs, h=Math.floor(ms/3600000), m=Math.round((ms%3600000)/60000);
  const when=h>0?(h+' שעות'+(m>4?(' ו-'+m+' דקות'):'')):(m+' דקות');
  const ripe=S.plots.filter(p=>p.sid&&p.i<S.owned&&(now()-p.at)>=p.dur).length;
  const bits=[];
  if(ripe) bits.push(ripe+' שתילים הבשילו');
  if(S.orders&&S.orders.length) bits.push(S.orders.length+' הזמנות מחכות');
  celebrate('back','ברוך שובך!','היית בחוץ '+when+(bits.length?' · '+bits.join(' · '):''));
}
/* -------------------------------------------------------------- the builders
   An upgrade you paid millions for should not just be a different picture next
   frame. Scaffolding goes up around the house, there is banging and dust for a
   second and a half, and then the poles drop away and the new place is there. */
const BLD={t:-1, dur:2.3};
function buildStart(){ BLD.t=0; }
/* the fence is what you actually see when the land grows, so push it outward
   over a second instead of teleporting it */
const YRD={t:-1, dur:1.0, from:0};
function yardGrow(fromR){ YRD.from=fromR; YRD.t=0; }
function fenceB(){
  if(YRD.t<0) return yardB();
  const e=1-Math.pow(1-clamp(YRD.t/YRD.dur,0,1),3);
  const r=lerp(YRD.from,yardR(),e);
  return {x0:CX-r,x1:CX+r,y0:CY-r,y1:CY+r};
}
function buildUpdate(dt){
  if(BLD.t>=0){ BLD.t+=dt; if(BLD.t>BLD.dur) BLD.t=-1; }
  if(YRD.t>=0){
    YRD.t+=dt;
    if(YRD.t>YRD.dur) YRD.t=-1;
    else {
      /* turf breaking along the line the fence is moving to */
      const b=fenceB();
      for(let i=0;i<2;i++){
        const t=Math.random(), side=(Math.random()*4)|0;
        let gx,gy;
        if(side===0){ gx=lerp(b.x0,b.x1,t); gy=b.y0; }
        else if(side===1){ gx=b.x1; gy=lerp(b.y0,b.y1,t); }
        else if(side===2){ gx=lerp(b.x0,b.x1,t); gy=b.y1; }
        else { gx=b.x0; gy=lerp(b.y0,b.y1,t); }
        const p=iso(gx,gy), s=w2s(p.x,p.y);
        puff(s.x,s.y,'#C4A87A',1);
      }
    }
  }
}
/* drawn inside houseProp, in the house's own local space */
function scaffold(c,z,bu,bv,H){
  if(BLD.t<0) return;
  const u=BLD.t/BLD.dur;
  /* up fast, hold, then collapse */
  const k=u<0.12 ? u/0.12 : (u>0.80 ? Math.max(0,1-(u-0.80)/0.20) : 1);
  if(k<=0.01) return;
  const drop=(u>0.80)?(1-k)*40*z:0;
  const shake=(u>0.14&&u<0.78)?Math.sin(BLD.t*46)*1.1*z:0;
  const top=-(H+26*z)*k;
  const corners=[[0,0],bv,[bu[0]+bv[0],bu[1]+bv[1]],bu];
  c.save();
  c.translate(shake,drop);
  /* poles */
  c.strokeStyle='#B08A4E'; c.lineWidth=3.4*z; c.lineCap='round';
  for(const p of corners){
    c.beginPath(); c.moveTo(p[0],p[1]); c.lineTo(p[0],p[1]+top); c.stroke();
  }
  /* planks at two working heights */
  c.strokeStyle='#C79A5C'; c.lineWidth=4.6*z;
  for(const f of [0.42,0.78]){
    const y=top*f;
    c.beginPath();
    c.moveTo(corners[0][0],corners[0][1]+y);
    c.lineTo(corners[1][0],corners[1][1]+y);
    c.moveTo(corners[0][0],corners[0][1]+y);
    c.lineTo(corners[3][0],corners[3][1]+y);
    c.stroke();
  }
  /* diagonal bracing on the near face */
  c.strokeStyle='rgba(176,138,78,.75)'; c.lineWidth=2.2*z;
  c.beginPath();
  c.moveTo(corners[0][0],corners[0][1]);
  c.lineTo(corners[1][0],corners[1][1]+top*0.78);
  c.moveTo(corners[0][0],corners[0][1]);
  c.lineTo(corners[3][0],corners[3][1]+top*0.78);
  c.stroke();
  /* somebody up there is hitting something */
  if(u>0.14&&u<0.78){
    const n=Math.floor(BLD.t*11);
    for(let i=0;i<2;i++){
      const h=hash(n*7+i*13);
      if(h<0.55) continue;
      const side=hash(n*3+i)>0.5?1:3;
      const px=lerp(corners[0][0],corners[side][0],0.3+hash(n*5+i)*0.5);
      const py=lerp(corners[0][1],corners[side][1],0.3+hash(n*5+i)*0.5)+top*(hash(n*11+i)>0.5?0.42:0.78);
      c.save();
      c.globalCompositeOperation='lighter';
      const g=c.createRadialGradient(px,py,1,px,py,16*z);
      g.addColorStop(0,'rgba(255,236,168,.9)'); g.addColorStop(1,'rgba(255,236,168,0)');
      c.fillStyle=g; c.beginPath(); c.arc(px,py,16*z,0,TAU); c.fill();
      c.restore();
    }
  }
  c.restore();
}
/* ------------------------------------------------------------------- Fredi
   He is the face of the game and he was a shop fitting: bolted to one spot
   behind the stall. Now he walks his own yard — checks a plot, waters it,
   leans on the fence for a while, then heads back to the counter. */
const FRD={gx:null, gy:0, tgx:0, tgy:0, st:'idle', t:1.5, ph:0, face:1, act:0};
function frediUpdate(dt){
  const home=propSpots().fredi;
  if(FRD.gx===null){ FRD.gx=home[0]; FRD.gy=home[1]; FRD.tgx=home[0]; FRD.tgy=home[1]; }
  FRD.t-=dt;
  /* the watering stoop eases in and out rather than snapping */
  const want=(FRD.st==='water')?1:0;
  FRD.act+=(want-FRD.act)*Math.min(1,dt*3.4);

  if(FRD.st==='walk'){
    const dx=FRD.tgx-FRD.gx, dy=FRD.tgy-FRD.gy, d=Math.hypot(dx,dy);
    if(d>0.10){
      const sp=1.15;
      FRD.gx+=dx/d*sp*dt; FRD.gy+=dy/d*sp*dt;
      FRD.ph+=dt*7.5;
      FRD.face=((dx-dy)>=0)?1:-1;        /* iso x is (gx-gy) */
    } else {
      FRD.st=pick(['water','water','look','rest','idle']);
      FRD.t=2.5+Math.random()*4.5;
      if(FRD.st==='water') FRD.t=3.5+Math.random()*3;
    }
  } else if(FRD.t<=0){
    const b=yardB();
    if(Math.random()<0.34){ FRD.tgx=home[0]; FRD.tgy=home[1]; }
    else {
      const owned=S.plots.filter(p=>p.i<S.owned);
      if(owned.length){
        const p=owned[(Math.random()*owned.length)|0];
        FRD.tgx=p.gx-0.9; FRD.tgy=p.gy+0.9;
      } else {
        FRD.tgx=clamp(CX+(Math.random()-0.5)*4,b.x0+1,b.x1-1);
        FRD.tgy=clamp(CY+(Math.random()-0.5)*4,b.y0+1,b.y1-1);
      }
    }
    FRD.st='walk';
  }
}

function popText(sx,sy,txt,col){ fx({k:'txt',x:sx,y:sy,txt,col:col||'#fff',life:1.3,vy:-52}); }

function confetti(n){
