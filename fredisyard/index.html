/* A real moment when the property changes. Without one, an upgrade is a number
   going down in a menu — the screen has to say something happened out there. */
let celeEl=null;
function celebrate(kind,title,sub){
  if(kind!=='back') confetti(96);   /* paper for an upgrade, not for waking up */
  /* the camera pulls back a hair and eases forward again onto the new thing */
  cam.z=cam.tz*0.86;
  if(!celeEl){ celeEl=document.createElement('div'); celeEl.id='cele'; document.body.appendChild(celeEl); }
  celeEl.className=kind==='yard'?'green':'gold';
  celeEl.innerHTML='<div class="ce-i">'+(kind==='yard'?'🌍':kind==='back'?'🌅':'🏠')+'</div>'+
    '<div class="ce-t"></div><div class="ce-s"></div>';
  celeEl.querySelector('.ce-t').textContent=title;
  celeEl.querySelector('.ce-s').textContent=sub;
  void celeEl.offsetWidth;                      /* restart the entrance */
  celeEl.classList.add('on');
  clearTimeout(celeEl._t);
  celeEl._t=setTimeout(()=>celeEl.classList.remove('on'),2800);
}
function drawFX(dt){
  for(let i=FX.length-1;i>=0;i--){
    const p=FX[i]; p.t+=dt;
    if(p.d&&p.t<p.d) continue;
    const u=(p.t-(p.d||0))/p.life;
    if(u>=1){ FX.splice(i,1); continue; }
    ctx.save();
    if(p.k==='txt'){
      ctx.globalAlpha=u<0.15?u/0.15:1-Math.pow(u,3);
      ctx.font='900 '+Math.round(19*Math.min(1.5,cam.z+0.5))+'px "Segoe UI",Arial,sans-serif';
      ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(30,18,8,.6)';
      const y=p.y+p.vy*u;
      ctx.strokeText(p.txt,p.x,y); ctx.fillStyle=p.col; ctx.fillText(p.txt,p.x,y);
    } else if(p.k==='coin'){
      /* fling out, then home in on the counter with an ease-in curve */
      const e=u*u*(3-2*u);
      const fx0=p.x+p.ax*u, fy0=p.y+p.ay*u+420*u*u;
      const x=lerp(fx0,p.tx,e*e), y=lerp(fy0,p.ty,e*e);
      ctx.globalAlpha=u>0.86?(1-u)/0.14:1;
      const r=10*Math.min(1.4,cam.z+0.5)*(1-e*0.35);
      ctx.beginPath(); ctx.ellipse(x,y,r*Math.abs(Math.cos(u*11+p.sp)),r,0,0,TAU);
      ctx.fillStyle='#FFC93C'; ctx.fill();
      ctx.lineWidth=2.2; ctx.strokeStyle='#A9740A'; ctx.stroke();
      ctx.globalAlpha*=0.7; ctx.fillStyle='#FFF0A8';
      ctx.beginPath(); ctx.ellipse(x-r*0.25,y-r*0.3,r*0.26,r*0.3,0,0,TAU); ctx.fill();
    } else if(p.k==='plant'){
      /* pivot about the stump, so it reads as a stalk being cut through */
      const e=1-Math.pow(1-u,2.2);
      ctx.globalAlpha=(1-u)*0.95;
      const spr=sprite(p.st,BUCKETS-1,zStep());
      const k=cam.z*PSCALE;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.dir*e*1.2);
      ctx.translate(p.dir*e*22*cam.z,e*10*cam.z);
      ctx.drawImage(spr,-SPRW*k/2,-SPRH*k+14*k,SPRW*k,SPRH*k);
    } else if(p.k==='ring'){
      /* a tap always answers, even when the tap does nothing else */
      const e=1-Math.pow(1-u,2);
      ctx.globalAlpha=(1-u)*0.7;
      ctx.lineWidth=3*cam.z;
      ctx.strokeStyle='#FFF6D8';
      diamond(ctx,p.x,p.y,TW*cam.z*(0.5+e*0.75),TH*cam.z*(0.5+e*0.75));
      ctx.stroke();
    } else if(p.k==='puff'){
      const y=p.y+p.vy*u+240*u*u, x=p.x+p.vx*u;
      ctx.globalAlpha=(1-u)*0.85;
      ctx.beginPath(); ctx.arc(x,y,p.r*(0.6+u*1.5)*cam.z,0,TAU);
      ctx.fillStyle=p.col; ctx.fill();
    } else if(p.k==='drop'){
      ctx.globalAlpha=1-u;
      ctx.fillStyle='#7FD3F0';
      const y=p.y+p.vy*u;
      ctx.beginPath(); ctx.ellipse(p.x,y,2.6*cam.z,6*cam.z,0,0,TAU); ctx.fill();
    } else if(p.k==='leaf'){
      const x=p.x+p.vx*u+Math.sin(u*p.sw*TAU+p.sp)*p.amp;
      const y=p.y+p.vy*u+p.g*u*u;
      ctx.globalAlpha=u>0.68?(1-u)/0.32:1;
      ctx.translate(x,y); ctx.rotate(p.rot+u*p.spin);
      /* a blade seen edge-on some of the time, the way a falling leaf turns */
      ctx.scale(1,Math.max(0.18,Math.abs(Math.cos(u*p.sw*2.6+p.sp))));
      ctx.fillStyle=p.col;
      ctx.beginPath();
      ctx.moveTo(-p.r,0);
      ctx.quadraticCurveTo(0,-p.r*0.46,p.r,0);
      ctx.quadraticCurveTo(0,p.r*0.46,-p.r,0);
      ctx.fill();
    } else if(p.k==='jar'){
      const e=u*u*(3-2*u);
      const fx0=p.x+p.ax*u, fy0=p.y+p.ay*u+560*u*u;
      const x=lerp(fx0,p.tx,e*e), y=lerp(fy0,p.ty,e*e);
      ctx.globalAlpha=u>0.86?(1-u)/0.14:1;
      const k=Math.min(1.15,cam.z+0.45)*(1-e*0.30);
      ctx.translate(x,y); ctx.rotate(Math.sin(u*7+p.sp)*0.34);
      ctx.fillStyle='rgba(214,238,246,.9)';
      roundPoly(ctx,[[-7*k,-9*k],[7*k,-9*k],[7*k,9*k],[-7*k,9*k]],3*k); ctx.fill();
      ctx.fillStyle=p.col;
      roundPoly(ctx,[[-5*k,-3*k],[5*k,-3*k],[5*k,7*k],[-5*k,7*k]],2.4*k); ctx.fill();
      ctx.fillStyle='#B98A3C';
      roundPoly(ctx,[[-8*k,-12*k],[8*k,-12*k],[8*k,-7*k],[-8*k,-7*k]],2*k); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      roundPoly(ctx,[[-5*k,-7*k],[-2.4*k,-7*k],[-2.4*k,6*k],[-5*k,6*k]],1.4*k); ctx.fill();
    } else if(p.k==='conf'){
      /* paper, not sparks: a rectangle tumbling on its own axis and drifting */
      const y=p.y+p.vy*u+p.g*u*u, x=p.x+p.vx*u+Math.sin(u*p.sw*TAU+p.sp)*16;
      ctx.globalAlpha=u>0.72?(1-u)/0.28:1;
      ctx.translate(x,y); ctx.rotate(p.rot+u*p.spin);
      ctx.scale(1,Math.max(0.15,Math.abs(Math.cos(u*p.sw*3+p.sp))));
      ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    }
    ctx.restore();
  }
}

/* ---------------------------------------------------------------- scene */
let T=0, DT=0.016;
const FRED={jump:0};
const clouds=[];
for(let i=0;i<7;i++) clouds.push({x:hash(i*31)*2400-400, y:60+hash(i*17)*190, s:0.6+hash(i*7)*0.9, v:6+hash(i*5)*9});

function tileTop(gx,gy){ const p=iso(gx,gy); return w2s(p.x,p.y); }

/* ---------------------------------------------------------------- daylight
   Driven by the device clock, so the yard is dark when it is dark outside. */
const SUN={h:12, alt:1, tint:[255,255,255], mul:0, night:0, gold:0};
let HOUR_OVERRIDE=null;   /* debug: force a time of day */
const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const mix3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const PAL={
  night:[[9,18,42],[17,31,66],[38,54,96]],
  twil :[[32,50,100],[104,76,130],[226,132,104]],
  gold :[[70,146,204],[238,158,108],[255,208,142]],
  day  :[[79,195,232],[143,220,243],[209,240,250]]
};
function updateSun(){
  const d=new Date();
  const h=(HOUR_OVERRIDE!==null)?HOUR_OVERRIDE:(d.getHours()+d.getMinutes()/60+d.getSeconds()/3600);
  SUN.h=h;
  SUN.alt=Math.sin((h-6)/24*TAU);              /* 06:00 sunrise, 12:00 peak, 18:00 set */
  const a=SUN.alt;
  let c0=PAL.night[0],c1=PAL.night[1],c2=PAL.night[2];
  const t1=smooth(-0.34,-0.06,a), t2=smooth(-0.05,0.13,a), t3=smooth(0.11,0.36,a);
  c0=mix3(c0,PAL.twil[0],t1); c1=mix3(c1,PAL.twil[1],t1); c2=mix3(c2,PAL.twil[2],t1);
  c0=mix3(c0,PAL.gold[0],t2); c1=mix3(c1,PAL.gold[1],t2); c2=mix3(c2,PAL.gold[2],t2);
  c0=mix3(c0,PAL.day[0],t3);  c1=mix3(c1,PAL.day[1],t3);  c2=mix3(c2,PAL.day[2],t3);
  SUN.sky=[c0,c1,c2];
  SUN.night=1-smooth(-0.16,0.06,a);
  SUN.gold=smooth(-0.02,0.16,a)*(1-smooth(0.18,0.42,a));
  /* what the daylight does to everything standing in it */
  let tint=[255,255,255];
  tint=mix3(tint,[255,206,152],SUN.gold*0.85);
  tint=mix3(tint,[86,108,168],SUN.night*0.82);
  /* rain takes the colour out of the light and puts a lid on the sky */
  if(WX.i>0.01){
    SUN.sky=[mix3(SUN.sky[0],[46,56,68],WX.i*0.82),
             mix3(SUN.sky[1],[80,90,102],WX.i*0.82),
             mix3(SUN.sky[2],[118,126,134],WX.i*0.78)];
    tint=mix3(tint,[126,140,158],WX.i*0.5);
  }
  SUN.tint=tint;
  SUN.mul=(SUN.gold*0.85+SUN.night*0.82+WX.i)>0.02?1:0;
  SUN.lit=SUN.night>0.35;                       /* windows and lamps come on */
  /* keep the page behind the canvas the same colour as the ground at this hour,
     so a sliver the canvas cannot reach never reads as a band */
  const gr=Math.round(95*tint[0]/255), gg=Math.round(168*tint[1]/255), gb=Math.round(66*tint[2]/255);
  if(Math.abs(gr-PAGE_BG[0])>3||Math.abs(gg-PAGE_BG[1])>3||Math.abs(gb-PAGE_BG[2])>3){
    PAGE_BG=[gr,gg,gb];
    const css='rgb('+gr+','+gg+','+gb+')';
    document.documentElement.style.backgroundColor=css;
    if(document.body) document.body.style.backgroundColor=css;
    cv.style.backgroundColor=css;
  }
}
let PAGE_BG=[-9,-9,-9];
/* ----------------------------------------------------------------- weather
   Rain is the one thing that says a yard is outdoors. The light drops, the
   field goes dark and glossy, the wind picks up, and the screen fills with
   motion that the player did not cause. It arrives on its own schedule. */
const WX={mode:'clear', i:0, t:0, dur:0, next:120+Math.random()*300,
          flash:0, bolt:null, boltT:8, rumble:0};
const RAIN=[], SPLASH=[];
let splashAcc=0;
function newDrop(){
  const far=Math.random();
  return {x:Math.random()*(VW+180)-120, y:Math.random()*VH,
          v:640+far*760, len:9+far*20, w:0.8+far*1.1, a:0.18+far*0.34};
}
function makeBolt(){
  const pts=[[VW*(0.2+Math.random()*0.6),-10]];
  let y=-10;
  while(y<horizonY()-10){
    y+=18+Math.random()*30;
    pts.push([pts[pts.length-1][0]+(Math.random()-0.5)*46, y]);
  }
  return pts;
}
function wxUpdate(dt){
  if(WX.mode==='clear'){
    WX.i=Math.max(0,WX.i-dt*0.42);
    WX.next-=dt;
    if(WX.next<=0){ WX.mode='rain'; WX.t=0; WX.dur=40+Math.random()*90; }
  } else {
    WX.t+=dt;
    /* fade in, hold, fade out over the last ten seconds */
    const out=clamp((WX.dur-WX.t)/10,0,1);
    WX.i=Math.min(out,Math.min(1,WX.i+dt*0.3));
    if(WX.t>WX.dur){ WX.mode='clear'; WX.next=240+Math.random()*600; }
    WX.boltT-=dt;
    if(WX.boltT<=0 && WX.i>0.62){
      WX.flash=1; WX.rumble=1; WX.boltT=7+Math.random()*18;
      WX.bolt=makeBolt();
    }
  }
  if(WX.flash>0) WX.flash-=dt*3.4;
  if(WX.rumble>0) WX.rumble-=dt*0.5;

  /* the drop pool tracks the intensity, so a shower costs nothing when dry */
  const want=Math.round(WX.i*(VW>520?190:130));
  while(RAIN.length<want) RAIN.push(newDrop());
  while(RAIN.length>want) RAIN.pop();
  const slant=44+WX.i*26;
  for(const d of RAIN){
    d.y+=d.v*dt; d.x+=slant*dt*(d.v/700);
    if(d.y>VH+24){ const n=newDrop(); n.y=-24-Math.random()*80; Object.assign(d,n); }
  }
  /* splashes land on the ground, never in the sky */
  if(WX.i>0.05){
    const hz=horizonY();
    splashAcc=Math.min(4,splashAcc+WX.i*WX.i*46*dt);
    while(splashAcc>=1 && SPLASH.length<70){
      splashAcc-=1;
      SPLASH.push({x:Math.random()*VW, y:hz+Math.random()*Math.max(1,VH-hz),
                   t:0, life:0.28+Math.random()*0.2});
    }
  }
  for(let i=SPLASH.length-1;i>=0;i--){
    SPLASH[i].t+=dt;
    if(SPLASH[i].t>=SPLASH[i].life) SPLASH.splice(i,1);
  }
}
/* the wet ground, the rain itself and the lightning, all in screen space */
function drawWeather(){
  if(WX.i<0.01 && WX.flash<=0) return;
  const hz=horizonY();
  ctx.save();
  if(WX.i>0.01){
    /* the ground goes dark and reflective */
    const g=ctx.createLinearGradient(0,hz,0,VH);
    g.addColorStop(0,'rgba(38,52,64,'+(0.30*WX.i)+')');
    g.addColorStop(1,'rgba(24,36,48,'+(0.16*WX.i)+')');
    ctx.fillStyle=g; ctx.fillRect(0,hz,VW,VH-hz);
    /* a haze of falling water in front of the far distance */
    ctx.fillStyle='rgba(176,196,212,'+(0.13*WX.i)+')';
    ctx.fillRect(0,0,VW,VH);

    for(const s of SPLASH){
      const u=s.t/s.life;
      ctx.globalAlpha=(1-u)*0.5*WX.i;
      ctx.strokeStyle='#DCEAF2'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.ellipse(s.x,s.y,2+u*8,(2+u*8)*0.36,0,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;

    ctx.strokeStyle='#CFE2EE'; ctx.lineCap='round';
    for(const d of RAIN){
      ctx.globalAlpha=d.a*WX.i;
      ctx.lineWidth=d.w;
      ctx.beginPath();
      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x-d.len*0.30,d.y-d.len);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(WX.flash>0){
    if(WX.bolt&&WX.flash>0.72){
      ctx.strokeStyle='rgba(232,244,255,.95)'; ctx.lineWidth=3.4;
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(WX.bolt[0][0],WX.bolt[0][1]);
      for(let i=1;i<WX.bolt.length;i++) ctx.lineTo(WX.bolt[i][0],WX.bolt[i][1]);
      ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle='rgba(160,200,255,.5)'; ctx.lineWidth=11;
      ctx.stroke();
      ctx.globalCompositeOperation='source-over';
    }
    ctx.fillStyle='rgba(226,240,255,'+(WX.flash*WX.flash*0.42)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  ctx.restore();
}
/* The horizon is a real place in the world, not a line pinned to the screen.
   Anchoring it to a depth far behind the property means the hills, the town and
   the grass all move and scale together when you zoom or pan — pinning it was
   what made the backdrop shear away from the yard. */
/* measured off the BACK corner of the yard, not off the house — the house moved
   round to the side and would have dragged the horizon forward with it */
const HZ_DEPTH=()=>{ const b=yardB(); return (b.x0+b.y0)-7.6; };
function depthY(K){ return (K*TH/2 - cam.y)*cam.z + VH*0.52; }
function horizonY(){ return depthY(HZ_DEPTH()); }

function drawSky(){
  const hz=horizonY();
  if(hz<4) return;                    /* zoomed right in: no sky in shot */
  const z=cam.z;
  const g=ctx.createLinearGradient(0,0,0,hz*1.5);
  g.addColorStop(0,rgb(SUN.sky[0]));
  g.addColorStop(0.62,rgb(SUN.sky[1]));
  g.addColorStop(1,rgb(SUN.sky[2]));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,hz+2);

  /* stars fade in as the sky goes over */
  if(SUN.night>0.05){
    ctx.save(); ctx.globalAlpha=SUN.night;
    for(let i=0;i<70;i++){
      const x=hash(i*17)*VW, y=hash(i*31)*hz*0.92;
      const tw=0.35+0.65*Math.abs(Math.sin(T*(0.6+hash(i*7))+i));
      ctx.globalAlpha=SUN.night*tw*(0.35+hash(i*11)*0.65);
      ctx.fillStyle='#FFFDF0';
      ctx.beginPath(); ctx.arc(x,y,hash(i*13)*1.3+0.6,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  /* the sun or the moon, tracking the real hour across the sky */
  const day=(SUN.h-6)/12;                        /* 0 at 06:00, 1 at 18:00 */
  const up=SUN.alt>-0.02;
  const p=up?day:((SUN.h<6?SUN.h+6:SUN.h-18)/12);
  const bx=VW*(0.08+0.84*clamp(p,0,1));
  const by=hz*0.92-Math.sin(clamp(p,0,1)*Math.PI)*hz*0.72;
  ctx.save();
  ctx.globalAlpha=1-WX.i*0.94;         /* cloud closes over the sun as it rains */
  if(up){
    const gr=ctx.createRadialGradient(bx,by,2,bx,by,86);
    gr.addColorStop(0,'rgba(255,246,196,.95)'); gr.addColorStop(0.25,'rgba(255,236,150,.42)');
    gr.addColorStop(1,'rgba(255,230,140,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(bx,by,86,0,TAU); ctx.fill();
    ctx.fillStyle='#FFF7CF'; ctx.beginPath(); ctx.arc(bx,by,27,0,TAU); ctx.fill();
  } else {
    const gr=ctx.createRadialGradient(bx,by,2,bx,by,64);
    gr.addColorStop(0,'rgba(226,238,255,.55)'); gr.addColorStop(1,'rgba(200,220,255,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(bx,by,64,0,TAU); ctx.fill();
    ctx.fillStyle='#E8EEFA'; ctx.beginPath(); ctx.arc(bx,by,20,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(190,202,224,.75)';
    ctx.beginPath(); ctx.arc(bx-6,by-4,4,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+6,by+5,3,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+2,by-8,2.4,0,TAU); ctx.fill();
  }
  ctx.restore();

  /* three ridges of hills, paler the further back they sit */
  const base=mix3(SUN.sky[2],[96,150,104],0.55);
  for(let L=0;L<3;L++){
    const amp=(16+L*13)*z, y0=hz-(6+L*16)*z;
    const col=mix3(SUN.sky[2],mix3(base,[52,104,64],L*0.4),0.35+L*0.22);
    ctx.fillStyle=rgb(col);
    ctx.beginPath(); ctx.moveTo(0,hz+4);
    for(let x=0;x<=VW;x+=18){
      const n=Math.sin(x*0.006+L*2.3)*amp+Math.sin(x*0.017+L*4.1)*amp*0.45;
      ctx.lineTo(x,y0-n);
    }
    ctx.lineTo(VW,hz+4); ctx.closePath(); ctx.fill();
  }
}

/* Rooftops of the street beyond the yard. They parallax with the camera and are
   veiled in haze, so the horizon reads as distance instead of a strip pasted
   across the top of the screen. */
function drawTown(){
  const hz=horizonY();
  if(hz<4) return;
  const z=cam.z;
  /* the street sits on a line of constant depth, so it stays horizontal on
     screen while still living in world space */
  const K=HZ_DEPTH()+0.4;   /* just behind the horizon, so roofs peek over it */
  const rowY=depthY(K);
  ctx.save();
  for(let i=-34;i<=34;i++){
    const gx=K/2+i*1.5;
    const wx=(2*gx-K)*TW/2;
    const sx=(wx-cam.x)*z+VW/2;
    if(sx<-240*z||sx>VW+240*z) continue;
    const w=(52+hash(i*7+3)*46)*z, h=(30+hash(i*13+5)*44)*z;
    const y=rowY+(8+hash(i*19+7)*12)*z;
    const wall=mix3([236,222,196],SUN.tint,0.55);
    ctx.fillStyle=rgb(mix3(wall,[120,132,164],SUN.night*0.6));
    ctx.fillRect(sx,y-h,w,h);
    ctx.fillStyle=rgb(mix3([176,84,64],[70,80,120],SUN.night*0.6));
    ctx.beginPath(); ctx.moveTo(sx-7*z,y-h); ctx.lineTo(sx+w/2,y-h-(20+hash(i*3+1)*12)*z);
    ctx.lineTo(sx+w+7*z,y-h); ctx.closePath(); ctx.fill();
    if(SUN.lit){
      ctx.fillStyle='rgba(255,214,120,'+(0.35+0.5*SUN.night)+')';
      for(let k=0;k<2;k++){
        if(hash(i*11+k+2)<0.35) continue;
        ctx.fillRect(sx+9*z+k*(w*0.45),y-h*0.62,w*0.22,h*0.26);
      }
    }
  }
  /* a treeline hiding the join between the town and the grass */
  const tY=depthY(K+1.1);
  ctx.fillStyle=rgb(mix3([58,116,58],SUN.tint,0.5));
  ctx.beginPath(); ctx.moveTo(-90,tY+120*z);
  for(let x=-90;x<=VW+90;x+=14){
    const wx=(x-VW/2)/z+cam.x;
    const n=(Math.sin(wx*0.017)*7+Math.sin(wx*0.007+1.7)*11+hash((wx*0.4)|0)*7)*z;
    ctx.lineTo(x,tY+14*z-n);
  }
  ctx.lineTo(VW+90,tY+120*z); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* atmospheric haze over the seam — the hard line was the "cut" */
  const hazeCol=SUN.sky[2];
  const hzA=hz-46*cam.z, hzB=hz+82*cam.z;
  const g=ctx.createLinearGradient(0,hzA,0,hzB);
  g.addColorStop(0,'rgba('+(hazeCol[0]|0)+','+(hazeCol[1]|0)+','+(hazeCol[2]|0)+',.55)');
  g.addColorStop(0.42,'rgba('+(hazeCol[0]|0)+','+(hazeCol[1]|0)+','+(hazeCol[2]|0)+',.20)');
  g.addColorStop(1,'rgba('+(hazeCol[0]|0)+','+(hazeCol[1]|0)+','+(hazeCol[2]|0)+',0)');
  ctx.fillStyle=g; ctx.fillRect(0,hzA,VW,hzB-hzA);
}

/* The land runs from the horizon to the bottom of the screen. The yard is a
   fenced piece of it, not an island hanging in the sky. */
function drawGround(){
  const hz=horizonY();
  const far=mix3([132,186,110],SUN.sky[2],0.42);
  const near=[95,168,66];
  const g=ctx.createLinearGradient(0,hz,0,VH);
  g.addColorStop(0,rgb(mix3(far,SUN.tint,0.35)));
  g.addColorStop(0.28,rgb(mix3([104,178,74],SUN.tint,0.2)));
  g.addColorStop(1,rgb(near));
  ctx.fillStyle=g; ctx.fillRect(0,hz,VW,VH-hz);

  ctx.save();
  ctx.beginPath(); ctx.rect(0,hz,VW,VH-hz); ctx.clip();

  /* Mown stripes only inside the fence. Tiling every visible cell cost
     thousands of path fills a frame and dragged a grown farm down to 20fps. */
  const YB=yardB();
  const gx0=Math.floor(YB.x0), gx1=Math.ceil(YB.x1);
  const gy0=Math.floor(YB.y0), gy1=Math.ceil(YB.y1);
  ctx.fillStyle='rgba(64,142,40,.26)';
  for(let gx=gx0;gx<gx1;gx++) for(let gy=gy0;gy<gy1;gy++){
    if(((gx+gy)&1)===0) continue;
    const p=iso(gx+0.5,gy+0.5), s=w2s(p.x,p.y);
    if(s.y<hz-40||s.y>VH+40||s.x<-TW||s.x>VW+TW) continue;
    diamond(ctx,s.x,s.y,TW*cam.z,TH*cam.z); ctx.fill();
  }
  /* wildflowers and tufts, seeded so they never crawl */
  for(let i=0;i<190;i++){
    const gx=CX-14+hash(i*13)*28, gy=CY-14+hash(i*29+5)*28;
    const p=iso(gx,gy), s=w2s(p.x,p.y);
    if(s.y<hz||s.y>VH+20) continue;
    const r=hash(i*7);
    ctx.fillStyle=r>0.86?'#FFF3B0':r>0.76?'#F4A9C0':'rgba(56,124,38,.5)';
    const w=(r>0.76?3.6:6.5)*cam.z;
    ctx.beginPath(); ctx.ellipse(s.x,s.y,w,w*0.7,0,0,TAU); ctx.fill();
  }
  /* cloud shadows drifting across the grass */
  if(SUN.alt>0.05){
    for(const cl of clouds){
      const s=w2s(cl.x,cl.y+520);
      if(s.y<hz-60) continue;
      ctx.fillStyle='rgba(28,64,20,'+(0.10*clamp(SUN.alt*2,0,1))+')';
      ctx.beginPath(); ctx.ellipse(s.x,s.y,160*cl.s*cam.z,60*cl.s*cam.z,0,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}
/* the pavement the passers-by use, laid on a line of constant depth so it runs
   flat across the front of the property */
function drawStreet(){
  const K=streetK(), z=cam.z;
  const y=depthY(K), hz=horizonY();
  if(y<hz-40||y>VH+120) return;
  const w=26*z;
  ctx.save();
  ctx.fillStyle=rgb(mix3([198,190,172],SUN.tint,0.55));
  ctx.fillRect(0,y-w/2,VW,w);
  ctx.fillStyle=rgb(mix3([176,168,150],SUN.tint,0.55));
  ctx.fillRect(0,y+w/2-3*z,VW,3*z);
  ctx.strokeStyle='rgba(120,112,96,.45)'; ctx.lineWidth=1.4*z;
  const step=52*z;
  const off=((-cam.x*z)%step+step)%step;
  for(let x=off-step;x<VW+step;x+=step){
    ctx.beginPath(); ctx.moveTo(x,y-w/2); ctx.lineTo(x,y+w/2); ctx.stroke();
  }
  ctx.restore();
}

/* -------------------------------------------------------------------- road
   A pavement with nobody driving past it is a garden path. The road runs in
   front of the kerb, nearest the camera, and after dark the headlights sweep
   across the grass and the fence — which is the moment the yard stops looking
   like a diagram and starts looking like somewhere. */
function roadK(){ return streetK()+2.7; }
function drawRoad(){
  const K=roadK(), z=cam.z;
  const y=depthY(K), hz=horizonY();
  if(y<hz-60||y>VH+200) return;
  const w=52*z;
  ctx.save();
  /* kerb */
  ctx.fillStyle=rgb(mix3([166,160,146],SUN.tint,0.55));
  ctx.fillRect(0,y-w/2-5*z,VW,6*z);
  /* asphalt */
  const g=ctx.createLinearGradient(0,y-w/2,0,y+w/2);
  g.addColorStop(0,rgb(mix3([84,84,88],SUN.tint,0.42)));
  g.addColorStop(0.5,rgb(mix3([98,98,102],SUN.tint,0.42)));
  g.addColorStop(1,rgb(mix3([76,76,80],SUN.tint,0.42)));
  ctx.fillStyle=g; ctx.fillRect(0,y-w/2,VW,w);
  /* centre line */
  ctx.fillStyle=rgb(mix3([228,222,190],SUN.tint,0.35));
  const step=64*z, dash=30*z;
  const off=((-cam.x*z)%step+step)%step;
  for(let x=off-step;x<VW+step;x+=step) ctx.fillRect(x,y-1.6*z,dash,3.2*z);
  ctx.restore();
}

const CARS=[];
let carT=3;
const CAR_KINDS=[
  {k:'car',   w:96, h:32, body:['#C6483C','#3E6EA8','#E8B23C','#4E9E6A','#E8E4DC','#2E2E36'], sp:3.4},
  {k:'car',   w:92, h:31, body:['#7A5AA8','#C8763C','#3F9AA8','#B8BCC4'], sp:3.7},
  {k:'van',   w:116,h:43, body:['#F2F0EA','#E0552F','#3E6EA8'], sp:2.9},
  {k:'truck', w:136,h:48, body:['#5E7C9A','#8A6A4A'], sp:2.5},
  {k:'moped', w:58, h:25, body:['#E8574A','#2E7C74','#2E2E36'], sp:4.2}
];
function trafficGap(){
  const h=SUN.h;
  if(h<5.5) return 14+Math.random()*26;
  if(h<7.5) return 7+Math.random()*10;
  if(h<10)  return 2.2+Math.random()*4;
  if(h<16)  return 3+Math.random()*6;
  if(h<20)  return 2+Math.random()*4.5;
  if(h<23)  return 7+Math.random()*12;
  return 12+Math.random()*22;
}
function spawnCar(){
  const K=roadK(), dir=Math.random()<0.5?1:-1;
  const t=CAR_KINDS[(Math.random()*CAR_KINDS.length)|0];
  const span=clamp(3+(VW*0.5)/(TW*Math.max(0.22,cam.z)),5,20);
  CARS.push({...t, dir, K, span,
    gx:K/2+(dir>0?-span:span),
    lane:dir>0?0.42:-0.42,                 /* keep right, like everyone else */
    col:t.body[(Math.random()*t.body.length)|0],
    sp:t.sp*(0.86+Math.random()*0.3), wob:Math.random()*TAU});
}
function carsUpdate(dt){
  carT-=dt;
  if(carT<=0){ carT=trafficGap(); if(CARS.length<4) spawnCar(); }
  const K=roadK();
  for(let i=CARS.length-1;i>=0;i--){
    const v=CARS[i];
    v.K=K;
    v.gx+=v.dir*v.sp*dt*0.92;
    if(v.dir>0 ? v.gx>K/2+v.span : v.gx<K/2-v.span) CARS.splice(i,1);
  }
}
function drawVehicle(c,z,v){
  const W=v.w*z, H=v.h*z, dir=v.dir;
  c.save();
  c.scale(dir>0?1:-1,1);
  /* headlight wash on the road ahead — the whole point of the exercise */
  if(SUN.lit||WX.i>0.45){
    c.save();
    c.globalCompositeOperation='lighter';
    const beam=c.createLinearGradient(W*0.5,0,W*0.5+150*z,0);
    beam.addColorStop(0,'rgba(255,238,190,'+(0.5*(SUN.night||WX.i))+')');
    beam.addColorStop(1,'rgba(255,238,190,0)');
    c.fillStyle=beam;
    c.beginPath();
    c.moveTo(W*0.48,-H*0.5);
    c.lineTo(W*0.5+160*z,-H*1.5);
    c.lineTo(W*0.5+160*z,H*1.1);
    c.lineTo(W*0.48,-H*0.1);
    c.closePath(); c.fill();
    c.restore();
  }
  c.fillStyle='rgba(0,0,0,.30)';
  c.beginPath(); c.ellipse(0,0,W*0.52,H*0.24,0,0,TAU); c.fill();
  const R=H*0.34;
  if(v.k==='moped'){
    c.strokeStyle='#2A2A30'; c.lineWidth=2.4*z;
    for(const x of [-W*0.3,W*0.32]){ c.beginPath(); c.arc(x,-R,R,0,TAU); c.stroke(); }
    c.fillStyle=v.col;
    roundPoly(c,[[-W*0.36,-H*0.9],[W*0.24,-H*1.0],[W*0.3,-H*0.4],[-W*0.3,-H*0.35]],4*z); c.fill();
    c.fillStyle='#2E2E36';
    roundPoly(c,[[-W*0.34,-H*1.25],[-W*0.06,-H*1.25],[-W*0.06,-H*0.95],[-W*0.34,-H*0.95]],3*z); c.fill();
    /* rider */
    c.fillStyle='#3A4048';
    roundPoly(c,[[-W*0.22,-H*2.5],[W*0.02,-H*2.5],[W*0.06,-H*1.1],[-W*0.2,-H*1.1]],5*z); c.fill();
    c.fillStyle='#E8C9A0';
    c.beginPath(); c.arc(W*0.02,-H*2.85,H*0.32,0,TAU); c.fill();
    c.fillStyle='#D8452F';
    c.beginPath(); c.ellipse(W*0.02,-H*2.98,H*0.38,H*0.28,0,Math.PI,TAU); c.fill();
  } else {
    /* wheels */
    c.fillStyle='#22242A';
    for(const x of [-W*0.30,W*0.30]){ c.beginPath(); c.arc(x,-R,R,0,TAU); c.fill(); }
    c.fillStyle='#6E727A';
    for(const x of [-W*0.30,W*0.30]){ c.beginPath(); c.arc(x,-R,R*0.42,0,TAU); c.fill(); }
    /* body */
    const g=c.createLinearGradient(0,-H*1.7,0,-R*0.4);
    g.addColorStop(0,shade(v.col,16)); g.addColorStop(0.55,v.col); g.addColorStop(1,shade(v.col,-18));
    c.fillStyle=g;
    if(v.k==='car'){
      roundPoly(c,[[-W*0.5,-H*0.55],[-W*0.42,-H*1.05],[-W*0.14,-H*1.62],[W*0.16,-H*1.62],
                   [W*0.42,-H*1.02],[W*0.5,-H*0.5],[W*0.46,-R*0.5],[-W*0.46,-R*0.5]],5*z); c.fill();
      c.fillStyle='#B7D6E4';
      roundPoly(c,[[-W*0.30,-H*1.10],[-W*0.12,-H*1.52],[W*0.10,-H*1.52],[W*0.28,-H*1.08]],3*z); c.fill();
      c.fillStyle='rgba(255,255,255,.35)';
      roundPoly(c,[[-W*0.28,-H*1.10],[-W*0.14,-H*1.46],[-W*0.02,-H*1.46],[-W*0.14,-H*1.08]],2*z); c.fill();
    } else {
      const top=v.k==='truck'?-H*1.9:-H*1.7;
      roundPoly(c,[[-W*0.5,top],[W*0.5,top],[W*0.5,-R*0.5],[-W*0.5,-R*0.5]],4*z); c.fill();
      c.fillStyle='#B7D6E4';
      roundPoly(c,[[W*0.18,top+H*0.22],[W*0.44,top+H*0.22],[W*0.44,top+H*0.8],[W*0.18,top+H*0.8]],2.4*z); c.fill();
      c.fillStyle='rgba(0,0,0,.10)';
      roundPoly(c,[[-W*0.46,top+H*0.3],[W*0.08,top+H*0.3],[W*0.08,top+H*1.1],[-W*0.46,top+H*1.1]],3*z); c.fill();
    }
    /* lamps */
    c.fillStyle=(SUN.lit||WX.i>0.45)?'#FFF0BE':'#E8E4D6';
    roundPoly(c,[[W*0.44,-H*0.95],[W*0.5,-H*0.95],[W*0.5,-H*0.65],[W*0.44,-H*0.65]],2*z); c.fill();
    c.fillStyle=(SUN.lit||WX.i>0.45)?'#E8574A':'#B4443A';
    roundPoly(c,[[-W*0.5,-H*0.95],[-W*0.44,-H*0.95],[-W*0.44,-H*0.68],[-W*0.5,-H*0.68]],2*z); c.fill();
  }
  c.restore();
}
function drawCars(){
  const K=roadK();
  for(const v of CARS){
    const gy=K+v.lane-v.gx;
    const p=iso(v.gx,gy), s=w2s(p.x,p.y);
    if(s.x<-260||s.x>VW+260) continue;
    ctx.save(); ctx.translate(s.x,s.y); drawVehicle(ctx,cam.z,v); ctx.restore();
  }
}
/* fence runs the full perimeter now, because there is land on both sides */
function drawFence(){
  const z=cam.z, hz=horizonY();
  const b=fenceB();
  const runs=[[[b.x0,b.y0],[b.x1,b.y0]],[[b.x1,b.y0],[b.x1,b.y1]],[[b.x1,b.y1],[b.x0,b.y1]],[[b.x0,b.y1],[b.x0,b.y0]]];
  const segs=[];
  for(const [A,B] of runs){
    const n=Math.max(2,Math.round(Math.hypot(B[0]-A[0],B[1]-A[1])/0.8));
    for(let i=0;i<=n;i++){
      const t=i/n, gx=lerp(A[0],B[0],t), gy=lerp(A[1],B[1],t);
      segs.push({gx,gy,d:gx+gy});
    }
  }
  segs.sort((p,q)=>p.d-q.d);
  /* the fence lays its own stripe across the grass, leaning with the sun */
  {
    const sv=shadowVec();
    if(sv.a>0.02){
      const ox=sv.ux*34*z, oy=sv.uy*34*z;
      ctx.save();
      ctx.globalAlpha=sv.a*0.85; ctx.strokeStyle='#12340C';
      ctx.lineWidth=7*z; ctx.lineCap='round';
      for(const [A,B] of runs){
        const a=iso(A[0],A[1]), b=iso(B[0],B[1]);
        const sa=w2s(a.x,a.y), sb=w2s(b.x,b.y);
        if(sa.y<hz&&sb.y<hz) continue;
        ctx.beginPath(); ctx.moveTo(sa.x+ox,sa.y+oy); ctx.lineTo(sb.x+ox,sb.y+oy); ctx.stroke();
      }
      ctx.restore();
    }
  }
  const woodL=rgb(mix3([210,160,99],SUN.tint,0.55));
  const woodD=rgb(mix3([168,122,64],SUN.tint,0.55));
  for(const [A,B] of runs){
    const a=iso(A[0],A[1]), b=iso(B[0],B[1]);
    const sa=w2s(a.x,a.y), sb=w2s(b.x,b.y);
    if(sa.y<hz&&sb.y<hz) continue;
    ctx.strokeStyle=woodL; ctx.lineWidth=5*z; ctx.lineCap='round';
    for(const h of [0.40,0.74]){
      ctx.beginPath(); ctx.moveTo(sa.x,sa.y-34*z*h); ctx.lineTo(sb.x,sb.y-34*z*h); ctx.stroke();
    }
  }
  for(const sg of segs){
    const p=iso(sg.gx,sg.gy), s=w2s(p.x,p.y);
    if(s.y<hz-10) continue;
    post(ctx,s.x,s.y,34*z,9*z,woodL,woodD);
  }
}
/* the neighbours' places, so the yard has a street to belong to */
function drawNeighbours(){
  const hz=horizonY(), z=cam.z;
  /* ring the property from outside, so a grown yard never swallows a neighbour */
  const b=yardB(), m=3.4;
  const spots=[
    [b.x0-m,b.y0-m*0.6,0],[CX-1,b.y0-m*1.5,1],[b.x1+m*0.7,b.y0-m,2],
    [b.x1+m,CY-1.5,3],[b.x1+m*1.1,b.y1+m*0.5,4],
    [CX+1,b.y1+m*1.3,5],[b.x0-m*0.9,b.y1+m*0.7,6],[b.x0-m*1.2,CY+1.0,7],
    [b.x0-m*1.8,b.y0-m*1.6,8],[b.x1+m*1.9,b.y1+m*1.4,9]
  ];
  /* the house lives out on the left now, so drop any neighbour it would stand
     inside of */
  const hh=houseAt(), clear=hh.A+hh.B+2.2, SK=streetK();
  const out=[];
  for(const [gx,gy,sd] of spots){
    if(Math.hypot(gx-hh.gx,gy-hh.gy)<clear) continue;
    if(gx+gy>SK-2.2) continue;                    /* nobody builds on the pavement or in the road */
    out.push({gx,gy,sd,d:gx+gy});
  }
  out.sort((a,b)=>a.d-b.d);
  for(const o of out){
    const p=iso(o.gx,o.gy), s=w2s(p.x,p.y);
    if(s.y<hz-30||s.y>VH+220||s.x<-260||s.x>VW+260) continue;
    ctx.save(); ctx.translate(s.x,s.y);
    if(o.sd%3===2){ treeProp(ctx,z*1.1,o.sd*7); }
    else {
      /* a scrap of garden so the neighbours stand on something rather than
         floating on bare grass */
      ctx.fillStyle=rgb(mix3([104,168,74],SUN.tint,0.5));
      ctx.beginPath(); ctx.ellipse(0,6*z,86*z,32*z,0,0,TAU); ctx.fill();
      ctx.fillStyle=rgb(mix3([196,170,124],SUN.tint,0.5));
      ctx.beginPath(); ctx.ellipse(0,26*z,26*z,10*z,0,0,TAU); ctx.fill();
      ctx.fillStyle=rgb(mix3([62,132,54],SUN.tint,0.5));
      for(let k=0;k<5;k++){
        const a=Math.PI+(k/4)*Math.PI;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*70*z, 8*z+Math.sin(a)*16*z, (9+hash(o.sd*5+k)*5)*z, 0, TAU);
        ctx.fill();
      }
      const w=118*z, h=(66+hash(o.sd*5)*30)*z;
      ctx.fillStyle='rgba(0,0,0,.18)'; diamond(ctx,0,0,w*1.15,h*0.42); ctx.fill();
      const wall=rgb(mix3(mix3([240,226,198],[176,150,116],hash(o.sd*3)),SUN.tint,0.55));
      ctx.fillStyle=wall; roundPoly(ctx,[[-w/2,-h],[w/2,-h],[w/2,0],[-w/2,0]],5*z); ctx.fill();
      ctx.fillStyle=rgb(mix3([182,88,66],SUN.tint,0.55));
      roundPoly(ctx,[[-w*0.6,-h],[0,-h-40*z],[w*0.6,-h]],5*z); ctx.fill();
      ctx.fillStyle=SUN.lit?'rgba(255,216,124,.95)':rgb(mix3([148,200,222],SUN.tint,0.5));
      ctx.fillRect(-w*0.30,-h*0.66,w*0.22,h*0.30);
      ctx.fillRect(w*0.08,-h*0.66,w*0.22,h*0.30);
      ctx.fillStyle=rgb(mix3([150,92,54],SUN.tint,0.55));
      roundPoly(ctx,[[-w*0.10,-h*0.5],[w*0.10,-h*0.5],[w*0.10,0],[-w*0.10,0]],3*z); ctx.fill();
    }
    ctx.restore();
  }
}
/* warm pools under the windows and lamps once it is dark */
function drawNightLights(){
  if(SUN.night<0.12) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const put=(gx,gy,r,col,a)=>{
    const p=iso(gx,gy), s=w2s(p.x,p.y);
    const rr=r*cam.z;
    const g=ctx.createRadialGradient(s.x,s.y-rr*0.35,2,s.x,s.y-rr*0.35,rr);
    g.addColorStop(0,'rgba('+col+','+(a*SUN.night)+')');
    g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y-rr*0.35,rr,0,TAU); ctx.fill();
  };
  const _h=houseAt();
  put(_h.gx-_h.A*0.5,_h.gy-_h.B*0.5,230,"255,206,124",0.46);
  put(12.4,7.2,150,'255,196,110',0.40);
  put(12.2,9.3,90,'255,214,150',0.26);
  ctx.restore();
}
function drawPlot(p){
  const s=tileTop(p.gx,p.gy);
  const z=cam.z, w=TW*z*0.92, h=TH*z*0.92;
  if(p.i>=S.owned){
    /* only the next plot for sale is marked; outlining all forty-nine turned the
       whole yard into dashed noise */
    if(p.i!==S.owned) return;
    const pl=0.5+0.5*Math.sin(T*2.2);
    ctx.globalAlpha=0.30+0.22*pl;
    ctx.fillStyle='#FFF6E4'; diamond(ctx,s.x,s.y,w,h); ctx.fill();
    ctx.globalAlpha=0.9;
    ctx.setLineDash([8*z,6*z]); ctx.lineWidth=3*z; ctx.strokeStyle='#FFF6E4';
    diamond(ctx,s.x,s.y,w,h); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=1;
    ctx.fillStyle='#FFF6E4'; ctx.font='900 '+Math.round(30*z)+'px "Segoe UI",Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=5*z; ctx.strokeStyle='rgba(40,26,12,.5)';
    ctx.strokeText('+',s.x,s.y-2*z); ctx.fillText('+',s.x,s.y-2*z);
    return;
  }
  ctx.fillStyle='#5C3B22'; diamond(ctx,s.x,s.y+4*z,w,h); ctx.fill();
  ctx.fillStyle=p.sid?(p.wet?'#6B4527':'#8A5A38'):'#8A5A38';
  diamond(ctx,s.x,s.y,w,h); ctx.fill();
  ctx.strokeStyle='#A8703F'; ctx.lineWidth=1.6*z;
  for(let i=1;i<4;i++){
    const t=i/4;
    ctx.beginPath();
    ctx.moveTo(s.x-w/2+w/2*t, s.y-h/2*t);
    ctx.lineTo(s.x+w/2*t, s.y+h/2-h/2*t);
    ctx.stroke();
  }
  ctx.lineWidth=2.6*z; ctx.strokeStyle='#6F4626';
  diamond(ctx,s.x,s.y,w,h); ctx.stroke();
}
function drawPlant2(p){
  if(!p.sid || p.i>=S.owned) return;
  const st=BYID[p.sid]; if(!st) return;
  const s=tileTop(p.gx,p.gy);
  /* during the catch-up sweep the crop is drawn where it was, then grows in */
  const g=clamp((now()+lapseOffset()-p.at)/Math.max(1,p.dur),0,1);
  const bk=Math.min(BUCKETS-1,Math.floor(g*BUCKETS));
  const spr=sprite(st,bk);
  const z=cam.z;
  /* squash-and-stretch whenever the plant crosses into a new growth stage */
  if(p.bk===undefined) p.bk=bk;
  if(bk!==p.bk){ p.bk=bk; p.pop=1; }
  p.pop=(p.pop||0)*Math.pow(0.0015,DT);
  const pop=p.pop||0;
  const sw=SPRW*z*PSCALE*(1-pop*0.12), sh=SPRH*z*PSCALE*(1+pop*0.22);
  const sway=windAt(p.gx,p.gy)*0.055*(0.4+0.6*g);
  const ready=g>=1;
  ctx.save();
  /* Stand the plant ON its soil tile. It used to be dropped ten pixels below
     the tile centre, which read as the crop sitting in front of its own plot —
     decorations were always anchored at the tile point, so the two disagreed. */
  ctx.translate(s.x,s.y);
  /* contact shadow grows with the plant and leans with the sun, so a whole
     field of them points the same way and turns together through the day */
  castShadow(ctx,(28+44*g),(12+18*g),(12+70*g),z);
  if(ready){
    /* one cached glow sprite, blitted — building a radial gradient per ripe
       plant per frame was one of the two things killing a full farm */
    const pl=0.5+0.5*Math.sin(T*2.6+p.i);
    const gs=glowSprite(), r=74*z;
    ctx.globalAlpha=0.30+0.14*pl;
    ctx.drawImage(gs,-r,-46*z-r,r*2,r*2);
    ctx.globalAlpha=1;
    ctx.translate(0,Math.sin(T*2.6+p.i)*2.2*z);
  }
  ctx.rotate(sway);
  ctx.drawImage(spr,-sw/2,-sh+14*z*PSCALE,sw,sh);   /* the baked origin sits 14 sprite-units up from the bottom */
  ctx.restore();
  if(ready&&z>0.55){
    for(let i=0;i<3;i++){
      const a=T*1.5+i*2.1+p.i, rr=(26+10*Math.sin(a*1.3))*z;
      const sx=s.x+Math.cos(a)*rr, sy=s.y-(50+18*Math.sin(a*0.8))*z;
      ctx.globalAlpha=0.55+0.45*Math.sin(a*2);
      ctx.fillStyle='#FFF2A8';
      ctx.beginPath(); ctx.arc(sx,sy,2.6*z,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
/* one radial glow, reused by every ripe plant */
let GLOW=null;
function glowSprite(){
  if(GLOW) return GLOW;
  const S=128, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,2,S/2,S/2,S/2);
  g.addColorStop(0,'rgba(255,240,150,1)'); g.addColorStop(1,'rgba(255,240,150,0)');
  x.fillStyle=g; x.beginPath(); x.arc(S/2,S/2,S/2,0,TAU); x.fill();
  GLOW=c; return c;
}
/* measureText per plant per frame was the other cost; widths are stable */
const TXTW=new Map();
function textW(txt,px){
  const k=txt+'|'+px;
  let w=TXTW.get(k);
  if(w===undefined){ w=ctx.measureText(txt).width; if(TXTW.size>400) TXTW.clear(); TXTW.set(k,w); }
  return w;
}
function bubble(sx,sy,txt,bg,fg,z){
  const px=Math.round(14*z);
  ctx.font='900 '+px+'px "Segoe UI",Arial,sans-serif';
  const w=Math.max(34*z, textW(txt,px)+20*z), h=24*z;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.18)';
  roundPoly(ctx,[[sx-w/2,sy-h+3*z],[sx+w/2,sy-h+3*z],[sx+w/2,sy+3*z],[sx-w/2,sy+3*z]],h/2); ctx.fill();
  ctx.fillStyle=bg;
  roundPoly(ctx,[[sx-w/2,sy-h],[sx+w/2,sy-h],[sx+w/2,sy],[sx-w/2,sy]],h/2); ctx.fill();
  ctx.lineWidth=2.2*z; ctx.strokeStyle='rgba(0,0,0,.22)';
  roundPoly(ctx,[[sx-w/2,sy-h],[sx+w/2,sy-h],[sx+w/2,sy],[sx-w/2,sy]],h/2); ctx.stroke();
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,sx,sy-h/2+0.5*z);
  ctx.restore();
}
/* drawn glyphs rather than emoji: emoji render at wildly different weights and
   colours across phones, and at this size a 💧 was reading as a tick */
function bubbleShape(sx,sy,bg,z,paint){
  const w=30*z, h=24*z;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.18)';
  roundPoly(ctx,[[sx-w/2,sy-h+3*z],[sx+w/2,sy-h+3*z],[sx+w/2,sy+3*z],[sx-w/2,sy+3*z]],h/2); ctx.fill();
  ctx.fillStyle=bg;
  roundPoly(ctx,[[sx-w/2,sy-h],[sx+w/2,sy-h],[sx+w/2,sy],[sx-w/2,sy]],h/2); ctx.fill();
  ctx.lineWidth=2.2*z; ctx.strokeStyle='rgba(0,0,0,.22)';
  roundPoly(ctx,[[sx-w/2,sy-h],[sx+w/2,sy-h],[sx+w/2,sy],[sx-w/2,sy]],h/2); ctx.stroke();
  paint(ctx,sx,sy-h/2);
  ctx.restore();
}
function iconCheck(c,x,y,r,col){
  c.strokeStyle=col; c.lineWidth=r*0.46; c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(x-r*0.6,y+r*0.02); c.lineTo(x-r*0.14,y+r*0.5); c.lineTo(x+r*0.62,y-r*0.5);
  c.stroke();
}
function iconDrop(c,x,y,r,col){
  c.fillStyle=col; c.beginPath();
  c.moveTo(x,y-r*1.05);
  c.bezierCurveTo(x+r*0.95,y-r*0.05, x+r*0.72,y+r*0.85, x,y+r*0.85);
  c.bezierCurveTo(x-r*0.72,y+r*0.85, x-r*0.95,y-r*0.05, x,y-r*1.05);
  c.closePath(); c.fill();
}
function drawBadge(p){
  if(!p.sid || p.i>=S.owned) return;
  const s=tileTop(p.gx,p.gy);
  const z=cam.z, left=p.at+p.dur-now();
  if(z<0.5) return;
  const y=s.y-118*z;
  if(left<=0) bubbleShape(s.x,y,'#7BD25E',z,(c,x,yy)=>iconCheck(c,x,yy,7*z,'#123A0B'));
  else if(!p.wet && S.ups.sprk===0) bubbleShape(s.x,y,'#8FDCF5',z,(c,x,yy)=>iconDrop(c,x,yy,6.5*z,'#0E4A63'));
  else bubble(s.x,y,clockShort(left),'rgba(255,247,228,.95)','#5A4227',z);
}

function scene(dt){
  wxUpdate(dt);
  updateSun();
  drawSky();
  /* clouds drift across the sky band, tinted by the hour */
  const hz=horizonY();
  for(const cl of clouds){
    cl.x+=cl.v*dt;
    if(cl.x>2600) cl.x=-700;
    const s=w2s(cl.x,cl.y);
    const cy=clamp(s.y,20,hz-14);
    ctx.save();
    ctx.globalAlpha=0.55+0.4*(1-SUN.night);
    ctx.fillStyle=rgb(mix3([255,255,255],mix3([255,206,168],[70,86,132],SUN.night),
      SUN.gold*0.6+SUN.night*0.75));
    const z=cl.s*Math.max(0.5,cam.z);
    for(const [ox,oy,r] of [[0,0,46],[-42,10,32],[44,8,34],[-16,-18,32],[20,-16,28]]){
      ctx.beginPath(); ctx.arc(s.x+ox*z,cy+oy*z,r*z,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  drawBirds();
  drawTown();
  drawGround();
  drawStreet();
  drawRoad();
  drawNeighbours();

  const items=[];
  const push=(gx,gy,fn)=>items.push({d:gx+gy,gx,gy,fn});
  const tree=(gx,gy,seed)=>push(gx,gy,(s,z)=>{
    ctx.save(); ctx.translate(s.x,s.y);
    ctx.rotate(windAt(gx,gy)*0.016);
    treeProp(ctx,z,seed); ctx.restore();
  });
  const HH=houseAt();
  buildUpdate(dt);
  push(HH.gx,HH.gy,(s,z)=>{
    ctx.save(); ctx.translate(s.x,s.y); houseProp(ctx,z,T); ctx.restore();
    /* dust kicked up at the foot of the works */
    if(BLD.t>=0.12&&BLD.t<BLD.dur*0.82&&Math.random()<0.5)
      puff(s.x+(Math.random()-0.5)*90*z, s.y-6*z, '#C9B896', 1);
  });
  const PS=propSpots(), YB2=yardB();
  push(PS.tower[0],PS.tower[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); towerProp(ctx,z); ctx.restore(); });
  push(PS.rack[0],PS.rack[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); rackProp(ctx,z); ctx.restore(); });
  push(PS.stall[0],PS.stall[1],(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); stallProp(ctx,z); ctx.restore(); });
  /* the left-front tree moved out of the way when the house came round here */
  tree(YB2.x0-2.6,YB2.y0-1.0,3); tree(CX-2.0,YB2.y1+3.4,11);
  tree(YB2.x1+3.4,YB2.y1-0.6,23); tree(CX+1.5,YB2.y0-3.4,41); tree(YB2.x1+2.4,YB2.y0-2.6,57);
  frediUpdate(dt);
  push(FRD.gx,FRD.gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y);
    fredi(ctx,z,T,{on:FRD.st==='walk',ph:FRD.ph,face:FRD.face,act:FRD.act}); ctx.restore(); });
  /* the nameplate, out front between the fence and the pavement */
  push(YB2.x1+1.2,YB2.y1+1.4,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); signProp(ctx,z,T); ctx.restore(); });
  /* A band of scrub in front of the property. Without it the bottom of the
     screen was flat empty grass with the dock sitting on it; now the view runs
     into foreground planting and the UI reads as being over a place. */
  for(let i=0;i<26;i++){
    const t=i/25;
    const gx=YB2.x0-2.5+t*(YB2.x1-YB2.x0+5)+ (hash(i*17)-0.5)*1.1;
    const gy=YB2.y1+1.4+hash(i*29)*2.6;
    const sd=i*13+7;
    push(gx,gy,(s,z)=>{
      ctx.save(); ctx.translate(s.x,s.y);
      ctx.rotate(windAt(gx,gy)*0.02);
      const k=(0.55+hash(sd)*0.7)*z;
      ctx.fillStyle='rgba(0,0,0,.16)';
      ctx.beginPath(); ctx.ellipse(0,0,26*k,10*k,0,0,TAU); ctx.fill();
      const dk=hash(sd*3)>0.5;
      ctx.fillStyle=dk?'#3C8A32':'#4E9E3A';
      for(let b=0;b<5;b++){
        const a=(b/5)*TAU+sd;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*11*k,-10*k+Math.sin(a)*5*k,(8+hash(sd+b)*4)*k,0,TAU);
        ctx.fill();
      }
      ctx.fillStyle=dk?'#5CB645':'#6CC44E';
      for(let b=0;b<3;b++){
        const a=(b/3)*TAU+sd*0.7;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*7*k,-14*k+Math.sin(a)*3*k,(6+hash(sd+b*5)*3)*k,0,TAU);
        ctx.fill();
      }
      ctx.restore();
    });
  }
  for(const d of decorPlacements())
    push(d.gx,d.gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); drawDecor(ctx,z,d.kind,d.seed); ctx.restore(); });
  hensUpdate();
  for(const h of HENS) push(h.gx,h.gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); drawHen(ctx,z,h); ctx.restore(); });
  walkersUpdate();
  for(const w of WALKERS){
    const gy=w.K+w.off-w.gx;   /* off is the weave: it walks them off the kerb and back */
    push(w.gx,gy,(s,z)=>{ ctx.save(); ctx.translate(s.x,s.y); drawWalker(ctx,z,w); ctx.restore(); });
  }

  for(const p of S.plots) push(p.gx,p.gy,null,p), items[items.length-1].plot=p;
  items.sort((a,b)=>a.d-b.d);

  for(const it of items){ if(it.plot) drawPlot(it.plot); }
  drawFence();
  for(const it of items){
    const p=iso(it.gx,it.gy), s=w2s(p.x,p.y);
    if(it.plot) drawPlant2(it.plot); else it.fn(s,cam.z);
  }
  /* grade the whole yard to the hour before the readable UI goes on top,
     so bubbles and coins stay legible after dark */
  if(SUN.mul){
    ctx.save();
    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=rgb(SUN.tint); ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }
  if(SUN.night>0.1){
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgba(26,42,84,'+(0.20*SUN.night)+')';
    ctx.fillRect(0,0,VW,VH);
    ctx.restore();
  }
  drawNightLights();

  /* settle the very bottom into shade so the dock sits on ground rather than on
     a flat band of grass */
  const vg=ctx.createLinearGradient(0,VH-150,0,VH);
  vg.addColorStop(0,'rgba(16,52,22,0)');
  vg.addColorStop(0.55,'rgba(16,52,22,.13)');
  vg.addColorStop(1,'rgba(16,52,22,.34)');
  ctx.fillStyle=vg; ctx.fillRect(0,VH-150,VW,150);

  for(const it of items){ if(it.plot) drawBadge(it.plot); }
  drawTutRing();
  butterflies();
  carsUpdate(dt);
  drawCars();
  flockUpdate(dt);
  drawFlock();
  drawWeather();
  drawFX(dt);
}

/* ---------------------------------------------------------------- decor */
/* The garden ornaments. Every one of these is something the player chose to
   spend money on, so each has to look worth the money at a glance: real
   materials, a bit of motion, and something that changes after dark.

   Drawing them straight cost about a millisecond each and a full garden holds
   thirty-five, so the still parts are baked into a sprite exactly the way plants
   are, and only what actually moves — koi, water, moths, a butterfly — is drawn
   live on top. */
const DW=132, DH=124, DOY=98;      /* sprite box, and where the ground line sits in it */
const DSPR=new Map();
function decorSprite(kind,seed,zq,lit){
  const key=kind+'#'+(seed%6)+'#'+zq+'#'+(lit?1:0);
  let s=DSPR.get(key);
  if(s) return s;
  if(DSPR.size>80) DSPR.clear();
  const scale=clamp((zq/4)*DPR*1.15,0.34,2.4);
  const c=document.createElement('canvas');
  c.width=Math.max(8,Math.round(DW*scale));
  c.height=Math.max(8,Math.round(DH*scale));
  const x=c.getContext('2d');
  x.scale(scale,scale); x.translate(DW/2,DOY);
  decorStatic(x,1,kind,seed,lit);
  DSPR.set(key,c);
  return c;
}
function drawDecor(c,z,kind,seed){
  const spr=decorSprite(kind,seed,zStep(),SUN.lit);
  if(kind==='gnome') c.translate(0,Math.sin(T*1.3+seed)*0.8*z);
  if(kind==='hedge'){                       /* the whole bush leans with the wind */
    c.rotate(Math.sin(T*0.9+seed)*0.03);
  }
  c.drawImage(spr,-DW*z/2,-DOY*z,DW*z,DH*z);
  decorLive(c,z,kind,seed);
}

function decorStatic(c,z,kind,seed,lit){
  c.save();
  if(kind==='flower'){
    /* a raised bed with a timber edge, not a green smear on the grass */
    castShadow(c,30,13,12,z);
    const W=19*z, D=9*z, LIP=5*z;
    c.fillStyle='#7A5432';
    diamond(c,0,LIP,W*2.1,D*2.1); c.fill();
    c.fillStyle='#9A6C42';
    diamond(c,0,0,W*2.1,D*2.1); c.fill();
    c.fillStyle='#5A3A22';
    diamond(c,0,0,W*1.72,D*1.72); c.fill();
    c.fillStyle='#6B4527';
    diamond(c,0,-1.4*z,W*1.72,D*1.72); c.fill();
    const cols=['#FF6F91','#FFD166','#B48CE8','#FF8C5A','#FFFFFF','#7FD3F0'];
    for(let i=0;i<9;i++){
      const a=hash(seed+i*7)*TAU, r=hash(seed+i*3)*13*z;
      const x=Math.cos(a)*r, y=Math.sin(a)*r*0.45-3*z;
      const col=cols[(seed+i)%cols.length];
      const lean=(hash(seed*3+i)-0.5)*2.6*z;
      c.strokeStyle='#3F7226'; c.lineWidth=1.7*z; c.lineCap='round';
      c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+lean*0.5,y-5*z,x+lean,y-10*z); c.stroke();
      c.fillStyle='#4E8F30';
      c.beginPath(); c.ellipse(x+lean*0.4-2.4*z,y-4.6*z,2.6*z,1.5*z,-0.5,0,TAU); c.fill();
      c.fillStyle=col;
      for(let k=0;k<6;k++){
        const pa=k/6*TAU+i;
        c.beginPath();
        c.ellipse(x+lean+Math.cos(pa)*2.8*z,y-10*z+Math.sin(pa)*2.8*z,2.3*z,2.3*z,0,0,TAU); c.fill();
      }
      c.fillStyle='#FFE9A0';
      c.beginPath(); c.arc(x+lean,y-10*z,1.8*z,0,TAU); c.fill();
    }
  } else if(kind==='hedge'){
    /* a clipped topiary: three trimmed tiers on a short trunk */
    castShadow(c,32,13,26,z);
    c.fillStyle='#6B4527';
    c.beginPath(); c.ellipse(0,0,9*z,4*z,0,0,TAU); c.fill();
    c.fillStyle='#7A5432';
    c.fillRect(-2.6*z,-13*z,5.2*z,13*z);
    c.save(); c.translate(0,-12*z);
    const tiers=[[0,-2*z,16*z,9*z],[0,-16*z,12.5*z,7.5*z],[0,-27*z,8.5*z,6*z]];
    for(let t=0;t<3;t++){
      const [x,y,rw,rh]=tiers[t];
      c.fillStyle='#2F6B2A';
      c.beginPath(); c.ellipse(x,y,rw,rh,0,0,TAU); c.fill();
      c.fillStyle='#3E8A34';
      c.beginPath(); c.ellipse(x-rw*0.16,y-rh*0.24,rw*0.86,rh*0.82,0,0,TAU); c.fill();
      c.fillStyle='#55A83F';
      for(let i=0;i<6;i++){
        const a=hash(seed*3+t*11+i)*TAU;
        c.beginPath();
        c.arc(x+Math.cos(a)*rw*0.6,y+Math.sin(a)*rh*0.6,rw*0.20,0,TAU); c.fill();
      }
    }
    c.fillStyle='#E8574A';
    for(let i=0;i<5;i++){
      const a=hash(seed*7+i)*TAU;
      c.beginPath(); c.arc(Math.cos(a)*12*z,-8*z+Math.sin(a)*7*z,1.7*z,0,TAU); c.fill();
    }
    c.restore();
  } else if(kind==='bench'){
    /* park bench: cast-iron ends, slatted seat and back */
    castShadow(c,42,15,24,z);
    const slat=(y,h)=>{
      c.fillStyle='#C58C50';
      roundPoly(c,[[-20*z,y],[20*z,y],[20*z,y+h],[-20*z,y+h]],2.2*z); c.fill();
      c.fillStyle='rgba(255,255,255,.18)';
      roundPoly(c,[[-20*z,y],[20*z,y],[20*z,y+h*0.36],[-20*z,y+h*0.36]],2.2*z); c.fill();
    };
    c.strokeStyle='#3E362F'; c.lineWidth=3.2*z; c.lineCap='round';
    for(const s of [-1,1]){
      c.beginPath();
      c.moveTo(s*17*z,2*z); c.lineTo(s*17*z,-11*z);
      c.moveTo(s*17*z,-11*z); c.lineTo(s*21*z,-28*z);
      c.stroke();
      c.beginPath(); c.moveTo(s*13*z,2*z); c.lineTo(s*18*z,-11*z); c.stroke();
    }
    slat(-13*z,5*z); slat(-8*z,5*z);
    c.save(); c.translate(0,-13*z);
    slat(-16*z,4.6*z); slat(-10*z,4.6*z);
    c.restore();
    c.strokeStyle='#3E362F'; c.lineWidth=2.6*z;
    for(const s of [-1,1]){
      c.beginPath(); c.moveTo(s*18*z,-14*z); c.quadraticCurveTo(s*22*z,-20*z,s*19*z,-24*z); c.stroke();
    }
  } else if(kind==='lamp'){
    /* wrought-iron lantern with glass panes */
    castShadow(c,17,7,56,z);
    c.fillStyle='#3E362F';
    c.beginPath(); c.ellipse(0,0,9*z,4.4*z,0,0,TAU); c.fill();
    c.fillStyle='#4A4038';
    roundPoly(c,[[-5*z,-6*z],[5*z,-6*z],[3.6*z,0],[-3.6*z,0]],1.6*z); c.fill();
    const g0=c.createLinearGradient(-3*z,0,3*z,0);
    g0.addColorStop(0,'#4A4038'); g0.addColorStop(0.45,'#6A5E52'); g0.addColorStop(1,'#3A322B');
    c.fillStyle=g0; c.fillRect(-2.6*z,-48*z,5.2*z,44*z);
    c.fillStyle='#3E362F';
    roundPoly(c,[[-9*z,-50*z],[9*z,-50*z],[7*z,-46*z],[-7*z,-46*z]],1.6*z); c.fill();
    c.fillStyle=lit?'rgba(255,222,150,.95)':'rgba(196,222,232,.75)';
    roundPoly(c,[[-7.4*z,-64*z],[7.4*z,-64*z],[8.6*z,-50*z],[-8.6*z,-50*z]],2*z); c.fill();
    c.strokeStyle='#3E362F'; c.lineWidth=1.7*z;
    for(const x of [-2.6,2.6]){ c.beginPath(); c.moveTo(x*z,-63*z); c.lineTo(x*z*1.16,-50*z); c.stroke(); }
    roundPoly(c,[[-7.4*z,-64*z],[7.4*z,-64*z],[8.6*z,-50*z],[-8.6*z,-50*z]],2*z); c.stroke();
    c.fillStyle='#3E362F';
    roundPoly(c,[[-10*z,-72*z],[10*z,-72*z],[7.4*z,-64*z],[-7.4*z,-64*z]],2.4*z); c.fill();
    c.beginPath(); c.arc(0,-75*z,2.4*z,0,TAU); c.fill();
  } else if(kind==='gnome'){
    /* rounder, friendlier, and he holds a little lantern after dark */
    castShadow(c,19,8,30,z);
    c.fillStyle='#2E6BA8';
    roundPoly(c,[[-9*z,-19*z],[9*z,-19*z],[8*z,0],[-8*z,0]],7*z); c.fill();
    c.fillStyle='#3B7FC4';
    roundPoly(c,[[-9*z,-19*z],[0,-19*z],[-1*z,0],[-8*z,0]],7*z); c.fill();
    c.fillStyle='#5E4630';
    for(const s of [-1,1]){ c.beginPath(); c.ellipse(s*4*z,0,3.4*z,2*z,0,0,TAU); c.fill(); }
    c.fillStyle='#F0C9A0';
    c.beginPath(); c.arc(0,-25*z,7.4*z,0,TAU); c.fill();
    c.fillStyle='#F7B7A0';
    c.beginPath(); c.arc(-4*z,-24*z,2*z,0,TAU); c.fill();
    c.beginPath(); c.arc(4*z,-24*z,2*z,0,TAU); c.fill();
    c.fillStyle='#FFFFFF';
    c.beginPath(); c.moveTo(-5.6*z,-23*z);
    c.quadraticCurveTo(-3*z,-6*z,0,-9*z);
    c.quadraticCurveTo(3*z,-6*z,5.6*z,-23*z); c.closePath(); c.fill();
    c.fillStyle='#F2F2F2';
    c.beginPath(); c.ellipse(0,-22.5*z,5.6*z,2.4*z,0,0,TAU); c.fill();
    c.fillStyle='#D4443A';
    c.beginPath(); c.moveTo(-9.5*z,-28*z);
    c.quadraticCurveTo(-2*z,-32*z,9.5*z,-28*z);
    c.quadraticCurveTo(3*z,-38*z,1.5*z,-48*z);
    c.quadraticCurveTo(-4*z,-38*z,-9.5*z,-28*z); c.closePath(); c.fill();
    c.fillStyle='#B33A31';
    c.beginPath(); c.ellipse(0,-28*z,9.5*z,2.2*z,0,0,TAU); c.fill();
    c.fillStyle='#3A2A1C';
    c.beginPath(); c.arc(-2.8*z,-26.5*z,1.4*z,0,TAU); c.fill();
    c.beginPath(); c.arc(2.8*z,-26.5*z,1.4*z,0,TAU); c.fill();
    if(lit){
      c.fillStyle='#FFD98A';
      c.beginPath(); c.arc(10*z,-13*z,3.4*z,0,TAU); c.fill();
    }
  } else if(kind==='pond'){
    /* a stone-rimmed pool with koi, lilies and reeds */
    castShadow(c,68,29,6,z);
    c.fillStyle='#8A7A5C';
    c.beginPath(); c.ellipse(0,2*z,38*z,18*z,0,0,TAU); c.fill();
    c.fillStyle='#A2916F';
    c.beginPath(); c.ellipse(0,0,38*z,18*z,0,0,TAU); c.fill();
    for(let i=0;i<14;i++){
      const a=i/14*TAU;
      c.fillStyle=i%2?'#B6A582':'#9C8B69';
      c.beginPath(); c.ellipse(Math.cos(a)*36*z,Math.sin(a)*16.5*z,5.4*z,3.2*z,a*0.3,0,TAU); c.fill();
    }
    const g=c.createLinearGradient(0,-14*z,0,14*z);
    g.addColorStop(0,'#63CDEA'); g.addColorStop(0.55,'#3D9FD0'); g.addColorStop(1,'#24709F');
    c.fillStyle=g;
    c.beginPath(); c.ellipse(0,0,31*z,13*z,0,0,TAU); c.fill();
    for(let i=0;i<3;i++){
      const x=(hash(seed+i)-0.5)*42*z, y=(hash(seed+i*3)-0.5)*17*z;
      c.fillStyle='#3E9440';
      c.beginPath(); c.ellipse(x,y,7*z,3.8*z,0,0,TAU); c.fill();
      c.fillStyle='#2F7A33';
      c.beginPath(); c.moveTo(x,y); c.lineTo(x+5*z,y-2*z); c.lineTo(x+5*z,y+2*z); c.closePath(); c.fill();
      if(i===0){
        c.fillStyle='#F6A6C4';
        for(let k=0;k<5;k++){ const a=k/5*TAU;
          c.beginPath(); c.ellipse(x+Math.cos(a)*2*z,y-2*z+Math.sin(a)*1.2*z,2*z,1.4*z,a,0,TAU); c.fill(); }
        c.fillStyle='#FFE9A0'; c.beginPath(); c.arc(x,y-2*z,1.2*z,0,TAU); c.fill();
      }
    }

/* only what actually moves, drawn straight onto the scene */
function decorLive(c,z,kind,seed){
  if(kind==='flower'){
    if(SUN.lit||z<0.45) return;
    const bt=T*0.9+seed;
    const bx=Math.cos(bt)*18*z, by=-20*z+Math.sin(bt*1.7)*7*z;
    const fl=Math.abs(Math.sin(T*9+seed));
    c.fillStyle='#FFF0A8';
    for(const s of [-1,1]){
      c.beginPath();
      c.ellipse(bx+s*3*z*(0.35+fl*0.65),by,3*z*(0.35+fl*0.65),4*z,s*0.4,0,TAU); c.fill();
    }
    c.fillStyle='#7A5432';
    c.beginPath(); c.ellipse(bx,by,1*z,3.2*z,0,0,TAU); c.fill();
  } else if(kind==='lamp'){
    if(!SUN.lit) return;
    c.save(); c.globalCompositeOperation='lighter';
    const g=c.createRadialGradient(0,-57*z,2,0,-57*z,44*z);
    g.addColorStop(0,'rgba(255,208,120,.6)'); g.addColorStop(1,'rgba(255,208,120,0)');
    c.fillStyle=g; c.beginPath(); c.arc(0,-57*z,44*z,0,TAU); c.fill();
    c.restore();
    if(z<0.45) return;
    c.fillStyle='rgba(255,244,210,.8)';
    for(let i=0;i<2;i++){
      const a=T*2.2+i*3.1+seed;
      c.beginPath();
      c.ellipse(Math.cos(a)*13*z,-57*z+Math.sin(a*1.4)*7*z,2.2*z,1.5*z,a,0,TAU); c.fill();
    }
  } else if(kind==='gnome'){
    if(!SUN.lit) return;
    c.save(); c.globalCompositeOperation='lighter';
    const g=c.createRadialGradient(10*z,-13*z,1,10*z,-13*z,20*z);
    g.addColorStop(0,'rgba(255,214,140,.5)'); g.addColorStop(1,'rgba(255,214,140,0)');
    c.fillStyle=g; c.beginPath(); c.arc(10*z,-13*z,20*z,0,TAU); c.fill();
    c.restore();
  } else if(kind==='pond'){
    if(z<0.36) return;
    c.save();
    c.beginPath(); c.ellipse(0,0,31*z,13*z,0,0,TAU); c.clip();
    for(let i=0;i<3;i++){
      const a=T*(0.5+i*0.16)+i*2.1+seed;
      const x=Math.cos(a)*20*z, y=Math.sin(a)*8*z;
      c.save(); c.translate(x,y); c.rotate(Math.cos(a)*0.5+1.6);
      c.fillStyle=['#F58A3C','#F5F0E4','#E4573C'][i%3];
      c.beginPath(); c.ellipse(0,0,3*z,7*z,0,0,TAU); c.fill();
      c.beginPath();
      c.moveTo(0,6*z); c.lineTo(-3*z,12*z+Math.sin(T*7+i)*1.6*z); c.lineTo(3*z,12*z); c.closePath(); c.fill();
      c.restore();
    }
    c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=1.6*z;
    for(let i=0;i<3;i++){
      const r=(T*0.35+i*0.33)%1;
      c.globalAlpha=(1-r)*0.55;
      c.beginPath(); c.ellipse(0,0,r*28*z,r*11*z,0,0,TAU); c.stroke();
    }
    c.restore();
  } else if(kind==='fountain'){
    c.save();
    c.globalAlpha=0.8; c.strokeStyle='#CFEEFB'; c.lineWidth=2.2*z; c.lineCap='round';
    for(let i=0;i<8;i++){
      const a=i/8*TAU;
      const dx=Math.cos(a), dy=Math.sin(a)*0.42;
      c.beginPath(); c.moveTo(0,-53*z);
      c.quadraticCurveTo(dx*11*z,-60*z,dx*13*z,-36*z+dy*5*z);
      c.stroke();
    }
    c.lineWidth=1.8*z;
    for(let i=0;i<6;i++){
      const a=i/6*TAU+0.4;
      const dx=Math.cos(a), dy=Math.sin(a)*0.42;
      c.beginPath(); c.moveTo(dx*14*z,-34*z+dy*6*z);
      c.quadraticCurveTo(dx*22*z,-24*z,dx*24*z,dy*11*z);
      c.stroke();
    }
    c.globalAlpha=1;
    c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=1.5*z;
    for(let i=0;i<3;i++){
      const r=(T*0.6+i*0.33)%1;
      c.globalAlpha=(1-r)*0.6;
      c.beginPath(); c.ellipse(0,0,r*30*z,r*13*z,0,0,TAU); c.stroke();
    }
    c.globalAlpha=1;
    for(let i=0;i<6;i++){
      const ph=(T*0.9+i*0.17)%1;
      c.globalAlpha=(1-ph)*0.5; c.fillStyle='#FFFFFF';
      c.beginPath(); c.arc(Math.sin(i*2.3+T)*20*z,-46*z+ph*30*z,2.2*z,0,TAU); c.fill();
    }
    c.globalAlpha=1;
    if(SUN.lit){
      c.globalCompositeOperation='lighter';
      const gl=c.createRadialGradient(0,-16*z,3,0,-16*z,52*z);
      gl.addColorStop(0,'rgba(120,200,255,.30)'); gl.addColorStop(1,'rgba(120,200,255,0)');
      c.fillStyle=gl; c.beginPath(); c.arc(0,-16*z,52*z,0,TAU); c.fill();
    }
    c.restore();
  }
}
function decorPlacements(){
  const slots=decorSlots(), out=[];
  let i=0;
  for(const d of DECOR){
    const n=(S.decor&&S.decor[d.id])||0;
    for(let k=0;k<n;k++){
      const s=slots[i%slots.length]; i++;
      if(!s) break;
      out.push({gx:s[0],gy:s[1],kind:d.id,seed:i*13});
    }
  }
  return out;
}

/* ---------------------------------------------------------------- the street
   A pavement runs along the front of the property and people use it: someone
   photographs the farm, a couple slows the pram to look in, a jogger goes past
   without noticing. Everyone is generated — skin, hair, clothes, height — so the
   same person never walks by twice. */
const SKIN_T=['#F2CDA7','#E5B183','#CE9364','#B07A47','#8E5D33','#6E4527'];
const HAIR_T=['#241C15','#3E2C1E','#6B4726','#A9761F','#C9A227','#B0552E','#6A6A6A','#E4DCC8'];
const TOP_T=['#E4574B','#4E8FCB','#F2C14E','#74BE7C','#A97BD6','#F5F2EA','#39404E','#FF9A5A','#2FBFA8','#E77FA8'];
const BOT_T=['#2E3A4A','#39404E','#5A4634','#243049','#6C6C74','#1E2836','#7A6A58'];
const pick=a=>a[(Math.random()*a.length)|0];
function makeGuy(scale){
  return {
    skin:pick(SKIN_T), hair:pick(HAIR_T), top:pick(TOP_T), bot:pick(BOT_T),
    style:(Math.random()*4)|0, h:(scale||1)*(0.92+Math.random()*0.18),
    hat:Math.random()<0.18?pick(TOP_T):null,
    bag:Math.random()<0.25
  };
}
/* one adult, drawn from the parts a walk cycle needs */
function drawGuy(c,z,g,ph,walking,arms){
  const H=g.h, bob=walking?Math.abs(Math.sin(ph))*2.2*z*H:0;
  const sw=walking?Math.sin(ph):0;
  c.save(); c.translate(0,-bob);
  c.save(); c.translate(0,bob); castShadow(c,22*H,9*H,58*H,z); c.restore();
  /* legs */
  for(const s of [-1,1]){
    const a=(s>0?sw:-sw)*0.5;
    c.save(); c.translate(s*3.2*z*H,-19*z*H); c.rotate(a);
    c.fillStyle=g.bot;
    roundPoly(c,[[-3.4*z*H,0],[3.4*z*H,0],[3*z*H,20*z*H],[-3*z*H,20*z*H]],2.6*z*H); c.fill();
    c.fillStyle='#3A2F26';
    roundPoly(c,[[-3.4*z*H,19*z*H],[4.4*z*H,19*z*H],[4.4*z*H,22.5*z*H],[-3.4*z*H,22.5*z*H]],1.6*z*H); c.fill();
    c.restore();
  }
  /* torso */
  c.fillStyle=g.top;
  roundPoly(c,[[-7*z*H,-38*z*H],[7*z*H,-38*z*H],[6*z*H,-18*z*H],[-6*z*H,-18*z*H]],4*z*H); c.fill();
  /* arms */
  for(const s of [-1,1]){
    const a=arms==='up'?(s*0.3-2.0):(arms==='point'&&s>0?-1.15:(s>0?-sw:sw)*0.55);
    c.save(); c.translate(s*7.5*z*H,-35*z*H); c.rotate(a);
    c.fillStyle=g.top;
    roundPoly(c,[[-2.8*z*H,0],[2.8*z*H,0],[2.4*z*H,11*z*H],[-2.4*z*H,11*z*H]],2.4*z*H); c.fill();
    c.fillStyle=g.skin;
    roundPoly(c,[[-2.4*z*H,10*z*H],[2.4*z*H,10*z*H],[2.2*z*H,18*z*H],[-2.2*z*H,18*z*H]],2.2*z*H); c.fill();
    c.restore();
  }
  if(g.bag){
    c.fillStyle='#6B4A2E';
    roundPoly(c,[[-9*z*H,-32*z*H],[-3*z*H,-32*z*H],[-3*z*H,-24*z*H],[-9*z*H,-24*z*H]],2*z*H); c.fill();
  }
  /* head */
  c.fillStyle=g.skin;
  roundPoly(c,[[-2.6*z*H,-42*z*H],[2.6*z*H,-42*z*H],[2.6*z*H,-37*z*H],[-2.6*z*H,-37*z*H]],1.4*z*H); c.fill();
  c.beginPath(); c.ellipse(0,-48*z*H,7*z*H,7.8*z*H,0,0,TAU); c.fill();
  /* hair by style */
  c.fillStyle=g.hair;
  if(g.style===0){ c.beginPath(); c.ellipse(0,-51*z*H,7.2*z*H,6*z*H,0,Math.PI,TAU); c.fill();
    c.fillRect(-7.2*z*H,-51*z*H,14.4*z*H,2*z*H); }
  else if(g.style===1){ c.beginPath(); c.ellipse(0,-50*z*H,7.6*z*H,7*z*H,0,0,TAU); c.fill();
    c.fillStyle=g.skin; c.beginPath(); c.ellipse(0,-46*z*H,6*z*H,5.4*z*H,0,0,TAU); c.fill(); }
  else if(g.style===2){ for(let i=0;i<6;i++){ const a=Math.PI+(i/5)*Math.PI;
      c.beginPath(); c.arc(Math.cos(a)*6.4*z*H,-51*z*H+Math.sin(a)*4.6*z*H,2.9*z*H,0,TAU); c.fill(); } }
  else { c.beginPath(); c.ellipse(0,-51*z*H,7.3*z*H,5.6*z*H,0,Math.PI,TAU); c.fill();
    c.beginPath(); c.ellipse(-6*z*H,-45*z*H,3*z*H,7*z*H,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(6*z*H,-45*z*H,3*z*H,7*z*H,0,0,TAU); c.fill(); }
  if(g.hat){ c.fillStyle=g.hat;
    c.beginPath(); c.ellipse(0,-54*z*H,9*z*H,2.4*z*H,0,0,TAU); c.fill();
    roundPoly(c,[[-5.4*z*H,-60*z*H],[5.4*z*H,-60*z*H],[6*z*H,-54*z*H],[-6*z*H,-54*z*H]],2*z*H); c.fill(); }
  /* face */
  c.fillStyle='#2A1F16';
  c.beginPath(); c.arc(-2.4*z*H,-48*z*H,1.1*z*H,0,TAU); c.fill();
  c.beginPath(); c.arc(2.4*z*H,-48*z*H,1.1*z*H,0,TAU); c.fill();
  c.restore();
  return bob;
}

function drawDog(c,z,k,ph){

    c.beginPath(); c.moveTo(s*5*z*k,-8*z*k); c.lineTo(s*5*z*k+a,0); c.stroke(); }
  c.fillStyle='#8A6238';
  roundPoly(c,[[-9*z*k,-16*z*k],[8*z*k,-16*z*k],[8*z*k,-7*z*k],[-9*z*k,-7*z*k]],4*z*k); c.fill();
  c.beginPath(); c.arc(10*z*k,-19*z*k,5*z*k,0,TAU); c.fill();
  c.fillStyle='#6B4A2E';
  c.beginPath(); c.ellipse(8*z*k,-23*z*k,2*z*k,3.4*z*k,-0.3,0,TAU); c.fill();
  c.strokeStyle='#8A6238'; c.lineWidth=2*z*k;
  c.beginPath(); c.moveTo(-9*z*k,-14*z*k);
  c.quadraticCurveTo(-15*z*k,-20*z*k,-12*z*k,-24*z*k); c.stroke();
  c.fillStyle='#2A1F16';
  c.beginPath(); c.arc(12*z*k,-20*z*k,1.1*z*k,0,TAU); c.fill();
  c.restore();
}

/* ------------------------------------------------------------------ street
   People are what separates a diorama from a place. Nobody out here walks a
   straight line: every walker carries its own drift, its own dawdle and its own
   errand, and the cast changes with the clock the way a real street does. */
const WALKERS=[];
let walkT=1.0;
function streetK(){ const b=yardB(); return b.x1+b.y1+4.6; }   /* depth of the pavement out front */

const CAST={
  dawn : ['jog','jog','dog','walk','bike','elder','walk'],
  morn : ['walk','walk','jog','dog','kid','bike','shop','phone','couple','courier'],
  noon : ['walk','tourist','shop','couple','kid','dog','phone','courier','tourist','elder'],
  eve  : ['couple','couple','walk','dog','friends','bike','tourist','shop','kid','skater'],
  night: ['stoner','stoner','friends','night','couple','walk','phone','cat','skater','stoner']
};
function castNow(){
  const h=SUN.h;
  if(h<5.0||h>=22.0) return CAST.night;
  if(h<7.5)  return CAST.dawn;
  if(h<11.0) return CAST.morn;
  if(h<16.5) return CAST.noon;
  if(h<20.0) return CAST.eve;
  return CAST.night;
}
/* how busy the street is: dead at four in the morning, humming at six in the
   evening. Returns the gap in seconds between arrivals. */
function crowdGap(){
  const h=SUN.h;
  if(h<5.0)  return 4.0+Math.random()*6;
  if(h<7.0)  return 2.2+Math.random()*3;
  if(h<10.0) return 0.9+Math.random()*1.6;
  if(h<16.0) return 1.2+Math.random()*2.2;
  if(h<20.0) return 0.8+Math.random()*1.6;
  if(h<22.5) return 1.4+Math.random()*2.4;
  return 2.6+Math.random()*4;
}

  phone  :['כן כן','אני בדרך','שמע רגע']
};
const HOODIE=['#3A3F52','#2E2E38','#4A3A5C','#33474A','#5A3A3A'];

function walkerSpeed(kind){
  if(kind==='jog')    return 1.95+Math.random()*0.35;
  if(kind==='bike')   return 2.6+Math.random()*0.6;
  if(kind==='skater') return 2.2+Math.random()*0.5;
  if(kind==='elder')  return 0.42+Math.random()*0.12;
  if(kind==='kid')    return 1.35+Math.random()*0.5;
  if(kind==='stoner') return 0.42+Math.random()*0.18;
  if(kind==='cat')    return 0.7+Math.random()*0.4;
  if(kind==='courier')return 1.05+Math.random()*0.25;
  if(kind==='couple') return 0.6+Math.random()*0.14;
  if(kind==='friends')return 0.66+Math.random()*0.16;
  return 0.72+Math.random()*0.3;
}
function spawnWalker(){
  /* Walking one tile along the street moves you two tiles of screen x, so the
     span has to come from how much street is actually on screen — a fixed one
     had everybody living most of their life off the side of the picture. */
  const K=streetK(), dir=Math.random()<0.5?1:-1;
  const span=clamp(2.2+(VW*0.5)/(TW*Math.max(0.22,cam.z)),4,18);
  const kind=pick(castNow());
  const base=walkerSpeed(kind);
  const w={
    kind, dir, K, span, face:dir,
    gx:K/2+(dir>0?-span:span),
    /* where on the verge they walk, and how much they weave while they do it —
       two slow waves at different rates, so no two people trace the same line */
    lane:-2.2+Math.random()*3.8,
    tlane:0, off:0,
    wob:Math.random()*TAU, wobA:0.10+Math.random()*0.34, wobF:0.10+Math.random()*0.22,
    base, sp:base, dawdle:0,
    state:'walk', t:1.2+Math.random()*5, ph:Math.random()*6,
    g:makeGuy(kind==='kid'?0.66:kind==='elder'?0.9:kind==='skater'?0.74:1),
    g2:(kind==='couple'||kind==='friends')?makeGuy(kind==='friends'?1:0.95):null,
    flash:0, say:null, sayT:0, puff:0,
    seed:(Math.random()*1e6)|0
  };
  w.tlane=w.lane;
  if(kind==='stoner'||kind==='night') w.g.hat=pick(HOODIE);
  if(kind==='jog'){ w.g.top=pick(['#E8574A','#2FA9A0','#3D6FE0','#F0A23C']); w.g.bot='#2E3440'; }
  if(kind==='courier'){ w.g.top='#E0552F'; w.g.bag=false; }
  WALKERS.push(w);
}
/* pick a new errand for someone who has been walking a while */
function walkerIdea(w){
  const near=Math.abs(w.gx-w.K/2)<5.5;
  const r=Math.random();
  if(near&&w.kind==='tourist'&&r<0.55){ w.state='photo'; w.t=2.2+Math.random()*1.6; w.flash=0.95; return; }
  if(near&&w.kind==='stoner'&&r<0.6){ w.state='smoke'; w.t=3.2+Math.random()*3; return; }
  if(near&&r<0.30){ w.state='look'; w.t=1.4+Math.random()*2.2; return; }
  if((w.kind==='friends'||w.kind==='couple')&&r<0.45){ w.state='chat'; w.t=2.0+Math.random()*2.6; return; }
  if(w.kind==='dog'&&r<0.5){ w.state='sniff'; w.t=1.6+Math.random()*2; return; }
  if(w.kind==='phone'&&r<0.5){ w.state='pause'; w.t=1.6+Math.random()*2.4; return; }
  if(r<0.16){ w.state='pause'; w.t=1.3+Math.random()*1.0; return; }
  if(r<0.34){ w.state='pause'; w.t=0.8+Math.random()*1.8; return; }
  /* no stop — just change the line they are walking and how fast */
  w.tlane=clamp(w.lane+(Math.random()-0.5)*3.2,-2.2,1.6);
  w.dawdle=0.55+Math.random()*0.7;
  w.t=2.5+Math.random()*5.5;
}
function walkerSay(w){
  const pool=SAY[w.kind]||SAY.walk;
  w.say=pick(pool); w.sayT=1.6+Math.random()*1.2;
}
function walkersUpdate(){
  walkT-=DT;
  if(walkT<=0){ walkT=crowdGap(); if(WALKERS.length<11) spawnWalker(); }
  const K=streetK();
  for(let i=WALKERS.length-1;i>=0;i--){
    const w=WALKERS[i];
    w.K=K; w.t-=DT;
    if(w.sayT>0){ w.sayT-=DT; if(w.sayT<=0) w.say=null; }

    /* the weave: two slow waves plus a lane they drift towards, so the path is
       a wandering line rather than a rail */
    w.lane+=(w.tlane-w.lane)*Math.min(1,DT*0.7);
    w.off=w.lane
        + Math.sin(T*w.wobF*TAU+w.wob)*w.wobA
        + Math.sin(T*w.wobF*1.83*TAU+w.wob*2.3)*w.wobA*0.45;

    if(w.state==='walk'){
      /* speed breathes, and a dawdle drags it down for a while */
      const breathe=0.88+0.12*Math.sin(T*0.7+w.wob);
      const slow=w.dawdle>0?(w.dawdle-=DT,0.62):1;
      w.sp=w.base*breathe*slow;
      w.gx+=w.dir*w.sp*DT*0.92;
      w.ph+=DT*w.sp*(w.kind==='bike'||w.kind==='skater'?4.2:7);
      if(w.t<=0) walkerIdea(w);
      if(w.say===null&&Math.random()<DT*0.05) walkerSay(w);
    } else {
      if(w.state==='photo'){
        if(w.flash>0) w.flash-=DT*1.5;
        if(w.say===null&&Math.random()<DT*0.5) walkerSay(w);
      }
      if(w.state==='smoke'){ w.puff+=DT; if(w.say===null&&Math.random()<DT*0.4) walkerSay(w); }
      if(w.state==='chat'&&w.say===null&&Math.random()<DT*1.1) walkerSay(w);
      if(w.t<=0){ w.state='walk'; w.t=2.2+Math.random()*5; w.dawdle=0; }
    }
    if(w.dir>0 ? w.gx>K/2+w.span : w.gx<K/2-w.span) WALKERS.splice(i,1);
  }
}

  c.moveTo(1*z*H,-R); c.lineTo(9*z*H,-22*z*H); c.lineTo(-2*z*H,-20*z*H);

  c.beginPath(); c.ellipse(6*z*H,-46*z*H,6.6*z*H,7*z*H,0,0,TAU); c.fill();
  c.fillStyle='#E8574A';

  c.fillStyle='#2A1F16';

}

function drawCat(c,z,k,ph){

  c.beginPath(); c.moveTo(9.5*z*k,-17.6*z*k); c.lineTo(11.5*z*k,-20.6*z*k); c.lineTo(11.6*z*k,-16.6*z*k); c.closePath(); c.fill();
  c.strokeStyle='#5A5058'; c.lineWidth=1.8*z*k;

  c.quadraticCurveTo(-13*z*k,-14*z*k,-11*z*k,-20*z*k+Math.sin(ph*2)*2*z*k); c.stroke();
  c.fillStyle='#C8E060';
  c.beginPath(); c.arc(9.6*z*k,-15*z*k,1*z*k,0,TAU); c.fill();

/* a short line over someone's head — drawn unmirrored, one whole string */
